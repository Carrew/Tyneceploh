<!DOCTYPE html>
<html>
<head>
  <title>Create Admin - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --maroon:#800000;
      --pink:#ffc0cb;
      --bg:#0b0b0f;
      --card:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.1);
      --text:#ffffff;
      --muted:#bbbbbb;
      --green:#27ae60;
      --red:#e74c3c;
      --blue:#3498db;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:20px;
      font-family:system-ui,sans-serif;
      background:
      radial-gradient(circle at top,#240012 0%,#0b0b0f 70%);
      color:var(--text);
      min-height:100vh;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    h2{
      text-align:center;
      color:var(--pink);
      margin-bottom:20px;
    }

    .top-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
      margin-bottom:20px;
    }

    .stat{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      backdrop-filter:blur(10px);
    }

    .stat small{
      color:var(--muted);
      display:block;
      margin-bottom:8px;
    }

    .stat h3{
      margin:0;
      font-size:28px;
    }

    .layout{
      display:grid;
      grid-template-columns:360px 1fr;
      gap:20px;
    }

    @media(max-width:900px){
      .layout{
        grid-template-columns:1fr;
      }
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:20px;
      backdrop-filter:blur(10px);
    }

    .section-title{
      margin-top:0;
      margin-bottom:15px;
      color:var(--pink);
    }

    input,
    select{
      width:100%;
      padding:13px;
      border:none;
      outline:none;
      border-radius:12px;
      margin-top:10px;
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:15px;
    }

    input::placeholder{
      color:#d1d1d1;
    }

    input[type="file"]{
      padding:10px;
    }

    button{
      width:100%;
      border:none;
      padding:14px;
      border-radius:12px;
      margin-top:12px;
      cursor:pointer;
      font-weight:bold;
      transition:0.2s ease;
    }

    button:hover{
      transform:translateY(-1px);
      opacity:0.95;
    }

    .primary-btn{
      background:linear-gradient(135deg,var(--maroon),var(--pink));
      color:white;
    }

    .danger-btn{
      background:var(--red);
      color:white;
    }

    .secondary-btn{
      background:rgba(255,255,255,0.1);
      color:white;
    }

    .preview{
      width:100px;
      height:100px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid var(--pink);
      margin:15px auto 5px;
      display:block;
      background:#222;
    }

    .notify{
      padding:14px;
      border-radius:12px;
      margin-top:15px;
      display:none;
      font-size:14px;
      animation:fadeIn .25s ease;
    }

    .success{
      background:rgba(39,174,96,0.15);
      border:1px solid rgba(39,174,96,0.4);
      color:#7dffb0;
    }

    .error{
      background:rgba(231,76,60,0.15);
      border:1px solid rgba(231,76,60,0.4);
      color:#ffb0a8;
    }

    .loading{
      background:rgba(52,152,219,0.15);
      border:1px solid rgba(52,152,219,0.4);
      color:#9bd6ff;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .search{
      margin-bottom:15px;
    }

    .admin-list{
      display:grid;
      gap:15px;
    }

    .admin-card{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:18px;
      padding:16px;
    }

    .admin-top{
      display:flex;
      gap:15px;
      align-items:center;
      flex-wrap:wrap;
    }

    .admin-top img{
      width:70px;
      height:70px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--pink);
      background:#222;
    }

    .admin-name{
      font-size:18px;
      font-weight:bold;
    }

    .badge{
      display:inline-block;
      padding:5px 12px;
      border-radius:30px;
      font-size:12px;
      margin-top:6px;
      background:rgba(255,192,203,0.15);
      color:var(--pink);
      border:1px solid rgba(255,192,203,0.25);
    }

    .meta{
      margin-top:10px;
      color:#d5d5d5;
      font-size:14px;
      line-height:1.7;
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top:15px;
      flex-wrap:wrap;
    }

    .actions button{
      flex:1;
      margin-top:0;
    }

    .empty{
      text-align:center;
      padding:30px;
      color:#bbb;
    }

    .pin-box{
      margin-top:12px;
      padding:12px;
      border-radius:12px;
      background:rgba(255,255,255,0.06);
      border:1px dashed rgba(255,255,255,0.15);
      font-size:14px;
      color:#ffe8ee;
    }

    .small{
      color:#aaa;
      font-size:12px;
      margin-top:5px;
      line-height:1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>👑 Admin Management System</h2>

  <div class="top-grid">

    <div class="stat">
      <small>Total Admins</small>
      <h3 id="totalAdmins">0</h3>
    </div>

    <div class="stat">
      <small>Active Admins</small>
      <h3 id="activeAdmins">0</h3>
    </div>

    <div class="stat">
      <small>System Access</small>
      <h3>Full</h3>
    </div>

  </div>

  <div class="layout">

    <!-- LEFT -->
    <div class="card">

      <h3 class="section-title">Create / Edit Admin</h3>

      <img
        src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
        id="preview"
        class="preview"
      >

      <input type="file" id="photo" accept="image/*">

      <input id="name" placeholder="Admin Name">

      <input id="contact" placeholder="Phone Number">

      <input id="email" placeholder="Email Address">

      <input id="address" placeholder="Address">

      <select id="status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>

      <input type="hidden" id="editId">

      <button class="primary-btn" onclick="saveAdmin()" id="saveBtn">
        Create Admin
      </button>

      <button class="secondary-btn" onclick="resetForm()">
        Clear Form
      </button>

      <div class="small">
        Admin ID and PIN are auto generated securely.
      </div>

      <div id="notify" class="notify"></div>

      <div id="pinBox"></div>

    </div>

    <!-- RIGHT -->
    <div class="card">

      <h3 class="section-title">All Admins</h3>

      <input
        id="search"
        class="search"
        placeholder="Search admin by name or ID..."
        oninput="renderAdmins()"
      >

      <div id="list" class="admin-list"></div>

    </div>

  </div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

const DEFAULT_PHOTO =
"https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

let adminsCache = [];

// -------------------------
// NOTIFICATIONS
// -------------------------
function showMessage(type, text){

  const box = document.getElementById("notify");

  box.className = `notify ${type}`;
  box.style.display = "block";
  box.innerHTML = text;

  clearTimeout(box.timer);

  box.timer = setTimeout(()=>{
    box.style.display = "none";
  },5000);
}

// -------------------------
// PREVIEW IMAGE
// -------------------------
document.getElementById("photo")
.addEventListener("change", e=>{

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(ev){
    document.getElementById("preview").src = ev.target.result;
  };

  reader.readAsDataURL(file);

});

// -------------------------
// GENERATORS
// -------------------------
function generateAdminId(count){
  return `ADM${String(count + 1).padStart(3,"0")}`;
}

function generatePin(){
  return Math.floor(1000 + Math.random() * 9000).toString();
}

// -------------------------
// CLOUDINARY
// -------------------------
async function uploadImage(file){

  if(!file) return "";

  const formData = new FormData();

  formData.append("file", file);
  formData.append("upload_preset", "Tyneceploh");

  const response = await fetch(
    "https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload",
    {
      method:"POST",
      body:formData
    }
  );

  const data = await response.json();

  return data.secure_url || "";
}

// -------------------------
// LOAD ADMINS
// -------------------------
async function loadAdmins(){

  document.getElementById("list").innerHTML =
  `<div class="empty">Loading admins...</div>`;

  const snap = await getDocs(collection(db,"users"));

  adminsCache = [];

  snap.forEach(d=>{

    const data = d.data();

    if(data.role === "admin"){

      adminsCache.push({
        ...data,
        docId:d.id
      });

    }

  });

  updateStats();
  renderAdmins();
}

function updateStats(){

  document.getElementById("totalAdmins").innerText =
  adminsCache.length;

  document.getElementById("activeAdmins").innerText =
  adminsCache.filter(a=>a.status === "active").length;

}

// -------------------------
// RENDER
// -------------------------
window.renderAdmins = function(){

  const search =
  document.getElementById("search")
  .value
  .toLowerCase();

  const filtered = adminsCache.filter(a=>

    (a.name || "")
    .toLowerCase()
    .includes(search)

    ||

    (a.userId || "")
    .toLowerCase()
    .includes(search)

  );

  const list = document.getElementById("list");

  if(filtered.length === 0){

    list.innerHTML =
    `<div class="empty">No admins found.</div>`;

    return;
  }

  list.innerHTML = filtered.map(a=>`

    <div class="admin-card">

      <div class="admin-top">

        <img src="${a.photoURL || DEFAULT_PHOTO}">

        <div>

          <div class="admin-name">
            ${a.name || "Unnamed"}
          </div>

          <div class="badge">
            🆔 ${a.userId}
          </div>

        </div>

      </div>

      <div class="meta">

        Status:
        <b>${a.status || "active"}</b>
        <br>

        Contact:
        ${a.contact || "-"}

        <br>

        Email:
        ${a.email || "-"}

        <br>

        Address:
        ${a.address || "-"}

      </div>

      <div class="actions">

        <button
          class="secondary-btn"
          onclick="editAdmin('${a.docId}')"
        >
          Edit
        </button>

        <button
          class="danger-btn"
          onclick="deleteAdmin('${a.docId}')"
        >
          Delete
        </button>

      </div>

    </div>

  `).join("");

};

// -------------------------
// SAVE ADMIN
// -------------------------
window.saveAdmin = async function(){

  const btn = document.getElementById("saveBtn");

  const name =
  document.getElementById("name").value.trim();

  const contact =
  document.getElementById("contact").value.trim();

  const email =
  document.getElementById("email").value.trim();

  const address =
  document.getElementById("address").value.trim();

  const status =
  document.getElementById("status").value;

  const editId =
  document.getElementById("editId").value;

  if(!name){

    showMessage(
      "error",
      "Please enter admin name."
    );

    return;
  }

  btn.disabled = true;
  btn.innerText = "Processing...";

  showMessage(
    "loading",
    "Saving admin account..."
  );

  try{

    const file =
    document.getElementById("photo").files[0];

    let photoURL = "";

    if(file){

      photoURL = await uploadImage(file);

    }

    const data = {

      name,
      contact,
      email,
      address,
      status,

      role:"admin",

      updatedAt:Date.now()

    };

    if(photoURL){
      data.photoURL = photoURL;
    }

    // CREATE
    if(!editId){

      const userId =
      generateAdminId(adminsCache.length);

      const pin = generatePin();

      data.userId = userId;
      data.pin = pin;
      data.createdAt = Date.now();

      await addDoc(
        collection(db,"users"),
        data
      );

      document.getElementById("pinBox").innerHTML = `
        <div class="pin-box">
          ✅ Admin created successfully.<br><br>

          <b>ID:</b> ${userId}<br>
          <b>PIN:</b> ${pin}
        </div>
      `;

      showMessage(
        "success",
        "New admin account created successfully."
      );

    }

    // UPDATE
    else{

      await updateDoc(
        doc(db,"users",editId),
        data
      );

      showMessage(
        "success",
        "Admin updated successfully."
      );

    }

    resetForm();
    loadAdmins();

  }catch(err){

    console.error(err);

    showMessage(
      "error",
      "Something went wrong while saving admin."
    );

  }

  btn.disabled = false;
  btn.innerText = "Create Admin";

};

// -------------------------
// EDIT
// -------------------------
window.editAdmin = function(id){

  const admin =
  adminsCache.find(a=>a.docId === id);

  if(!admin) return;

  document.getElementById("editId").value =
  admin.docId;

  document.getElementById("name").value =
  admin.name || "";

  document.getElementById("contact").value =
  admin.contact || "";

  document.getElementById("email").value =
  admin.email || "";

  document.getElementById("address").value =
  admin.address || "";

  document.getElementById("status").value =
  admin.status || "active";

  document.getElementById("preview").src =
  admin.photoURL || DEFAULT_PHOTO;

  document.getElementById("saveBtn").innerText =
  "Update Admin";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};

// -------------------------
// DELETE
// -------------------------
window.deleteAdmin = async function(id){

  const sure = confirm(
    "Delete this admin account?"
  );

  if(!sure) return;

  try{

    await deleteDoc(doc(db,"users",id));

    showMessage(
      "success",
      "Admin deleted successfully."
    );

    loadAdmins();

  }catch(err){

    console.error(err);

    showMessage(
      "error",
      "Failed to delete admin."
    );

  }

};

// -------------------------
// RESET FORM
// -------------------------
window.resetForm = function(){

  document.getElementById("editId").value = "";

  document.getElementById("name").value = "";
  document.getElementById("contact").value = "";
  document.getElementById("email").value = "";
  document.getElementById("address").value = "";

  document.getElementById("status").value =
  "active";

  document.getElementById("photo").value = "";

  document.getElementById("preview").src =
  DEFAULT_PHOTO;

  document.getElementById("saveBtn").innerText =
  "Create Admin";

};

loadAdmins();

</script>

</body>
</html>
