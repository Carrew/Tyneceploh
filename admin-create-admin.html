<!DOCTYPE html>
<html>
<head>
  <title>Create Admin - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:450px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    h2{
      margin-bottom:15px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:8px;
      background:#2c3e50;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#1f2d3a;
    }

    .msg{
      margin-top:15px;
      padding:12px;
      border-radius:8px;
      font-size:14px;
    }

    .success{
      background:#d4edda;
      color:#155724;
    }

    .error{
      background:#f8d7da;
      color:#721c24;
    }

    .small{
      font-size:12px;
      color:#666;
      margin-top:8px;
    }

    .pin-box{
      margin-top:15px;
      padding:10px;
      background:#fff3cd;
      border-radius:8px;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Create New Admin</h2>

  <input id="name" placeholder="Admin Name">
  <input id="pin" placeholder="Temporary PIN (4–8 digits)" type="password">

  <button onclick="createAdmin()">Create Admin</button>

  <div id="result"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh",
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if (!user || user.role !== "admin") {
  location.href = "login.html";
}

// HASH FUNCTION
async function sha256(text) {
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(hashBuffer)]
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

// ID GENERATOR
function generateAdminId(count) {
  return `ADM${String(count + 1).padStart(3, "0")}`;
}

window.createAdmin = async function () {

  const name = document.getElementById("name").value.trim();
  const pin = document.getElementById("pin").value.trim();
  const result = document.getElementById("result");

  result.innerHTML = "";

  if (!name || !pin) {
    result.innerHTML = `<div class="msg error">Fill all fields</div>`;
    return;
  }

  if (pin.length < 4) {
    result.innerHTML = `<div class="msg error">PIN too short</div>`;
    return;
  }

  try {

    result.innerHTML = `<div class="msg">Creating admin...</div>`;

    const snapshot = await getDocs(collection(db, "users"));
    const adminCount = snapshot.docs.filter(d => d.data().role === "admin").length;

    const id = generateAdminId(adminCount);
    const pinHash = await sha256(pin);

    const admin = {
      id,
      name,
      role: "admin",
      pinHash,
      createdBy: user.userId,
      createdAt: Date.now()
    };

    await addDoc(collection(db, "users"), admin);

    result.innerHTML = `
      <div class="msg success">
        Admin created successfully
      </div>

      <div class="pin-box">
        Admin ID: ${id} <br>
        Temporary PIN: ${pin}
      </div>
    `;

    document.getElementById("name").value = "";
    document.getElementById("pin").value = "";

  } catch (err) {
    console.error(err);
    result.innerHTML = `<div class="msg error">Failed to create admin</div>`;
  }
};

</script>

</body>
</html>
