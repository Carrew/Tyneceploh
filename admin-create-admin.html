<!DOCTYPE html>
<html>
<head>
  <title>Create Admin - TEF</title>

  <style>
    :root{
      --maroon:#800000;
      --pink:#ffc0cb;
      --bg:#0b0b0f;
      --card:rgba(255,255,255,0.06);
    }

    body{
      font-family:system-ui;
      background:radial-gradient(circle at top,#1a0010,var(--bg));
      color:white;
      padding:20px;
      margin:0;
    }

    h2{
      text-align:center;
      color:var(--pink);
    }

    .box{
      max-width:500px;
      margin:auto;
      background:var(--card);
      padding:20px;
      border-radius:14px;
      backdrop-filter:blur(10px);
    }

    input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:none;
      border-radius:10px;
      background:rgba(255,255,255,0.08);
      color:white;
      box-sizing:border-box;
    }

    input::placeholder{
      color:#ddd;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-top:10px;
      cursor:pointer;
      background:linear-gradient(135deg,var(--maroon),var(--pink));
      color:white;
      font-weight:bold;
    }

    .result{
      margin-top:15px;
      padding:12px;
      border-radius:10px;
      background:rgba(255,255,255,0.08);
      line-height:1.7;
    }

    .id{
      color:#ffc0cb;
      font-weight:bold;
    }

    .pin{
      color:#00ffae;
      font-weight:bold;
    }
  </style>
</head>

<body>

<h2>👑 Create Admin</h2>

<div class="box">

  <input id="name" placeholder="Admin Name">

  <input id="pin" placeholder="Temporary PIN">

  <button onclick="createAdmin()">
    Create Admin
  </button>

  <div id="result"></div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

// GENERATE ADMIN ID
function generateAdminId(count){
  return `ADM${Date.now().toString().slice(-4)}${count}`;
}

// RANDOM PIN
function generatePin(){
  return Math.floor(1000 + Math.random() * 9000).toString();
}

window.createAdmin = async function(){

  const name = document.getElementById("name").value.trim();

  let pin = document.getElementById("pin").value.trim();

  const result = document.getElementById("result");

  if(!name){
    alert("Enter admin name");
    return;
  }

  try{

    result.innerHTML = "Creating admin...";

    const snap = await getDocs(collection(db,"users"));

    const adminCount =
      snap.docs.filter(d=>d.data().role === "admin").length;

    const userId = generateAdminId(adminCount);

    // auto generate pin if empty
    if(!pin){
      pin = generatePin();
    }

    const admin = {

      userId,
      pin,

      name,

      role:"admin",

      createdBy:user.userId,

      createdAt:Date.now()

    };

    await addDoc(collection(db,"users"),admin);

    result.innerHTML = `
      <div class="result">

        ✅ Admin created successfully

        <br><br>

        ID:
        <span class="id">${userId}</span>

        <br>

        PIN:
        <span class="pin">${pin}</span>

      </div>
    `;

    document.getElementById("name").value = "";
    document.getElementById("pin").value = "";

  }catch(err){

    console.error(err);

    result.innerHTML = `
      <div class="result">
        ❌ Failed to create admin
      </div>
    `;
  }

};

</script>

</body>
</html>
