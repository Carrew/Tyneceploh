<!DOCTYPE html>
<html>
<head>
  <title>My Quizzes - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PDF LIB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body{
      font-family:sans-serif;
      padding:20px;
      background:#f0f2f5;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    .quiz-card{
      background:white;
      padding:20px;
      margin-bottom:20px;
      border-radius:12px;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
    }

    .question-block{
      margin-bottom:15px;
      padding:10px;
      border-left:3px solid #007bff;
      background:#fafafa;
      border-radius:6px;
    }

    label{
      display:block;
      margin:5px 0;
      padding:5px;
      border-radius:4px;
    }

    label:hover{
      background:#f1f1f1;
    }

    button{
      background:#28a745;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
      margin-top:10px;
    }

    button:hover{
      background:#218838;
    }

    .result-banner{
      margin-top:10px;
      padding:10px;
      background:#d4edda;
      color:#155724;
      border-radius:6px;
      font-weight:bold;
    }

    .top-actions{
      display:flex;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:15px;
    }

    .pdf-btn{
      background:#007bff;
    }

    .pdf-btn:hover{
      background:#0056b3;
    }

    .muted{
      color:#666;
      font-size:13px;
    }

    .empty{
      text-align:center;
      padding:30px;
      color:#666;
    }
  </style>
</head>

<body>

<h2>My Quizzes</h2>

<div class="top-actions">
  <button class="pdf-btn" onclick="downloadAllPDF()">Download Page PDF</button>
</div>

<div id="list">Loading quizzes...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));
if(!user || user.role !== "student") location.href = "login.html";

let submittedMap = {};
let submissionDataMap = {};
let localQuizzes = [];

async function load(){

  const qSnap = await getDocs(collection(db,"quizzes"));
  const sSnap = await getDocs(collection(db,"quizSubmissions"));

  submittedMap = {};
  submissionDataMap = {};
  localQuizzes = [];

  sSnap.forEach(d=>{
    const s = d.data();
    if(s.studentId === user.userId){
      submittedMap[s.quizId] = true;
      submissionDataMap[s.quizId] = s;
    }
  });

  let html = "";
  let count = 0;

  qSnap.forEach(d=>{
    const q = d.data();
    if(q.class !== user.class) return;

    count++;
    const qId = d.id;
    localQuizzes.push({ id:qId, ...q });

    const qs = Array.isArray(q.questions) ? q.questions : [];
    const sub = submissionDataMap[qId];
    const done = !!sub;

    html += `
      <div class="quiz-card">

        <h3>${q.title}</h3>
        <div class="muted">Points: ${q.totalScore || 0}</div>

        <hr>
    `;

    qs.forEach((x,i)=>{

      const studentAnswer = done ? sub.answers[i] : null;

      html += `
        <div class="question-block">
          <b>Q${i+1}: ${x.q}</b>

          ${x.options.map((o,idx)=>{

            const val = ["A","B","C","D"][idx];
            const isChecked = studentAnswer === val ? "checked" : "";

            return `
              <label>
                <input type="radio"
                  name="${qId}_${i}"
                  value="${val}"
                  ${done ? "disabled" : ""}
                  ${isChecked}>
                ${val}. ${o}
              </label>
            `;
          }).join("")}

        </div>
      `;
    });

    if(done){

      html += `
        <div class="result-banner">
          Completed: ${sub.score} / ${sub.total}
          <br><br>
          <button class="pdf-btn"
            onclick="downloadQuizPDF('${qId}')">
            Download Result PDF
          </button>
        </div>
      `;

    }else{

      html += `
        <button onclick="submitQuiz('${qId}',${qs.length})">
          Submit Quiz
        </button>
      `;
    }

    html += `</div>`;
  });

  document.getElementById("list").innerHTML =
    count === 0
    ? `<div class="empty">No quizzes assigned to your class.</div>`
    : html;
}

window.submitQuiz = async function(id,len){

  if(submittedMap[id]) return;

  const answers = [];

  for(let i=0;i<len;i++){

    const opts = document.getElementsByName(`${id}_${i}`);

    let selected = "";

    opts.forEach(o=>{
      if(o.checked) selected = o.value;
    });

    if(!selected){
      alert("Answer all questions");
      return;
    }

    answers.push(selected);
  }

  const quiz = localQuizzes.find(q=>q.id === id);
  if(!quiz) return;

  let score = 0;
  let total = 0;

  quiz.questions.forEach((q,i)=>{
    total += (q.score || 0);
    if(q.answer === answers[i]){
      score += (q.score || 0);
    }
  });

  try{

    await addDoc(collection(db,"quizSubmissions"),{
      quizId:id,
      studentId:user.userId,
      studentName:user.name,
      answers,
      score,
      total,
      createdAt:Date.now()
    });

    alert(`Score: ${score}/${total}`);
    load();

  }catch(err){
    console.error(err);
    alert("Failed submitting quiz");
  }
};

/* ---------------------------
   PDF: SINGLE QUIZ RESULT
----------------------------*/
window.downloadQuizPDF = function(id){

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const sub = submissionDataMap[id];
  const quiz = localQuizzes.find(q=>q.id === id);

  if(!sub || !quiz) return;

  doc.setFontSize(16);
  doc.text("TEF Quiz Result", 10, 10);

  doc.setFontSize(12);
  doc.text(`Name: ${user.name}`, 10, 20);
  doc.text(`Quiz: ${quiz.title}`, 10, 30);
  doc.text(`Score: ${sub.score} / ${sub.total}`, 10, 40);

  let y = 55;

  quiz.questions.forEach((q,i)=>{

    doc.text(`Q${i+1}: ${q.q}`, 10, y);
    y += 8;

    doc.text(`Your Answer: ${sub.answers[i]}`, 10, y);
    y += 12;

    if(y > 270){
      doc.addPage();
      y = 20;
    }

  });

  doc.save(`${quiz.title}_result.pdf`);
};

/* ---------------------------
   PDF: FULL PAGE
----------------------------*/
window.downloadAllPDF = function(){

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(16);
  doc.text("TEF My Quizzes Report", 10, 10);

  let y = 25;

  Object.keys(submissionDataMap).forEach((id,i)=>{

    const sub = submissionDataMap[id];
    const quiz = localQuizzes.find(q=>q.id === id);

    if(!quiz) return;

    doc.text(`${quiz.title}`, 10, y);
    y += 8;

    doc.text(`Score: ${sub.score}/${sub.total}`, 10, y);
    y += 12;

    if(y > 270){
      doc.addPage();
      y = 20;
    }

  });

  doc.save("TEF_quizzes_report.pdf");
};

load();

</script>

</body>
</html>
