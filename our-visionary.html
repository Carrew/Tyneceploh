<!DOCTYPE html>
<html>
<head>
  <title>Our Visionary - TEF</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui;
      background: #0b0b0f;
      color: white;
    }

    .hero {
      height: 60vh;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: end;
      padding: 20px;
      position: relative;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    }

    .quote {
      font-size: 22px;
      font-style: italic;
      z-index: 2;
      max-width: 700px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .block {
      background: rgba(255,255,255,0.05);
      padding: 15px;
      margin: 15px 0;
      border-left: 4px solid #ffc0cb;
      border-radius: 10px;
      line-height: 1.6;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .gallery img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div id="hero" class="hero">
  <div class="overlay"></div>
  <div id="quote" class="quote"></div>
</div>

<div class="container">

  <h2>Origins & Vision</h2>

  <div id="story"></div>

  <h3>Gallery</h3>
  <div class="gallery" id="gallery"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh"
});

const db = getFirestore(app);

async function load(){

  const snap = await getDoc(doc(db,"visionary","main"));

  if(!snap.exists()) return;

  const data = snap.data();

  document.getElementById("hero").style.backgroundImage =
    `url(${data.mainImage})`;

  document.getElementById("quote").innerText = data.quote;

  document.getElementById("story").innerHTML =
    (data.storyBlocks || []).map(b =>
      `<div class="block">${b.content}</div>`
    ).join("");

  document.getElementById("gallery").innerHTML =
    (data.gallery || []).map(img =>
      `<img src="${img}">`
    ).join("");
}

load();

</script>

</body>
</html>
