<!DOCTYPE html>
<html>
<head>
  <title>Admin Control Center - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    :root{
      --bg:#07070b;
      --panel:#11111a;
      --accent:#ff4d6d;
      --text:#fff;
      --muted:rgba(255,255,255,0.6);
      --border:rgba(255,255,255,0.08);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:system-ui;
    }

    body{
      background:var(--bg);
      color:var(--text);
      display:flex;
      min-height:100vh;
    }

    /* SIDEBAR */
    .sidebar{
      width:240px;
      background:#0d0d14;
      border-right:1px solid var(--border);
      padding:20px;
    }

    .brand{
      color:var(--accent);
      font-weight:bold;
      margin-bottom:20px;
    }

    .sidebar button{
      width:100%;
      margin-bottom:10px;
      padding:10px;
      border-radius:10px;
      border:1px solid var(--border);
      background:transparent;
      color:white;
      text-align:left;
      cursor:pointer;
    }

    .sidebar button:hover{
      border-color:var(--accent);
    }

    /* MAIN */
    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      overflow:auto;
    }

    .topbar{
      padding:18px;
      background:#0f0f18;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .user{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .user img{
      width:45px;
      height:45px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--accent);
      background:#222;
    }

    .muted{
      font-size:13px;
      opacity:.7;
    }

    /* PROFILE CARD */
    .profile{
      margin:18px;
      padding:20px;
      border-radius:14px;
      background:#11111a;
      border:1px solid var(--border);
      display:flex;
      gap:15px;
      align-items:center;
      flex-wrap:wrap;
    }

    .profile img{
      width:80px;
      height:80px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--accent);
      background:#222;
    }

    .info p{
      margin:3px 0;
      font-size:14px;
      opacity:.9;
    }

    .label{
      color:var(--muted);
      font-size:12px;
    }

    /* GRID */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
      padding:18px;
    }

    .card{
      background:#11111a;
      border:1px solid var(--border);
      padding:15px;
      border-radius:12px;
      cursor:pointer;
    }

    .card:hover{
      border-color:var(--accent);
    }

    .logout{
      margin:20px;
      padding:12px;
      background:#1b1b25;
      border:1px solid var(--border);
      color:white;
      border-radius:10px;
      cursor:pointer;
    }
@media (max-width: 768px) {

  body {
    flex-direction: column;
    height: auto;
  }

  .sidebar {
    width: 100%;
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    padding: 10px;
  }

  .sidebar button {
    flex: 0 0 auto;
    margin-right: 10px;
    margin-bottom: 0;
  }

  .main {
    overflow: visible;
  }

  .topbar {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .profile {
    flex-direction: column;
    align-items: flex-start;
  }

  .grid {
    grid-template-columns: 1fr 1fr;
  }
}
  </style>
</head>

<body>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}
</script>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="brand">TEF ADMIN</div>

  <button onclick="go('admin-dashboard.html')">Dashboard</button>

  <button onclick="go('admin-create-student.html')">Students</button>
  <button onclick="go('admin-create-teacher.html')">Teachers</button>
  <button onclick="go('admin-create-coordinator.html')">Coordinators</button>

  <button onclick="go('admin-create-admin.html')">Create Admin</button>

  <button onclick="go('admin-create-janitors.html')">Janitors</button>
  <button onclick="go('admin-create-security.html')">Security</button>

  <button onclick="go('admin-results.html')">Results</button>
  <button onclick="go('admin-grade-approval.html')">Grade Approval</button>

  <button onclick="go('admin-attendance-analytics.html')">Attendance Analytics</button>
  <button onclick="go('admin-view-attendance.html')">View Attendance</button>
  <button onclick="go('attendance-settings.html')">Attendance Settings</button>

  <button onclick="go('admin-announcements.html')">Announcements</button>

  <button onclick="go('admin-financials.html')">Finance</button>

  <button onclick="go('admin-qr-manager.html')">QR Manager</button>

  <button onclick="go('admin-honor-rules.html')">Honor Rules</button>
  <button onclick="go('admin-subject-honor.html')">Subject Honor</button>

  <button onclick="go('admin-calender.html')">Calendar Settings</button>
  <button onclick="go('calender.html')">Calendar</button>

</div>
<!-- MAIN -->
<div class="main">

  <!-- TOP -->
  <div class="topbar">

    <div>
      <b>Admin Panel</b><br>
      <span class="muted">Live system view</span>
    </div>

    <div class="user">

      <div>
        <b id="name"></b><br>
        <span class="muted">Admin</span>
      </div>

      <img id="photo">

    </div>

  </div>

  <!-- PROFILE CARD (REAL DATA ONLY) -->
  <div class="profile">

    <img id="profilePic">

    <div class="info">

      <p><span class="label">Name</span><br><b id="pName"></b></p>

      <p><span class="label">User ID</span><br><span id="pId"></span></p>

      <p><span class="label">Email</span><br><span id="pEmail"></span></p>

      <p><span class="label">Phone</span><br><span id="pPhone"></span></p>

      <p><span class="label">Role</span><br><span id="pRole"></span></p>

    </div>

  </div>

  <!-- QUICK ACTIONS -->
  <div class="grid">

    <div class="card" onclick="go('admin-create-admin.html')">
      Create Admin
    </div>

    <div class="card" onclick="go('admin-grade-approval.html')">
      Approve Grades
    </div>

    <div class="card" onclick="go('users-announcement.html')">
      Broadcast
    </div>

    <div class="card" onclick="go('attendance-settings.html')">
      Settings
    </div>

  </div>

  <button class="logout" onclick="logout()">Logout</button>

</div>

<script>

document.getElementById("name").innerText = user.name || "Admin";

// PROFILE DATA (ONLY REAL STORED VALUES)
document.getElementById("pName").innerText = user.name || "-";
document.getElementById("pId").innerText = user.userId || "-";
document.getElementById("pEmail").innerText = user.email || "-";
document.getElementById("pPhone").innerText = user.phone || "-";
document.getElementById("pRole").innerText = (user.role || "-").toUpperCase();

const img = user.photoURL || "https://via.placeholder.com/100";

document.getElementById("photo").src = img;
document.getElementById("profilePic").src = img;

function go(page){
  location.href = page;
}

function logout(){
  localStorage.removeItem("user");
  location.href = "login.html";
}

</script>

</body>
</html>
