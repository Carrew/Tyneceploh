<!DOCTYPE html>
<html>
<head>
  <title>Admin Control Center - TEF</title>

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <style>

    :root{
      --bg:#07070b;
      --panel:#11111a;
      --accent:#ff4d6d;
      --text:#fff;
      --muted:rgba(255,255,255,0.6);
      --border:rgba(255,255,255,0.08);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:system-ui;
    }

    body{
      background:var(--bg);
      color:var(--text);
      display:flex;
      min-height:100vh;
    }

    /* SIDEBAR */

    .sidebar{
      width:240px;
      background:#0d0d14;
      border-right:1px solid var(--border);
      padding:20px;
      transition:.3s;
    }

    .brand{
      color:var(--accent);
      font-weight:bold;
      margin-bottom:20px;
      font-size:20px;
      letter-spacing:1px;
    }

    .sidebar button{
      width:100%;
      margin-bottom:10px;
      padding:12px;
      border-radius:10px;
      border:1px solid var(--border);
      background:transparent;
      color:white;
      text-align:left;
      cursor:pointer;
      transition:.25s;
    }

    .sidebar button:hover{
      border-color:var(--accent);
      background:rgba(255,255,255,0.03);
    }

    /* MAIN */

    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      overflow:auto;
    }

    .topbar{
      padding:18px;
      background:#0f0f18;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .top-left{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .menu-btn{
      display:none;
      background:transparent;
      border:none;
      color:white;
      font-size:26px;
      cursor:pointer;
    }

    .user{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .user img{
      width:45px;
      height:45px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--accent);
      background:#222;
    }

    .muted{
      font-size:13px;
      opacity:.7;
    }

    /* PROFILE */

    .profile{
      margin:18px;
      padding:20px;
      border-radius:14px;
      background:#11111a;
      border:1px solid var(--border);
      display:flex;
      gap:15px;
      align-items:center;
      flex-wrap:wrap;
    }

    .profile img{
      width:80px;
      height:80px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--accent);
      background:#222;
    }

    .info p{
      margin:3px 0;
      font-size:14px;
      opacity:.9;
    }

    .label{
      color:var(--muted);
      font-size:12px;
    }

    /* SECTION TITLE */

    .section-title{
      padding:0 18px;
      margin-top:10px;
      margin-bottom:5px;
      font-size:12px;
      letter-spacing:1px;
      text-transform:uppercase;
      color:var(--muted);
    }

    /* GRID */

    .grid{
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
      padding:18px;
    }

    .card{
      background:#11111a;
      border:1px solid var(--border);
      padding:18px;
      border-radius:12px;
      cursor:pointer;
      transition:.25s;
    }

    .card:hover{
      border-color:var(--accent);
      transform:translateY(-3px);
    }

    .logout{
      margin:20px;
      padding:12px;
      background:#1b1b25;
      border:1px solid var(--border);
      color:white;
      border-radius:10px;
      cursor:pointer;
      transition:.25s;
    }

    .logout:hover{
      border-color:var(--accent);
    }

    /* OVERLAY */

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.5);
      z-index:998;
      display:none;
    }

    .overlay.show{
      display:block;
    }

    /* MOBILE */

    @media (max-width:768px){

      body{
        overflow-x:hidden;
      }

      .sidebar{
        position:fixed;
        top:0;
        left:-260px;
        width:240px;
        height:100vh;
        z-index:999;
        overflow-y:auto;
      }

      .sidebar.show{
        left:0;
      }

      .menu-btn{
        display:block;
      }

      .topbar{
        gap:10px;
      }

      .profile{
        flex-direction:column;
        align-items:flex-start;
      }

      .grid{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

<script>

const user =
JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

</script>

onclick="toggleMenu()"></div>

  <button onclick="go('admin-create-admin.html')">

  </button>

  <button onclick="go('admin-create-janitors.html')">

  </button>

  <button onclick="go('admin-create-security.html')">
    👮 Security
  </button>

  <button onclick="go('admin-grade-approval.html')">
    📊 Grade Approval
  </button>

  <button onclick="go('admin-subject-honor.html')">
    🏅 Subject Honor
  </button>

  <button onclick="go('admin-academic-report.html')">
    🧠 Academic Report
  </button>

  <button onclick="go('admin-honor-rules.html')">
    📜 Honor Rules
  </button>

  <button onclick="go('admin-attendance-analytics.html')">

  </button>

  <button onclick="go('admin-view-attendance.html')">

  <button onclick="go('attendance-settings.html')">

  <button onclick="go('admin-qr-manager.html')">

  <button onclick="go('admin-announcements.html')">

  </button>

  <button onclick="go('users-announcement.html')">
    🌍 Public Announcements
  </button>

  <button onclick="go('admin-financials.html')">

  <button onclick="go('admin-calender.html')">

  <button onclick="go('honor-board.html')">
    🏆 General Honor Board

</div>

<!-- MAIN -->

<div class="main">

  <!-- TOPBAR -->

  <div class="topbar">

    <div class="top-left">

      <button class="menu-btn"
      onclick="toggleMenu()">
        ☰
      </button>

      <div>
        <b>Admin Panel</b><br>

        <span class="muted">
          Live system view
        </span>
      </div>

    </div>

    <div class="user">

      <div>
        <b id="name"></b><br>

        <span class="muted">
          Admin
        </span>
      </div>

      <img id="photo">

    </div>

  </div>

  <!-- PROFILE -->

  <div class="profile">

    <img id="profilePic">

    <div class="info">

      <p>
        <span class="label">
          Name
        </span><br>

        <b id="pName"></b>
      </p>

      <p>
        <span class="label">
          User ID
        </span><br>

        <span id="pId"></span>
      </p>

      <p>
        <span class="label">
          Email
        </span><br>

        <span id="pEmail"></span>
      </p>

      <p>
        <span class="label">
          Phone
        </span><br>

        <span id="pPhone"></span>
      </p>

      <p>
        <span class="label">
          Role
        </span><br>

        <span id="pRole"></span>
      </p>

    </div>

  </div>

  <!-- QUICK ACTIONS -->

  <div class="section-title">
    Quick Actions
  </div>

  <div class="grid">

    <div class="card"
    onclick="go('admin-create-admin.html')">
      🛡️ Create Admin
    </div>

    <div class="card"
    onclick="go('admin-grade-approval.html')">
      📊 Approve Grades
    </div>

    <div class="card"
    onclick="go('admin-announcements.html')">
      📢 Manage Announcements
    </div>

    <div class="card"
    onclick="go('attendance-settings.html')">
      ⚙️ Attendance Settings
    </div>

    <div class="card"
    onclick="go('admin-financials.html')">
      💰 Financial Center
    </div>

    <div class="card"
    onclick="go('honor-engine.html')">
      🧠 Honor Engine
    </div>

    <div class="card"
    onclick="go('admin-qr-manager.html')">

    </div>

    <div class="card"
    onclick="go('calender.html')">
      📅 School Calendar
    </div>

  </div>

  <button class="logout"
  onclick="logout()">
    Logout
  </button>

</div>

<script>

document.getElementById("name").innerText =
user.name || "Admin";

document.getElementById("pName").innerText =
user.name || "-";

document.getElementById("pId").innerText =
user.userId || "-";

document.getElementById("pEmail").innerText =
user.email || "-";

document.getElementById("pPhone").innerText =
user.phone || "-";

document.getElementById("pRole").innerText =
(user.role || "-").toUpperCase();

const img =
user.photoURL ||
"https://via.placeholder.com/100";

document.getElementById("photo").src = img;

document.getElementById("profilePic").src = img;

/* NAVIGATION */

function go(page){

  closeMenu();

  location.href = page;

}

/* MENU */

function toggleMenu(){

  document.querySelector(".sidebar")
  .classList.toggle("show");

  document.querySelector(".overlay")
  .classList.toggle("show");

}

function closeMenu(){

  document.querySelector(".sidebar")
  .classList.remove("show");

  document.querySelector(".overlay")
  .classList.remove("show");

}

/* LOGOUT */

function logout(){

  localStorage.removeItem("user");

  location.href = "login.html";

}

</script>

</body>
</html>
