<!DOCTYPE html>
<html>
<head>
  <title>Admin Control Center - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    :root{
      --bg:#07070b;
      --panel:#11111a;
      --panel2:#0e0e15;
      --accent:#ff4d6d;
      --text:#ffffff;
      --muted:rgba(255,255,255,0.6);
      --border:rgba(255,255,255,0.08);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:system-ui;
    }

    body{
      background:var(--bg);
      color:var(--text);
      display:flex;
      height:100vh;
      overflow:hidden;
    }

    /* SIDEBAR */
    .sidebar{
      width:260px;
      background:linear-gradient(180deg,#0d0d14,#07070b);
      border-right:1px solid var(--border);
      padding:20px;
    }

    .brand{
      font-size:18px;
      font-weight:bold;
      color:var(--accent);
      margin-bottom:25px;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .nav button{
      background:transparent;
      border:1px solid var(--border);
      color:var(--text);
      padding:10px;
      border-radius:10px;
      text-align:left;
      cursor:pointer;
      transition:.2s;
    }

    .nav button:hover{
      background:var(--panel);
      border-color:var(--accent);
      transform:translateX(3px);
    }

    /* MAIN */
    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      overflow:auto;
    }

    /* TOP BAR */
    .topbar{
      padding:20px;
      background:var(--panel2);
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .userbox{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .userbox img{
      width:40px;
      height:40px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--accent);
    }

    .muted{
      color:var(--muted);
      font-size:13px;
    }

    /* STATS */
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
      padding:20px;
    }

    .stat{
      background:var(--panel);
      border:1px solid var(--border);
      padding:15px;
      border-radius:12px;
    }

    .stat b{
      color:var(--accent);
      font-size:13px;
    }

    .stat h2{
      margin-top:8px;
      font-size:20px;
    }

    /* MODULES */
    .section{
      padding:0 20px 20px;
    }

    .section h3{
      margin:15px 0;
      font-size:14px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:12px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--border);
      padding:15px;
      border-radius:12px;
      cursor:pointer;
      transition:.2s;
    }

    .card:hover{
      border-color:var(--accent);
      transform:translateY(-3px);
    }

    .logout{
      margin:20px;
      padding:12px;
      background:#1b1b25;
      border:1px solid var(--border);
      color:white;
      border-radius:10px;
      cursor:pointer;
    }

    .logout:hover{
      border-color:var(--accent);
    }

  </style>
</head>

<body>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}
</script>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="brand">TEF ADMIN</div>

  <div class="nav">

    <button onclick="go('admin-create-student.html')">Students</button>
    <button onclick="go('admin-create-teacher.html')">Teachers</button>
    <button onclick="go('admin-results.html')">Results</button>
    <button onclick="go('admin-attendance-analytics.html')">Analytics</button>
    <button onclick="go('admin-announcements.html')">Announcements</button>
    <button onclick="go('admin-financials.html')">Finance</button>
    <button onclick="go('admin-qr-manager.html')">QR System</button>

  </div>

</div>

<!-- MAIN -->
<div class="main">

  <!-- TOP BAR -->
  <div class="topbar">

    <div>
      <b>Control Room</b><br>
      <span class="muted">System overview & management</span>
    </div>

    <div class="userbox">

      <div>
        <b id="name"></b><br>
        <span class="muted">Administrator</span>
      </div>

      <img id="photo">

    </div>

  </div>

  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      <b>Total Students</b>
      <h2>--</h2>
    </div>

    <div class="stat">
      <b>Total Teachers</b>
      <h2>--</h2>
    </div>

    <div class="stat">
      <b>Pending Grades</b>
      <h2>--</h2>
    </div>

    <div class="stat">
      <b>System Status</b>
      <h2>Active</h2>
    </div>

  </div>

  <!-- MODULES -->
  <div class="section">

    <h3>Quick Actions</h3>

    <div class="grid">

      <div class="card" onclick="go('admin-create-admin.html')">
        Create Admin
      </div>

      <div class="card" onclick="go('admin-grade-approval.html')">
        Approve Grades
      </div>

      <div class="card" onclick="go('attendance-settings.html')">
        Attendance Settings
      </div>

      <div class="card" onclick="go('users-announcement.html')">
        Broadcast Message
      </div>

    </div>

  </div>

  <button class="logout" onclick="logout()">Logout</button>

</div>

<script>

document.getElementById("name").innerText =
user.name || "Admin";

document.getElementById("photo").src =
user.photoURL || "https://via.placeholder.com/100";

function go(page){
  location.href = page;
}

function logout(){
  localStorage.removeItem("user");
  location.href = "login.html";
}

</script>

</body>
</html>
