<!DOCTYPE html>
<html>
<head>
  <title>Security Staff - TEF</title>

  <style>
    :root {
      --maroon: #800000;
      --pink: #ffc0cb;
      --bg: #0b0b0f;
      --card: rgba(255,255,255,0.06);
    }

    body {
      font-family: system-ui;
      background: radial-gradient(circle at top, #1a0010, var(--bg));
      color: white;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: var(--pink);
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--maroon), var(--pink));
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .card {
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      margin-top: 15px;
      border-left: 4px solid var(--pink);
    }

    .small {
      font-size: 12px;
      opacity: 0.8;
    }

    .notify {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.7);
      border-left: 4px solid var(--pink);
      padding: 10px 14px;
      border-radius: 8px;
      transform: translateX(120%);
      transition: 0.3s;
    }

    .notify.show {
      transform: translateX(0);
    }
  </style>
</head>

<body>

<h2>🛡️ Create Security Staff</h2>

<div id="notify" class="notify"></div>

<input id="name" placeholder="Full Name">
<input id="shift" placeholder="Shift (Day / Night)">
<input id="phone" placeholder="Phone">

<select id="gender">
  <option value="">Select Gender</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
  <option value="Other">Other</option>
</select>

<input id="address" placeholder="Address">
<input id="dob" placeholder="Date of Birth">
<input id="emergency" placeholder="Emergency Contact">

<input id="pin" placeholder="PIN (optional)">
<input type="file" id="photo">

<button onclick="create()" id="btn">Create Security</button>

<h2>📋 Security Staff</h2>
<input id="search" placeholder="Search by name or ID..." oninput="loadSecurity()">
<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

// notify
function notify(msg){
  const n = document.getElementById("notify");
  n.innerText = msg;
  n.classList.add("show");
  setTimeout(()=>n.classList.remove("show"), 2500);
}

// SEC ID → SEC001 style
function genID(count){
  return "SEC" + String(count + 1).padStart(3, "0");
}

// PIN
function genPIN(){
  return Math.floor(1000 + Math.random() * 9000).toString();
}

// upload image
async function uploadImage(file){
  if(!file) return "";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", "Tyneceploh");

  const res = await fetch("https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload", {
    method:"POST",
    body: formData
  });

  const data = await res.json();
  return data.secure_url || "";
}

// CREATE
window.create = async function(){

  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.innerText = "Creating...";

  try {
    const snap = await getDocs(collection(db,"users"));

    let count = 0;
    snap.forEach(d=>{
      if(d.data().role === "security") count++;
    });

    const file = document.getElementById("photo").files[0];
    const photoURL = await uploadImage(file);

    const pinInput = document.getElementById("pin").value.trim();
    const pin = pinInput || genPIN();

    const id = genID(count);

    const data = {
      userId: id,
      name: document.getElementById("name").value,
      shift: document.getElementById("shift").value,
      phone: document.getElementById("phone").value,
      gender: document.getElementById("gender").value,
      address: document.getElementById("address").value,
      dob: document.getElementById("dob").value,
      emergency: document.getElementById("emergency").value,
      pin,
      role: "security",
      status: "active",
      createdAt: Date.now()
    };

    if(photoURL) data.photoURL = photoURL;

    await addDoc(collection(db,"users"), data);

    notify("Security created: " + id);

    document.querySelectorAll("input, select").forEach(i => i.value = "");

    loadSecurity();

  } catch(err){
    console.error(err);
    notify("Error creating security staff");
  }

  btn.disabled = false;
  btn.innerText = "Create Security";
};

// LOAD + SEARCH
window.loadSecurity = async function(){

  const list = document.getElementById("list");
  const search = document.getElementById("search").value.toLowerCase();

  list.innerHTML = "Loading...";

  const snap = await getDocs(collection(db,"users"));

  let html = "";

  snap.forEach(docSnap => {
    const d = docSnap.data();
    if(d.role !== "security") return;

    if(
      search &&
      !d.name.toLowerCase().includes(search) &&
      !d.userId.toLowerCase().includes(search)
    ) return;

    html += `
      <div class="card">
        <b>${d.userId} - ${d.name}</b><br>
        <div class="small">
          Shift: ${d.shift}<br>
          Phone: ${d.phone}<br>
          Gender: ${d.gender}
        </div>

        <button onclick="edit('${docSnap.id}')">Edit</button>
        <button onclick="removeUser('${docSnap.id}')">Delete</button>
      </div>
    `;
  });

  list.innerHTML = html || "No security staff found";
};

// DELETE
window.removeUser = async function(id){
  if(!confirm("Delete this staff?")) return;

  await deleteDoc(doc(db,"users",id));
  notify("Deleted");

  loadSecurity();
};

// UPDATE
window.edit = async function(id){

  const newName = prompt("New name:");
  const newShift = prompt("New shift:");

  if(!newName && !newShift) return;

  const ref = doc(db,"users",id);

  const updateData = {};
  if(newName) updateData.name = newName;
  if(newShift) updateData.shift = newShift;

  await updateDoc(ref, updateData);

  notify("Updated");

  loadSecurity();
};

// INIT
loadSecurity();

</script>

</body>
</html>
