<!DOCTYPE html>
<html>
<head>
  <title>School Gallery - TEF</title>

  <style>
    body {
      font-family: system-ui;
      background: #0b0b0f;
      color: white;
      padding: 20px;
    }

    .group {
      margin-bottom: 30px;
    }

    h2 {
      color: #ffc0cb;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    img {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    img:hover {
      transform: scale(1.03);
    }

    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal img {
      width: 80%;
    }
  </style>
</head>

<body>

<h1>📸 School Gallery</h1>

<div id="list"></div>

<div class="modal" id="modal" onclick="this.style.display='none'">
  <img id="modalImg">
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"YOUR_KEY",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

async function load(){
  const gSnap = await getDocs(collection(db,"galleryGroups"));
  const iSnap = await getDocs(collection(db,"galleryImages"));

  const groups = gSnap.docs.map(d => ({id:d.id, ...d.data()}));
  const images = iSnap.docs.map(d => d.data());

  let html = "";

  groups.forEach(g => {

    const imgs = images.filter(i => i.groupId === g.id);

    html += `
      <div class="group">
        <h2>${g.name}</h2>
        <div class="grid">
          ${imgs.map(i => `
            <img src="${i.imageUrl}" onclick="openImg('${i.imageUrl}')">
          `).join("")}
        </div>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

window.openImg = function(url){
  document.getElementById("modalImg").src = url;
  document.getElementById("modal").style.display = "flex";
};

load();

</script>

</body>
</html>
