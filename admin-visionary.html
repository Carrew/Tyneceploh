<!DOCTYPE html>
<html>
<head>
  <title>Visionary Admin - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: system-ui;
      background: radial-gradient(circle at top, #1a0010, #0b0b0f);
      color: white;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      backdrop-filter: blur(10px);
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: linear-gradient(135deg, #800000, #ffc0cb);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #27ae60;
      padding: 10px 15px;
      border-radius: 8px;
      display: none;
    }

    .danger {
      background: #e74c3c;
    }
  </style>
</head>

<body>

<h2>🎯 Visionary Admin Panel</h2>

<div class="card">
  <h3>Main Image</h3>
  <input type="file" id="mainImg">
  <button onclick="uploadMain()">Upload Main Image</button>
</div>

<div class="card">
  <h3>Gallery Upload</h3>
  <input type="file" id="galleryImgs" multiple>
  <button onclick="uploadGallery()">Upload Gallery</button>
</div>

<div class="card">
  <h3>Gallery</h3>
  <div id="gallery" class="grid"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"YOUR_KEY",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const docRef = doc(db, "visionary", "content");

function toast(msg, err=false){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.className = err ? "toast danger" : "toast";
  t.style.display = "block";
  setTimeout(()=> t.style.display="none", 3000);
}

async function upload(file){
  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", "Tyneceploh");

  const res = await fetch("https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload",{
    method:"POST",
    body:form
  });

  const data = await res.json();
  return data.secure_url;
}

window.uploadMain = async function(){
  const file = document.getElementById("mainImg").files[0];
  if(!file) return toast("Select image", true);

  const url = await upload(file);

  await setDoc(docRef, { mainImage: url }, { merge:true });

  toast("Main image updated");
}

window.uploadGallery = async function(){
  const files = document.getElementById("galleryImgs").files;
  if(!files.length) return toast("No images selected", true);

  const snap = await getDoc(docRef);
  let gallery = snap.exists() ? snap.data().gallery || [] : [];

  for(let f of files){
    const url = await upload(f);
    gallery.push(url);
  }

  await setDoc(docRef, { gallery }, { merge:true });

  toast("Gallery updated");
  load();
}

async function load(){
  const snap = await getDoc(docRef);
  const data = snap.data();

  const g = document.getElementById("gallery");
  g.innerHTML = (data?.gallery || []).map((img,i)=>`
    <div>
      <img src="${img}">
      <button onclick="del(${i})">Delete</button>
    </div>
  `).join("");
}

window.del = async function(i){
  const snap = await getDoc(docRef);
  let gallery = snap.data().gallery || [];
  gallery.splice(i,1);

  await setDoc(docRef,{gallery},{merge:true});
  toast("Deleted");
  load();
}

load();
</script>

</body>
</html>
