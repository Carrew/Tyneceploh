<!DOCTYPE html>
<html>
<head>
  <title>Visionary Admin - TEF</title>

  <style>
    body {
      font-family: system-ui;
      background: #0b0b0f;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 900px;
      margin: auto;
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 12px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #800000, #ffc0cb);
      color: white;
      cursor: pointer;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .gallery img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
    }

    .toast {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success { background: #1e7e34; }
    .error { background: #a71d2a; }
    .loading { background: #444; }
  </style>
</head>

<body>

<div class="box">

  <h2>Our Visionary Admin Panel</h2>

  <div id="toast" class="toast"></div>

  <input id="quote" placeholder="Main Quote">

  <textarea id="story" rows="6" placeholder="Add story block (one section)"></textarea>

  <input type="file" id="mainImage">

  <input type="file" id="gallery" multiple>

  <button onclick="saveVision()">Save Visionary Page</button>

  <h3>Preview Gallery</h3>
  <div class="gallery" id="preview"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh"
});

const db = getFirestore(app);

const toast = document.getElementById("toast");

function show(msg, type="loading"){
  toast.style.display = "block";
  toast.className = "toast " + type;
  toast.innerText = msg;
}

async function upload(file){
  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", "Tyneceploh");

  const res = await fetch("https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload", {
    method: "POST",
    body: form
  });

  const data = await res.json();
  return data.secure_url;
}

window.saveVision = async function(){

  try {
    show("Saving...", "loading");

    const quote = document.getElementById("quote").value;
    const story = document.getElementById("story").value;

    const mainFile = document.getElementById("mainImage").files[0];
    const galleryFiles = document.getElementById("gallery").files;

    let mainImageUrl = "";
    if(mainFile) mainImageUrl = await upload(mainFile);

    let gallery = [];
    for(let f of galleryFiles){
      gallery.push(await upload(f));
    }

    await setDoc(doc(db,"visionary","main"), {
      quote,
      storyBlocks: [{type:"text", content: story}],
      mainImage: mainImageUrl,
      gallery,
      updatedAt: Date.now(),
      updatedBy: "admin"
    });

    show("Visionary page updated successfully", "success");

  } catch(err){
    console.error(err);
    show("Error updating visionary page", "error");
  }
};

</script>

</body>
</html>
