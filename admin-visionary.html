<!DOCTYPE html>
<html>
<head>
  <title>Visionary Image Admin - TEF</title>
  <style>
    body{
      font-family:sans-serif;
      background:#0b0b0f;
      color:white;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
    }

    .card{
      background:rgba(255,255,255,0.06);
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
      backdrop-filter: blur(10px);
    }

    input, button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:8px;
      border:none;
    }

    button{
      background:linear-gradient(135deg,#800000,#ffc0cb);
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:15px;
    }

    img{
      width:100%;
      height:120px;
      object-fit:cover;
      border-radius:10px;
    }

    .msg{
      margin-top:10px;
      font-size:14px;
      opacity:0.9;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>🌸 Visionary Image Control</h2>

  <div class="card">

    <h3>Main Visionary Image</h3>
    <input type="file" id="mainFile">
    <button onclick="uploadMain()">Update Main Image</button>
    <div class="msg" id="mainMsg"></div>

  </div>

  <div class="card">

    <h3>Gallery Upload</h3>
    <input type="file" id="galleryFile">
    <button onclick="uploadGallery()">Add Gallery Image</button>
    <div class="msg" id="galleryMsg"></div>

  </div>

  <div class="card">
    <h3>Gallery Preview</h3>
    <div class="grid" id="gallery"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));
if(!user || user.role !== "admin") location.href="login.html";

// CLOUDINARY
async function upload(file){
  const fd = new FormData();
  fd.append("file",file);
  fd.append("upload_preset","Tyneceploh");

  const res = await fetch("https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload",{
    method:"POST",
    body:fd
  });

  const data = await res.json();
  return data.secure_url;
}

// MAIN IMAGE
window.uploadMain = async function(){
  const file = document.getElementById("mainFile").files[0];
  const msg = document.getElementById("mainMsg");

  msg.innerText = "Uploading...";

  try{
    const url = await upload(file);

    await addDoc(collection(db,"visionaryMain"),{
      url,
      createdAt:Date.now()
    });

    msg.innerText = "Main image updated ✔";
  }catch(e){
    msg.innerText = "Upload failed";
  }
};

// GALLERY
window.uploadGallery = async function(){
  const file = document.getElementById("galleryFile").files[0];
  const msg = document.getElementById("galleryMsg");

  msg.innerText = "Uploading...";

  try{
    const url = await upload(file);

    await addDoc(collection(db,"visionaryGallery"),{
      url,
      createdAt:Date.now()
    });

    msg.innerText = "Added to gallery ✔";
    loadGallery();
  }catch(e){
    msg.innerText = "Upload failed";
  }
};

// LOAD GALLERY
async function loadGallery(){
  const snap = await getDocs(collection(db,"visionaryGallery"));

  document.getElementById("gallery").innerHTML =
    snap.docs.map(d=>`
      <div>
        <img src="${d.data().url}">
      </div>
    `).join("");
}

loadGallery();

</script>

</body>
</html>
