<!DOCTYPE html>
<html>
<head>
  <title>Visionary Admin - TEF</title>

  <style>
    body{
      font-family:system-ui;
      background:#0b0b0f;
      color:white;
      padding:20px;
    }

    .box{
      max-width:800px;
      margin:auto;
    }

    .card{
      background:rgba(255,255,255,0.06);
      padding:20px;
      border-radius:16px;
      margin-bottom:15px;
      border:1px solid rgba(255,255,255,0.1);
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
    }

    button{
      background:linear-gradient(135deg,#800000,#ffc0cb);
      color:white;
      cursor:pointer;
    }

    .msg{
      margin-top:10px;
      padding:10px;
      display:none;
      border-radius:10px;
    }

    .success{background:#1e3d2b}
    .error{background:#3d1e1e}
    .loading{background:#1e2a3d}

  </style>
</head>

<body>

<div class="box">

  <h2>Update Visionary Image</h2>

  <div class="card">

    <input type="file" id="img">

    <button onclick="upload()">Upload / Update</button>

    <div id="msg" class="msg"></div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

function msg(type,text){
  const m=document.getElementById("msg");
  m.style.display="block";
  m.className="msg "+type;
  m.innerText=text;
}

async function uploadCloud(file){

  const fd = new FormData();
  fd.append("file",file);
  fd.append("upload_preset","Tyneceploh");

  const res = await fetch("https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload",{
    method:"POST",
    body:fd
  });

  const data = await res.json();
  return data.secure_url;
}

window.upload = async function(){

  const file = document.getElementById("img").files[0];

  if(!file){
    msg("error","Select an image first");
    return;
  }

  msg("loading","Uploading...");

  try{

    const url = await uploadCloud(file);

    await setDoc(doc(db,"visionary","main"),{
      image:url,
      updatedAt:Date.now()
    });

    msg("success","Visionary image updated successfully");

  }catch(e){
    console.log(e);
    msg("error","Upload failed");
  }
};

</script>

</body>
</html>
