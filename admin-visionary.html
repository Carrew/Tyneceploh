<!DOCTYPE html>
<html>
<head>
  <title>Visionary Admin - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:system-ui;
      background:#0b0b0f;
      color:white;
      padding:20px;
    }

    .box{
      max-width:700px;
      margin:auto;
      background:rgba(255,255,255,0.05);
      padding:20px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.1);
    }

    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
    }

    button{
      background:linear-gradient(135deg,#800000,#ffc0cb);
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .status{
      margin-top:15px;
      padding:10px;
      border-radius:10px;
      display:none;
    }

    .success{background:#1f6f3f}
    .loading{background:#1f4f6f}
    .error{background:#6f1f1f}

    img{
      width:100%;
      margin-top:15px;
      border-radius:12px;
    }
  </style>
</head>

<body>

<div class="box">

<h2>Update Visionary Page</h2>

<input type="file" id="image">

<button onclick="upload()">Upload Visionary Image</button>

<div id="status" class="status"></div>

<img id="preview">

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const statusBox = document.getElementById("status");

function show(msg,type){
  statusBox.style.display="block";
  statusBox.className="status "+type;
  statusBox.innerText=msg;
}

async function uploadCloud(file){

  const form = new FormData();
  form.append("file",file);
  form.append("upload_preset","Tyneceploh");

  const res = await fetch(
    "https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload",
    {method:"POST",body:form}
  );

  const data = await res.json();
  return data.secure_url;
}

window.upload = async function(){

  const file = document.getElementById("image").files[0];

  if(!file){
    show("Select image first","error");
    return;
  }

  try{

    show("Uploading...","loading");

    const url = await uploadCloud(file);

    await setDoc(doc(db,"visionary","main"),{
      image:url,
      updatedAt:Date.now()
    });

    document.getElementById("preview").src=url;

    show("Visionary image updated successfully","success");

  }catch(e){
    show("Upload failed","error");
  }
};

</script>

</body>
</html>
