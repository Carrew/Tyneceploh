<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEF Attendance Report</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --card: #ffffff;
      --text: #222;
      --muted: #666;
      --maroon: #800000;
      --pink: #ff4d6d;
      --green: #27ae60;
      --red: #c0392b;
      --orange: #e67e22;
      --blue: #2980b9;
      --shadow: 0 8px 20px rgba(0,0,0,0.06);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .header {
      background: linear-gradient(135deg, var(--maroon), var(--pink));
      color: white;
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .header h2 { margin: 0; font-size: 22px; }
    .header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }
    
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { opacity: 0.9; }
    .btn-print { background: #ffffff; color: var(--maroon); }
    .btn-pdf { background: #222222; color: #ffffff; }

    /* Filters Card */
    .filter-card {
      background: var(--card);
      padding: 18px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin: 20px 0;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 160px;
    }
    .filter-group label {
      font-size: 12px;
      font-weight: bold;
      color: var(--muted);
      text-transform: uppercase;
    }
    .filter-group input, .filter-group select {
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .btn-filter { background: var(--maroon); color: white; height: 38px; }

    /* Report Table */
    .report-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      padding: 20px;
    }
    .report-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eee;
    }
    .report-title-bar h3 { margin: 0; color: var(--maroon); }
    .summary-text { font-size: 13px; color: var(--muted); }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }
    th {
      background: #f8f9fa;
      color: var(--muted);
      font-weight: 700;
      padding: 12px;
      border-bottom: 2px solid #e9ecef;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid #f1f1f1;
    }
    tr:hover { background: #fbfbfb; }

    /* Status Badges */
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-ON_TIME { background: #d4edda; color: #155724; }
    .badge-LATE { background: #f8d7da; color: #721c24; }
    .badge-EARLY { background: #d1ecf1; color: #0c5460; }
    .badge-EARLY_EXIT { background: #fff3cd; color: #856404; }
    .badge-OVERTIME { background: #e2e3e5; color: #383d41; }
    .badge-NONE { background: #f1f1f1; color: #888; }

    .time-sub {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    #loading {
      text-align: center;
      padding: 30px;
      color: var(--muted);
      font-weight: bold;
    }

    /* Print Styles */
    @media print {
      body { background: white; padding: 0; color: black; }
      .header, .filter-card, .actions { display: none !important; }
      .report-card { box-shadow: none; padding: 0; }
      table { border: 1px solid #ccc; }
      th, td { padding: 8px; border: 1px solid #ddd; }
    }
  </style>

  <!-- FingerprintJS UMD for user lock check & html2pdf library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="container">
  
  <div class="header">
    <div>
      <h2>TEF Attendance Reports</h2>
      <p>View daily attendance logs, work hours, and export official PDFs.</p>
    </div>
    <div class="actions">
      <button class="btn btn-print" onclick="window.print()">🖨️ Print</button>
      <button class="btn btn-pdf" id="btnExportPDF">📥 Save PDF</button>
    </div>
  </div>

  <!-- Filter Controls -->
  <div class="filter-card">
    <div class="filter-group">
      <label>Start Date</label>
      <input type="date" id="startDate">
    </div>
    <div class="filter-group">
      <label>End Date</label>
      <input type="date" id="endDate">
    </div>
    <div class="filter-group">
      <label>Staff Role</label>
      <select id="roleFilter">
        <option value="ALL">All Roles</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Admin</option>
        <option value="staff">Staff</option>
      </select>
    </div>
    <button class="btn btn-filter" id="btnApplyFilter">Apply Filter</button>
  </div>

  <!-- Attendance Table Section -->
  <div class="report-card" id="pdfContent">
    <div class="report-title-bar">
      <div>
        <h3>Tyneceploh Educational Foundation</h3>
        <div class="summary-text" id="reportSubtitle">Daily Attendance Log</div>
      </div>
      <div class="summary-text" id="totalRecordsCount">0 Records Found</div>
    </div>

    <div id="loading">Loading attendance records...</div>

    <table id="attendanceTable" style="display:none;">
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Role</th>
          <th>Clock In</th>
          <th>Clock Out</th>
          <th>Total Worked</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Records populated dynamically -->
      </tbody>
    </table>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"; 
  import { getFirestore, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; 

  const firebaseConfig = { 
    apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4", 
    authDomain: "tyneceploh.firebaseapp.com", 
    projectId: "tyneceploh" 
  }; 

  const app = initializeApp(firebaseConfig); 
  const db = getFirestore(app); 

  // Redirect non-authenticated or student users
  const currentUser = JSON.parse(localStorage.getItem("user")); 
  if (!currentUser || currentUser.role === "student") { 
    location.href = "login.html"; 
  }

  // Pre-fill default dates (Current month to date)
  const today = new Date();
  const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  
  document.getElementById("startDate").value = firstDayOfMonth.toISOString().split("T")[0];
  document.getElementById("endDate").value = today.toISOString().split("T")[0];

  function formatTime(timestamp) {
    if (!timestamp) return "--:--";
    return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
  }

  function formatDuration(startTime, endTime) {
    if (!startTime || !endTime) return "--";
    const diffMs = endTime - startTime;
    const totalMinutes = Math.floor(diffMs / (1000 * 60));
    const hours = Math.floor(totalMinutes / 60);
    const mins = totalMinutes % 60;
    return `${hours}h ${mins}m`;
  }

  async function fetchAttendance() {
    const loadingEl = document.getElementById("loading");
    const tableEl = document.getElementById("attendanceTable");
    const tbodyEl = document.getElementById("tableBody");
    
    loadingEl.style.display = "block";
    tableEl.style.display = "none";
    tbodyEl.innerHTML = "";

    const start = document.getElementById("startDate").value;
    const end = document.getElementById("endDate").value;
    const selectedRole = document.getElementById("roleFilter").value;

    try {
      // Query attendance Daily records
      const q = query(
        collection(db, "attendanceDaily"),
        orderBy("date", "desc")
      );

      const snapshot = await getDocs(q);
      let records = [];

      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        
        // Date Filter (Client-side filtering for flexible string dates)
        if (data.date >= start && data.date <= end) {
          // Role Filter
          if (selectedRole === "ALL" || data.role === selectedRole) {
            records.push(data);
          }
        }
      });

      document.getElementById("totalRecordsCount").innerText = `${records.length} Record(s) Found`;
      document.getElementById("reportSubtitle").innerText = `Log from ${start} to ${end}`;

      if (records.length === 0) {
        loadingEl.innerText = "No attendance logs found for the selected range.";
        return;
      }

      records.forEach(r => {
        const tr = document.createElement("tr");

        const clockInStatus = r.clockIn?.status || "NONE";
        const clockOutStatus = r.clockOut?.status || "NONE";

        const clockInMinutes = r.clockIn?.minutes ? ` (${r.clockIn.minutes}m)` : "";
        const clockOutMinutes = r.clockOut?.minutes ? ` (${r.clockOut.minutes}m)` : "";

        tr.innerHTML = `
          <td><strong>${r.date}</strong></td>
          <td>${r.name || 'Unknown'}</td>
          <td><span style="text-transform:capitalize;">${r.role || 'staff'}</span></td>
          <td>
            ${formatTime(r.clockIn?.time)}
            <span class="badge badge-${clockInStatus}">${clockInStatus}${clockInMinutes}</span>
          </td>
          <td>
            ${r.clockOut ? formatTime(r.clockOut.time) : '--:--'}
            ${r.clockOut ? `<span class="badge badge-${clockOutStatus}">${clockOutStatus}${clockOutMinutes}</span>` : ''}
          </td>
          <td><strong>${formatDuration(r.clockIn?.time, r.clockOut?.time)}</strong></td>
        `;

        tbodyEl.appendChild(tr);
      });

      loadingEl.style.display = "none";
      tableEl.style.display = "table";

    } catch (err) {
      console.error("Error loading records:", err);
      loadingEl.innerText = "Error loading records: " + err.message;
    }
  }

  // Filter Trigger
  document.getElementById("btnApplyFilter").addEventListener("click", fetchAttendance);

  // PDF Generation Trigger
  document.getElementById("btnExportPDF").addEventListener("click", () => {
    const element = document.getElementById("pdfContent");
    const opt = {
      margin:       0.5,
      filename:     `TEF_Attendance_Report_${document.getElementById("startDate").value}_to_${document.getElementById("endDate").value}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
    };

    html2pdf().set(opt).from(element).save();
  });

  // Initial Load
  fetchAttendance();
</script>

</body>
</html>
