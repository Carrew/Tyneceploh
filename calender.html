<!DOCTYPE html>
<html>
<head>
  <title>TEF Academic Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --bg:#0b0b0f;
      --card:rgba(255,255,255,0.06);
      --text:#fff;
      --pink:#ffc0cb;
      --maroon:#800000;
      --blue:#3498db;
    }

    body{
      margin:0;
      font-family:system-ui;
      background: radial-gradient(circle at top, #1a0010, var(--bg));
      color:var(--text);
      padding:20px;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    /* HERO */
    .hero{
      background:linear-gradient(135deg,var(--maroon),#ff4d6d);
      color:white;
      padding:28px;
      border-radius:18px;
      margin-bottom:20px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    .hero h1{
      margin:0;
      font-size:28px;
    }

    .hero p{
      opacity:0.85;
      margin-top:8px;
    }

    .active-session{
      margin-top:15px;
      display:inline-block;
      background:rgba(255,255,255,0.15);
      padding:8px 12px;
      border-radius:999px;
      font-weight:600;
      backdrop-filter:blur(10px);
    }

    /* FILTER BOX */
    .box{
      background:var(--card);
      padding:16px;
      border-radius:14px;
      margin-bottom:18px;
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.08);
    }

    .filters{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    select,input{
      width:100%;
      padding:10px;
      border-radius:10px;
      border:none;
      outline:none;
      background:rgba(255,255,255,0.08);
      color:white;
    }

    /* TIMELINE */
    .timeline{
      position:relative;
      margin-top:10px;
    }

    .timeline::before{
      content:"";
      position:absolute;
      left:18px;
      top:0;
      bottom:0;
      width:3px;
      background:rgba(255,255,255,0.1);
    }

    .event{
      position:relative;
      margin-left:55px;
      background:var(--card);
      padding:16px;
      border-radius:14px;
      margin-bottom:16px;
      border-left:4px solid var(--blue);
      backdrop-filter:blur(10px);
      transition:0.2s ease;
    }

    .event:hover{
      transform:scale(1.01);
    }

    .event::before{
      content:"";
      position:absolute;
      left:-45px;
      top:20px;
      width:14px;
      height:14px;
      border-radius:50%;
      background:var(--blue);
      border:3px solid white;
      box-shadow:0 0 0 2px var(--blue);
    }

    .badge{
      display:inline-block;
      padding:5px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      margin-top:8px;
      color:white;
    }

    .Holiday{ background:#e74c3c; }
    .Exam{ background:#8e44ad; }
    .Sports{ background:#27ae60; }
    .Meeting{ background:#2980b9; }
    .Academic{ background:#f39c12; }
    .Deadline{ background:#d35400; }
    .Celebration{ background:#16a085; }
    .Emergency{ background:#2c3e50; }
    .Other{ background:#7f8c8d; }

    .meta{
      margin-top:12px;
      opacity:0.8;
      font-size:13px;
      line-height:1.5;
    }

    .empty{
      text-align:center;
      opacity:0.7;
      padding:30px;
    }

    @media(max-width:700px){
      .filters{
        grid-template-columns:1fr;
      }

      .hero h1{
        font-size:22px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>TEF Academic Calendar</h1>
    <p>Events, exams, holidays, and the rhythm of the school year.</p>

    <div id="activeSessionBox"></div>
  </div>

  <div class="box">
    <div class="filters">

      <div>
        <label>Session</label>
        <select id="sessionFilter" onchange="renderEvents()">
          <option value="all">All Sessions</option>
        </select>
      </div>

      <div>
        <label>Category</label>
        <select id="categoryFilter" onchange="renderEvents()">
          <option value="all">All Categories</option>
          <option>Holiday</option>
          <option>Exam</option>
          <option>Sports</option>
          <option>Meeting</option>
          <option>Academic</option>
          <option>Deadline</option>
          <option>Celebration</option>
          <option>Emergency</option>
          <option>Other</option>
        </select>
      </div>

    </div>

    <input id="searchBox"
           placeholder="Search events..."
           oninput="renderEvents()"
           style="margin-top:12px;">
  </div>

  <div class="box">
    <h2 style="margin:0 0 10px 0;">Timeline</h2>
    <div class="timeline" id="timeline">
      Loading calendar...
    </div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

let sessionsCache = [];
let eventsCache = [];

async function loadSessions(){

  const snap = await getDocs(
    query(collection(db,"academicSessions"), orderBy("createdAt","desc"))
  );

  sessionsCache = [];

  let active = null;

  snap.forEach(d=>{
    const s = d.data();
    sessionsCache.push(s);
    if(s.active) active = s.name;
  });

  document.getElementById("sessionFilter").innerHTML =
    `<option value="all">All Sessions</option>` +
    sessionsCache.map(s=>`<option value="${s.name}">${s.name}</option>`).join("");

  if(active){
    document.getElementById("activeSessionBox").innerHTML =
      `<div class="active-session">Active Session: ${active}</div>`;
  }
}

async function loadEvents(){

  const snap = await getDocs(
    query(collection(db,"schoolCalendar"), orderBy("startDate","asc"))
  );

  eventsCache = [];

  snap.forEach(d=>{
    const e = d.data();
    if(e.visibility==="public" && e.status==="active"){
      eventsCache.push(e);
    }
  });

  renderEvents();
}

window.renderEvents = function(){

  const search = document.getElementById("searchBox").value.toLowerCase();
  const session = document.getElementById("sessionFilter").value;
  const category = document.getElementById("categoryFilter").value;

  let filtered = eventsCache.filter(e=>{

    const matchSearch =
      e.title.toLowerCase().includes(search) ||
      (e.description||"").toLowerCase().includes(search);

    const matchSession = session==="all" || e.session===session;
    const matchCategory = category==="all" || e.category===category;

    return matchSearch && matchSession && matchCategory;
  });

  filtered.sort((a,b)=>new Date(a.startDate)-new Date(b.startDate));

  const box = document.getElementById("timeline");

  if(filtered.length===0){
    box.innerHTML = `<div class="empty">No events found.</div>`;
    return;
  }

  box.innerHTML = filtered.map(e=>`

    <div class="event">

      <h3>${e.title}</h3>

      <div class="badge ${e.category}">
        ${e.category}
      </div>

      <p>${e.description || "No description"}</p>

      <div class="meta">
        <b>Session:</b> ${e.session}<br>
        <b>Start:</b> ${format(e.startDate)}<br>
        <b>End:</b> ${format(e.endDate)}
      </div>

    </div>

  `).join("");
};

function format(d){
  return new Date(d).toLocaleDateString(undefined,{
    year:"numeric",
    month:"long",
    day:"numeric"
  });
}

async function init(){
  await loadSessions();
  await loadEvents();
}

init();

</script>

</body>
</html>
