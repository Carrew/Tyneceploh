<!DOCTYPE html>
<html>
<head>
  <title>TEF Attendance Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:15px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
      text-align:center;
    }

    .big{
      font-size:22px;
      font-weight:bold;
      margin-top:10px;
    }

    table{
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
      background:white;
      border-radius:10px;
      overflow:hidden;
    }

    th,td{
      padding:10px;
      border:1px solid #eee;
      text-align:center;
    }

    th{
      background:#2980b9;
      color:white;
    }

    .warn{
      color:#c0392b;
      font-weight:bold;
    }

    .good{
      color:#27ae60;
      font-weight:bold;
    }

  </style>
</head>

<body>

<h2>Attendance Analytics Dashboard</h2>

<div class="grid">

  <div class="card">
    Total Staff
    <div class="big" id="total">0</div>
  </div>

  <div class="card">
    Present Today
    <div class="big good" id="present">0</div>
  </div>

  <div class="card">
    Late Arrivals
    <div class="big warn" id="late">0</div>
  </div>

  <div class="card">
    Early Exit
    <div class="big warn" id="early">0</div>
  </div>

  <div class="card">
    Overtime
    <div class="big good" id="overtime">0</div>
  </div>

  <div class="card">
    Flags (Issues)
    <div class="big warn" id="flags">0</div>
  </div>

</div>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>Clock In</th>
      <th>Clock Out</th>
      <th>Status</th>
      <th>Duration (hrs)</th>
      <th>Flags</th>
    </tr>
  </thead>

  <tbody id="body"></tbody>
</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

function hoursDiff(a,b){
  if(!a || !b) return 0;
  return ((b - a) / (1000*60*60)).toFixed(2);
}

async function load(){

  const snap = await getDocs(collection(db,"attendanceDaily"));
  const usersSnap = await getDocs(collection(db,"users"));

  const users = {};
  usersSnap.forEach(d=>{
    users[d.data().userId] = d.data();
  });

  let total = 0;
  let present = 0;
  let late = 0;
  let early = 0;
  let overtime = 0;
  let flags = 0;

  const rows = [];

  snap.forEach(d=>{

    const a = d.data();
    total++;

    const u = users[a.userId] || {};

    let status = "ABSENT";
    let duration = 0;
    let flagList = [];

    if(a.clockIn){

      present++;

      status = a.clockIn.status || "ON_TIME";

      if(status === "LATE") late++;
      if(status === "EARLY") early++;

      if(a.clockOut){

        duration =
          hoursDiff(
            a.clockIn.time,
            a.clockOut.time
          );

        if(duration > 9){
          overtime++;
        }

      }

      if(a.clockIn.flag){
        flagList.push(a.clockIn.flag);
        flags++;
      }

      if(a.clockOut?.flag){
        flagList.push(a.clockOut.flag);
        flags++;
      }

    }

    rows.push(`
      <tr>
        <td>${u.name || a.name}</td>
        <td>${a.role}</td>
        <td>${a.clockIn ? new Date(a.clockIn.time).toLocaleTimeString() : "-"}</td>
        <td>${a.clockOut ? new Date(a.clockOut.time).toLocaleTimeString() : "-"}</td>
        <td>${status}</td>
        <td>${duration}</td>
        <td class="warn">${flagList.join(", ") || "OK"}</td>
      </tr>
    `);

  });

  document.getElementById("body").innerHTML = rows.join("");

  document.getElementById("total").innerText = total;
  document.getElementById("present").innerText = present;
  document.getElementById("late").innerText = late;
  document.getElementById("early").innerText = early;
  document.getElementById("overtime").innerText = overtime;
  document.getElementById("flags").innerText = flags;

}

load();

</script>

</body>
</html>
