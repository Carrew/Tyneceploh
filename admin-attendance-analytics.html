<!DOCTYPE html>
<html>
<head>
  <title>TEF Attendance Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background: radial-gradient(circle at top, #1a0010, #0b0b0f);
      padding:20px;
      color:white;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#ffc0cb;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:15px;
    }

    .card{
      background: rgba(255,255,255,0.06);
      padding:15px;
      border-radius:12px;
      text-align:center;
      border-left:3px solid #ffc0cb;
    }

    .big{
      font-size:22px;
      font-weight:bold;
      margin-top:10px;
    }

    table{
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
      background: rgba(255,255,255,0.04);
      border-radius:10px;
      overflow:hidden;
    }

    th,td{
      padding:10px;
      border:1px solid rgba(255,255,255,0.1);
      text-align:center;
      font-size:14px;
    }

    th{
      background:#800000;
      color:white;
    }

    .warn{ color:#ff6b6b; font-weight:bold; }
    .good{ color:#2ecc71; font-weight:bold; }
  </style>
</head>

<body>

<h2>Attendance Analytics Dashboard</h2>

<div class="grid">

  <div class="card">Total Staff<div class="big" id="total">0</div></div>
  <div class="card">Present Today<div class="big good" id="present">0</div></div>
  <div class="card">Late Arrivals<div class="big warn" id="late">0</div></div>
  <div class="card">Early Exit<div class="big warn" id="early">0</div></div>
  <div class="card">Overtime<div class="big good" id="overtime">0</div></div>
  <div class="card">Flags<div class="big warn" id="flags">0</div></div>

</div>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>Clock In</th>
      <th>Clock Out</th>
      <th>Status</th>
      <th>Hours</th>
      <th>Flags</th>
    </tr>
  </thead>

  <tbody id="body"></tbody>
</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

// 🔐 ROLE SAFETY
if(!user || !["admin","coordinator"].includes(user.role)){
  location.href = "login.html";
}

// ⚡ simple cache (reduces repeated lookups feeling slow)
const userCache = new Map();

function hoursDiff(a,b){
  if(!a || !b) return 0;
  return ((b - a) / (1000*60*60)).toFixed(2);
}

async function loadUsers(){
  const snap = await getDocs(collection(db,"users"));

  snap.forEach(d=>{
    const u = d.data();
    userCache.set(u.userId, u);
  });
}

async function load(){

  await loadUsers();

  const snap = await getDocs(collection(db,"attendanceDaily"));

  let total = 0;
  let present = 0;
  let late = 0;
  let early = 0;
  let overtime = 0;
  let flags = 0;

  const rows = [];

  snap.forEach(d=>{

    const a = d.data();
    total++;

    const u = userCache.get(a.userId) || {};

    let status = "ABSENT";
    let duration = 0;
    let flagList = [];

    if(a.clockIn){

      present++;

      status = a.clockIn.status || "ON_TIME";

      if(status === "LATE") late++;
      if(status === "EARLY") early++;

      if(a.clockOut){
        duration = hoursDiff(a.clockIn.time, a.clockOut.time);

        if(Number(duration) > 9){
          overtime++;
        }
      }

      if(a.clockIn.flag){
        flagList.push(a.clockIn.flag);
        flags++;
      }

      if(a.clockOut?.flag){
        flagList.push(a.clockOut.flag);
        flags++;
      }
    }

    rows.push(`
      <tr>
        <td>${u.name || a.name || "-"}</td>
        <td>${a.role || "-"}</td>
        <td>${a.clockIn ? new Date(a.clockIn.time).toLocaleTimeString() : "-"}</td>
        <td>${a.clockOut ? new Date(a.clockOut.time).toLocaleTimeString() : "-"}</td>
        <td class="${status === "LATE" ? "warn" : "good"}">${status}</td>
        <td>${duration}</td>
        <td class="warn">${flagList.join(", ") || "OK"}</td>
      </tr>
    `);

  });

  body.innerHTML = rows.join("");

  totalEl.innerText = total;
  presentEl.innerText = present;
  lateEl.innerText = late;
  earlyEl.innerText = early;
  overtimeEl.innerText = overtime;
  flagsEl.innerText = flags;
}

// DOM refs (cleaner + faster access)
const body = document.getElementById("body");

const totalEl = document.getElementById("total");
const presentEl = document.getElementById("present");
const lateEl = document.getElementById("late");
const earlyEl = document.getElementById("early");
const overtimeEl = document.getElementById("overtime");
const flagsEl = document.getElementById("flags");

load();

</script>

</body>
</html>
