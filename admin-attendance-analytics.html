<!DOCTYPE html>
<html>
<head>
  <title>TEF Daily Attendance Sheet</title>

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    h2{
      text-align:center;
    }

    .top{
      text-align:center;
      margin-bottom:20px;
    }

    input{
      padding:10px;
    }

    button{
      padding:10px 14px;
      border:none;
      border-radius:6px;
      background:#2980b9;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:15px;
      margin-bottom:20px;
    }

    .summary-card{
      background:white;
      padding:15px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      text-align:center;
    }

    .summary-card h3{
      margin:0;
      font-size:28px;
    }

    .table-wrap{
      background:white;
      padding:15px;
      border-radius:10px;
      overflow:auto;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th, td{
      border:1px solid #ddd;
      padding:8px;
      text-align:center;
      font-size:13px;
    }

    th{
      background:#eee;
    }

    .late{
      color:#e67e22;
      font-weight:bold;
    }

    .early{
      color:#3498db;
      font-weight:bold;
    }

    .overtime{
      color:#27ae60;
      font-weight:bold;
    }

    .missing{
      color:#c0392b;
      font-weight:bold;
    }
  </style>
</head>

<body>

<h2>Daily Attendance Report</h2>

<div class="top">
  <input type="date" id="date">
  <button onclick="loadAttendance()">
    Load Report
  </button>
</div>

<div class="summary-grid">

  <div class="summary-card">
    <p>Present</p>
    <h3 id="presentCount">0</h3>
  </div>

  <div class="summary-card">
    <p>Late</p>
    <h3 id="lateCount">0</h3>
  </div>

  <div class="summary-card">
    <p>Early Arrivals</p>
    <h3 id="earlyCount">0</h3>
  </div>

  <div class="summary-card">
    <p>Missing Clock-Out</p>
    <h3 id="missingCount">0</h3>
  </div>

</div>

<div class="table-wrap">

  <table>

    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Clock-In</th>
        <th>Clock-In Status</th>
        <th>Clock-Out</th>
        <th>Clock-Out Status</th>
        <th>Work Duration</th>
      </tr>
    </thead>

    <tbody id="tbody"></tbody>

  </table>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user =
  JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

//
// FORMAT TIME
//
function formatTime(ts){

  if(!ts) return "-";

  return new Date(ts)
    .toLocaleTimeString();

}

//
// WORK DURATION
//
function workDuration(inTime,outTime){

  if(!inTime || !outTime){
    return "-";
  }

  const diff =
    outTime - inTime;

  const hrs =
    Math.floor(diff / 3600000);

  const mins =
    Math.floor(
      (diff % 3600000) / 60000
    );

  return `${hrs}h ${mins}m`;

}

//
// LOAD REPORT
//
window.loadAttendance = async function(){

  const date =
    document.getElementById("date").value;

  if(!date){
    alert("Select date");
    return;
  }

  const snap =
    await getDocs(
      collection(db,"attendanceDaily")
    );

  const rows = [];

  let present = 0;
  let late = 0;
  let early = 0;
  let missing = 0;

  snap.forEach(d => {

    const data = d.data();

    if(data.date !== date) return;

    present++;

    if(
      data.clockIn?.status === "LATE"
    ){
      late++;
    }

    if(
      data.clockIn?.status === "EARLY"
    ){
      early++;
    }

    if(!data.clockOut){
      missing++;
    }

    rows.push(`
      <tr>

        <td>${data.name}</td>

        <td>${data.role}</td>

        <td>
          ${
            formatTime(
              data.clockIn?.time
            )
          }
        </td>

        <td class="
          ${
            data.clockIn?.status === "LATE"
            ? "late"
            : data.clockIn?.status === "EARLY"
            ? "early"
            : ""
          }
        ">
          ${
            data.clockIn?.status || "-"
          }

          ${
            data.clockIn?.minutes
            ? `(${data.clockIn.minutes} mins)`
            : ""
          }
        </td>

        <td>
          ${
            formatTime(
              data.clockOut?.time
            )
          }
        </td>

        <td class="
          ${
            data.clockOut?.status === "OVERTIME"
            ? "overtime"
            : data.clockOut?.status === "EARLY_EXIT"
            ? "late"
            : ""
          }
        ">
          ${
            data.clockOut?.status || "-"
          }

          ${
            data.clockOut?.minutes
            ? `(${data.clockOut.minutes} mins)`
            : ""
          }
        </td>

        <td class="
          ${
            !data.clockOut
            ? "missing"
            : ""
          }
        ">
          ${
            workDuration(
              data.clockIn?.time,
              data.clockOut?.time
            )
          }
        </td>

      </tr>
    `);

  });

  document.getElementById("tbody")
    .innerHTML = rows.join("");

  document.getElementById("presentCount")
    .textContent = present;

  document.getElementById("lateCount")
    .textContent = late;

  document.getElementById("earlyCount")
    .textContent = early;

  document.getElementById("missingCount")
    .textContent = missing;

}

</script>

</body>
</html>
