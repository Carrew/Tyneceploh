<!DOCTYPE html>
<html>
<head>
<title>Attendance Report</title>

<style>
body{font-family:sans-serif;background:#f4f4f4;padding:20px}
table{width:100%;background:#fff;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#eee}
</style>
</head>

<body>

<h2>Daily Report</h2>

<input type="date" id="date">
<button onclick="load()">Load</button>

<table>
<thead>
<tr>
<th>Name</th><th>In</th><th>Status</th><th>Out</th><th>Work</th>
</tr>
</thead>
<tbody id="t"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
projectId:"tyneceploh"
});

const db=getFirestore(app);

window.load=async()=>{
const d=date.value;
const snap=await getDocs(collection(db,"attendanceDaily"));
let rows="";
snap.forEach(x=>{
const v=x.data();
if(v.date!==d)return;

rows+=`
<tr>
<td>${v.name}</td>
<td>${v.clockIn?new Date(v.clockIn.time).toLocaleTimeString():"-"}</td>
<td>${v.clockIn?.status||"-"}</td>
<td>${v.clockOut?new Date(v.clockOut.time).toLocaleTimeString():"-"}</td>
<td>${v.clockOut?((v.clockOut.time-v.clockIn.time)/3600000).toFixed(1)+"h":"-"}</td>
</tr>`;
});
t.innerHTML=rows;
};
</script>

</body>
</html>
