<!DOCTYPE html>
<html>
<head>
  <title>TEF Daily Attendance Sheet</title>

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    h2{
      text-align:center;
    }

    .top{
      text-align:center;
      margin-bottom:20px;
    }

    input{
      padding:10px;
      margin:5px;
    }

    button{
      padding:10px 14px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
      background:#2980b9;
      color:white;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:15px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .present{ color:green; font-weight:bold; }
    .late{ color:orange; font-weight:bold; }
    .absent{ color:red; font-weight:bold; }
    .flag{ color:#c0392b; font-weight:bold; }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
    }

    th,td{
      border:1px solid #ddd;
      padding:8px;
      font-size:13px;
      text-align:center;
    }

    th{
      background:#eee;
    }
  </style>
</head>

<body>

<h2>Daily Attendance Sheet</h2>

<div class="top">
  <input type="date" id="date">
  <button onclick="loadSheet()">Generate</button>
</div>

<div id="summary" class="card"></div>

<div class="card">
  <h3>Attendance List</h3>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Clock-In</th>
        <th>Clock-Out</th>
        <th>Status</th>
        <th>Flags</th>
      </tr>
    </thead>

    <tbody id="list"></tbody>
  </table>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  getDocs,
  collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));
if(!user || user.role !== "admin"){
  location.href="login.html";
}

window.loadSheet = async function(){

  const date = document.getElementById("date").value;

  if(!date){
    alert("Select date");
    return;
  }

  const snap = await getDocs(collection(db,"attendanceRecords"));

  const map = {};

  snap.forEach(d => {

    const r = d.data();

    if(r.date !== date) return;

    if(!map[r.userId]){

      map[r.userId] = {
        name:r.name,
        role:r.role,
        clockIn:null,
        clockOut:null,
        flags:[]
      };

    }

    if(r.type === "clock-in"){
      map[r.userId].clockIn = r.time;
    }

    if(r.type === "clock-out"){
      map[r.userId].clockOut = r.time;
    }

    if(r.flags?.length){
      map[r.userId].flags.push(...r.flags);
    }

  });

  const rows = Object.values(map);

  render(rows);

  renderSummary(rows);

};

function render(data){

  const tbody = document.getElementById("list");

  tbody.innerHTML = "";

  data.forEach(u => {

    let status = "ABSENT";

    if(u.clockIn){
      status = "PRESENT";
    }

    if(u.flags.includes("LATE_CLOCK_IN")){
      status = "LATE";
    }

    tbody.innerHTML += `
      <tr>
        <td>${u.name}</td>
        <td>${u.role}</td>

        <td>
          ${u.clockIn ? new Date(u.clockIn).toLocaleTimeString() : "-"}
        </td>

        <td>
          ${u.clockOut ? new Date(u.clockOut).toLocaleTimeString() : "-"}
        </td>

        <td class="${status.toLowerCase()}">
          ${status}
        </td>

        <td class="flag">
          ${u.flags.join(", ") || "-"}
        </td>
      </tr>
    `;

  });

}

function renderSummary(data){

  let present = 0;
  let late = 0;
  let absent = 0;

  data.forEach(u => {

    if(!u.clockIn){
      absent++;
    }else if(u.flags.includes("LATE_CLOCK_IN")){
      late++;
    }else{
      present++;
    }

  });

  document.getElementById("summary").innerHTML = `
    <h3>Summary</h3>
    <p>Present: <b>${present}</b></p>
    <p>Late: <b>${late}</b></p>
    <p>Absent: <b>${absent}</b></p>
  `;

}

</script>

</body>
</html>
