<!DOCTYPE html>
<html>
<head>
  <title>Coordinator Dashboard - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    :root{
      --bg:#0b0b0f;
      --panel:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.08);
      --pink:#ffc0cb;
      --text:#fff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:system-ui;
    }

    body{
      background:radial-gradient(circle at top,#1a0010,var(--bg));
      color:var(--text);
      min-height:100vh;
    }

    header{
      padding:22px;
      text-align:center;
      background:linear-gradient(135deg,#800000,#1a0010);
    }

    header h1{
      color:var(--pink);
    }

    .sub{
      opacity:.7;
      margin-top:6px;
      font-size:13px;
    }

    /* PROFILE */
    .profile{
      margin:16px;
      padding:18px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      display:flex;
      align-items:center;
      gap:14px;
    }

    .profile img{
      width:70px;
      height:70px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--pink);
      background:#222;
    }

    .meta{
      font-size:13px;
      opacity:.8;
    }

    /* STATS (ONLY REAL OR SAFE INFO) */
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:10px;
      padding:0 16px;
    }

    .stat{
      background:var(--panel);
      border:1px solid var(--border);
      padding:14px;
      border-radius:12px;
      text-align:center;
    }

    .stat b{
      color:var(--pink);
      font-size:13px;
    }

    .stat h3{
      margin-top:6px;
    }

    /* SECTIONS */
    .section-title{
      padding:18px 16px 8px;
      font-size:12px;
      opacity:.7;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:10px;
      padding:12px 16px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--border);
      padding:14px;
      border-radius:12px;
      cursor:pointer;
      transition:.2s;
    }

    .card:hover{
      border-color:var(--pink);
      transform:translateY(-3px);
    }

    .logout{
      width:90%;
      margin:25px auto;
      display:block;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#1b1b25;
      color:white;
    }

  </style>
</head>

<body>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "coordinator"){
  location.href = "login.html";
}
</script>

<header>
  <h1>Coordinator Control Panel</h1>
  <div class="sub">School oversight & coordination system</div>
</header>

<!-- PROFILE -->
<div class="profile">

  <img id="photo">

  <div>

    <b id="name"></b>

    <div class="meta">ID: <span id="id"></span></div>

    <div class="meta">Role: <span id="role"></span></div>

  </div>

</div>

<!-- SAFE STATS ONLY (NO FAKE NUMBERS) -->
<div class="stats">

  <div class="stat">
    <b>Status</b>
    <h3>Active</h3>
  </div>

  <div class="stat">
    <b>Access Level</b>
    <h3>Coordinator</h3>
  </div>

</div>

<!-- OVERSIGHT TOOLS -->
<div class="section-title">Oversight Tools</div>

<div class="grid">

  <div class="card" onclick="go('admin-view-attendance.html')">
    📌 Attendance Logs
  </div>

  <div class="card" onclick="go('admin-attendance-analytics.html')">
    📊 Analytics
  </div>

  <div class="card" onclick="go('admin-grade-approval.html')">
    📥 Grade Approval
  </div>

  <div class="card" onclick="go('admin-results.html')">
    🏆 Results
  </div>

</div>

<!-- COMMUNICATION -->
<div class="section-title">Communication</div>

<div class="grid">

  <div class="card" onclick="go('admin-announcements.html')">
    📢 Announcements
  </div>

  <div class="card" onclick="go('users-announcement.html')">
    📣 Broadcast Users
  </div>

</div>

<!-- SYSTEM VIEW -->
<div class="section-title">System View</div>

<div class="grid">

  <div class="card" onclick="go('student-dashboard.html')">
    👨‍🎓 Student View
  </div>

  <div class="card" onclick="go('teacher-dashboard.html')">
    👨‍🏫 Teacher View
  </div>

  <div class="card" onclick="go('admin-dashboard.html')">
    🏠 Admin View
  </div>

</div>

<button class="logout" onclick="logout()">Logout</button>

<script>

/* PROFILE */
document.getElementById("name").innerText = user.name || "Coordinator";
document.getElementById("id").innerText = user.userId || "-";
document.getElementById("role").innerText = (user.role || "").toUpperCase();

/* PHOTO */
const img = user.photoURL || "https://via.placeholder.com/100";
document.getElementById("photo").src = img;

/* NAV */
function go(page){
  location.href = page;
}

function logout(){
  localStorage.removeItem("user");
  location.href = "login.html";
}

</script>

</body>
</html>
