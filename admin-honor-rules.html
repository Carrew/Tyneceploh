<!DOCTYPE html>
<html>
<head>
  <title>Honor Rules Admin - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:700px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
    }

    .row{
      display:flex;
      gap:10px;
      margin-bottom:10px;
    }

    input{
      flex:1;
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
    }

    button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border:none;
      border-radius:6px;
      background:#27ae60;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .rule-box{
      margin-top:20px;
      background:#fafafa;
      padding:10px;
      border-radius:8px;
      border:1px solid #ddd;
    }

    .msg{
      margin-top:10px;
      padding:10px;
      border-radius:6px;
      font-size:14px;
    }

    .ok{ background:#d4edda; color:#155724; }
    .bad{ background:#f8d7da; color:#721c24; }

  </style>
</head>

<body>

<h2>Honor Rules Admin Panel</h2>

<div class="box">

  <div class="rule-box">

    <h3>Score Bands</h3>

    <div class="row">
      <input id="propMin" placeholder="Proprietor Min (e.g 90)">
      <input id="propMax" placeholder="Proprietor Max (e.g 100)">
    </div>

    <div class="row">
      <input id="prinMin" placeholder="Principal Min (e.g 85)">
      <input id="prinMax" placeholder="Principal Max (e.g 89.9)">
    </div>

    <div class="row">
      <input id="honMin" placeholder="Honor Min (e.g 80)">
      <input id="honMax" placeholder="Honor Max (e.g 84.9)">
    </div>

  </div>

  <button onclick="saveRules()">Save Rules</button>

  <div id="msg"></div>

  <hr>

  <button onclick="loadRules()">Load Current Rules</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const msg = document.getElementById("msg");

// -------------------------
// SAVE RULES
// -------------------------
window.saveRules = async function(){

  const rules = {
    bands:[
      {
        name:"Proprietor",
        min:Number(propMin.value),
        max:Number(propMax.value)
      },
      {
        name:"Principal",
        min:Number(prinMin.value),
        max:Number(prinMax.value)
      },
      {
        name:"Honor",
        min:Number(honMin.value),
        max:Number(honMax.value)
      }
    ],
    updatedAt:Date.now()
  };

  if(
    isNaN(rules.bands[0].min) ||
    isNaN(rules.bands[0].max)
  ){
    return show("Invalid values", "bad");
  }

  await setDoc(doc(db,"honorRules","main"),rules);

  show("Rules saved successfully", "ok");

};

// -------------------------
// LOAD RULES
// -------------------------
window.loadRules = async function(){

  const snap = await getDoc(doc(db,"honorRules","main"));

  if(!snap.exists()){
    return show("No rules found", "bad");
  }

  const r = snap.data();

  propMin.value = r.bands[0].min;
  propMax.value = r.bands[0].max;

  prinMin.value = r.bands[1].min;
  prinMax.value = r.bands[1].max;

  honMin.value = r.bands[2].min;
  honMax.value = r.bands[2].max;

  show("Rules loaded", "ok");

};

// -------------------------
function show(text,type){
  msg.className = "msg " + type;
  msg.textContent = text;
}

</script>

</body>
</html>
