<!DOCTYPE html>
<html>
<head>
  <title>Honor Rules Admin - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --maroon:#800000;
      --pink:#ffc0cb;
      --bg:#0b0b0f;
      --card:rgba(255,255,255,0.06);
      --text:#fff;
      --green:#27ae60;
      --red:#c0392b;
    }

    body{
      margin:0;
      font-family:system-ui;
      background:radial-gradient(circle at top,#1a0010,var(--bg));
      color:white;
      padding:20px;
    }

    h2{
      text-align:center;
      color:var(--pink);
      margin-bottom:20px;
      letter-spacing:1px;
    }

    .box{
      max-width:750px;
      margin:auto;
      background:var(--card);
      backdrop-filter:blur(10px);
      padding:20px;
      border-radius:16px;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
      border:1px solid rgba(255,255,255,0.08);
    }

    .rule-box{
      margin-top:10px;
      background:rgba(255,255,255,0.04);
      padding:15px;
      border-radius:14px;
      border-left:4px solid var(--pink);
    }

    h3{
      margin-top:0;
      color:var(--pink);
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:10px;
    }

    input{
      padding:12px;
      border-radius:10px;
      border:none;
      outline:none;
      background:rgba(255,255,255,0.08);
      color:white;
      transition:0.3s;
    }

    input:focus{
      box-shadow:0 0 0 2px var(--pink);
      background:rgba(255,255,255,0.12);
    }

    button{
      width:100%;
      padding:12px;
      margin-top:12px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      color:white;
      background:linear-gradient(135deg,var(--maroon),var(--pink));
      transition:0.3s;
    }

    button:hover{
      transform:translateY(-2px);
    }

    button:active{
      transform:scale(0.98);
    }

    .msg{
      margin-top:15px;
      padding:12px;
      border-radius:10px;
      font-size:14px;
      text-align:center;
    }

    .ok{
      background:rgba(39,174,96,0.2);
      border:1px solid var(--green);
      color:#b8f5c9;
    }

    .bad{
      background:rgba(192,57,43,0.2);
      border:1px solid var(--red);
      color:#ffb3b3;
    }

    .hint{
      font-size:12px;
      opacity:0.7;
      margin-top:6px;
    }

  </style>
</head>

<body>

<h2>Honor Rules Control Panel</h2>

<div class="box">

  <div class="rule-box">

    <h3>Score Bands Configuration</h3>

    <div class="hint">
      Define academic performance ranges for classification
    </div>

    <div class="row">
      <input id="propMin" placeholder="Proprietor Min (e.g 90)">
      <input id="propMax" placeholder="Proprietor Max (e.g 100)">
    </div>

    <div class="row">
      <input id="prinMin" placeholder="Principal Min (e.g 85)">
      <input id="prinMax" placeholder="Principal Max (e.g 89.9)">
    </div>

    <div class="row">
      <input id="honMin" placeholder="Honor Min (e.g 80)">
      <input id="honMax" placeholder="Honor Max (e.g 84.9)">
    </div>

  </div>

  <button onclick="saveRules()">Save Rules</button>

  <button onclick="loadRules()" style="opacity:0.9; margin-top:8px;">
    Load Current Rules
  </button>

  <div id="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const msg = document.getElementById("msg");

// SAVE RULES
window.saveRules = async function(){

  const rules = {
    bands:[
      { name:"Proprietor", min:Number(propMin.value), max:Number(propMax.value) },
      { name:"Principal", min:Number(prinMin.value), max:Number(prinMax.value) },
      { name:"Honor", min:Number(honMin.value), max:Number(honMax.value) }
    ],
    updatedAt:Date.now()
  };

  if(isNaN(rules.bands[0].min) || isNaN(rules.bands[0].max)){
    return show("Fix invalid numbers first", "bad");
  }

  await setDoc(doc(db,"honorRules","main"),rules);

  show("Rules saved successfully", "ok");
};

// LOAD RULES
window.loadRules = async function(){

  const snap = await getDoc(doc(db,"honorRules","main"));

  if(!snap.exists()){
    return show("No rules found yet", "bad");
  }

  const r = snap.data();

  propMin.value = r.bands[0].min;
  propMax.value = r.bands[0].max;

  prinMin.value = r.bands[1].min;
  prinMax.value = r.bands[1].max;

  honMin.value = r.bands[2].min;
  honMax.value = r.bands[2].max;

  show("Rules loaded", "ok");
};

function show(text,type){
  msg.className = "msg " + type;
  msg.textContent = text;
}

</script>

</body>
</html>
