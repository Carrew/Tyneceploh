<!DOCTYPE html>
<html>
<head>
  <title>Honor Rules Admin - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    .card{
      max-width:700px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:10px;
    }

    input{
      width:100%;
      padding:10px;
      border-radius:6px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:6px;
      background:#27ae60;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .danger{
      background:#c0392b;
    }

    .small{
      font-size:12px;
      color:#666;
      margin-top:5px;
    }

  </style>
</head>

<body>

<h2>Honor Roll Rules Setup</h2>

<div class="card">

  <h3>Grade Bands</h3>

  <div class="row">
    <input id="propMin" placeholder="Proprietor Min (e.g. 90)">
    <input id="propMax" placeholder="Proprietor Max (e.g. 100)">
  </div>

  <div class="row">
    <input id="prinMin" placeholder="Principal Min (e.g. 85)">
    <input id="prinMax" placeholder="Principal Max (e.g. 89.99)">
  </div>

  <div class="row">
    <input id="honorMin" placeholder="Honor Min (e.g. 80)">
    <input id="honorMax" placeholder="Honor Max (e.g. 84.99)">
  </div>

  <h3>Red Mark Rule</h3>

  <div class="row">
    <input id="redLimit" placeholder="Red Mark Limit (e.g. 69.99)">
    <input id="redToggle" placeholder="true / false (disqualify)">
  </div>

  <p class="small">
    If enabled, any student with a score below the red mark limit is automatically disqualified.
  </p>

  <button onclick="saveRules()">
    Save Honor Rules
  </button>

  <button class="danger" onclick="loadRules()">
    Reload Saved Rules
  </button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

window.saveRules = async function(){

  const data = {
    bands: [
      {
        name:"proprietor",
        min:Number(propMin.value),
        max:Number(propMax.value)
      },
      {
        name:"principal",
        min:Number(prinMin.value),
        max:Number(prinMax.value)
      },
      {
        name:"honor",
        min:Number(honorMin.value),
        max:Number(honorMax.value)
      }
    ],

    redMarkLimit:Number(redLimit.value),

    disqualifyOnRedMark:
      redToggle.value === "true"
  };

  await setDoc(
    doc(db,"honorRules","main"),
    data
  );

  alert("Honor rules saved");

};

window.loadRules = async function(){

  const snap = await getDoc(
    doc(db,"honorRules","main")
  );

  if(!snap.exists()){
    alert("No rules found");
    return;
  }

  const r = snap.data();

  propMin.value = r.bands[0].min;
  propMax.value = r.bands[0].max;

  prinMin.value = r.bands[1].min;
  prinMax.value = r.bands[1].max;

  honorMin.value = r.bands[2].min;
  honorMax.value = r.bands[2].max;

  redLimit.value = r.redMarkLimit;
  redToggle.value = r.disqualifyOnRedMark;

  alert("Rules loaded");

};

loadRules();

</script>

</body>
</html>
