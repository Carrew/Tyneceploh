<!DOCTYPE html>
<html>
<head>
  <title>Honor Rules Admin - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .card{
      max-width:700px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:10px;
    }

    input{
      width:100%;
      padding:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:6px;
      background:#27ae60;
      color:white;
      font-weight:bold;
    }

  </style>
</head>

<body>

<h2 style="text-align:center;">Honor Rules Setup</h2>

<div class="card">

  <h3>Grade Bands</h3>

  <div class="row">
    <input id="propMin" placeholder="Proprietor Min">
    <input id="propMax" placeholder="Proprietor Max">
  </div>

  <div class="row">
    <input id="prinMin" placeholder="Principal Min">
    <input id="prinMax" placeholder="Principal Max">
  </div>

  <div class="row">
    <input id="honorMin" placeholder="Honor Min">
    <input id="honorMax" placeholder="Honor Max">
  </div>

  <h3>Red Mark Rule</h3>

  <input id="redLimit" placeholder="Red Mark Limit (e.g. 69.9)">
  <input id="disqualify" placeholder="true / false">

  <button onclick="saveRules()">Save Rules</button>
  <button onclick="loadRules()">Reload Rules</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));
if(!user || user.role !== "admin") location.href="login.html";

window.saveRules = async function(){

  await setDoc(doc(db,"honorRules","main"),{

    bands:[
      {name:"proprietor", min:+propMin.value, max:+propMax.value},
      {name:"principal", min:+prinMin.value, max:+prinMax.value},
      {name:"honor", min:+honorMin.value, max:+honorMax.value}
    ],

    redMarkLimit:+redLimit.value,
    disqualifyOnRedMark: disqualify.value === "true"

  });

  alert("Rules saved");

};

window.loadRules = async function(){

  const snap = await getDoc(doc(db,"honorRules","main"));

  if(!snap.exists()) return;

  const r = snap.data();

  propMin.value = r.bands[0].min;
  propMax.value = r.bands[0].max;

  prinMin.value = r.bands[1].min;
  prinMax.value = r.bands[1].max;

  honorMin.value = r.bands[2].min;
  honorMax.value = r.bands[2].max;

  redLimit.value = r.redMarkLimit;
  disqualify.value = r.disqualifyOnRedMark;

};

loadRules();

</script>

</body>
</html>
