<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEF Credential Generator</title>

<style>
:root{
  --maroon:#800000;
  --pink:#ffc0cb;
  --dark:#0f0f14;
  --card:rgba(255,255,255,0.07);
  --text:#ffffff;
  --success:#28c76f;
  --danger:#ff4d6d;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:system-ui,sans-serif;
  background:
    radial-gradient(circle at top,#2b0018 0%, #12020b 45%, #09090d 100%);
  color:var(--text);
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:850px;
  margin:auto;
}

.top{
  margin-bottom:25px;
}

.top h1{
  color:var(--pink);
  font-size:30px;
  margin-bottom:8px;
}

.top p{
  opacity:.8;
  line-height:1.6;
}

.card{
  background:var(--card);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

select,
textarea,
button{
  width:100%;
  border:none;
  outline:none;
  border-radius:14px;
  padding:14px;
  margin-top:12px;
  font-size:15px;
}

select,
textarea{
  background:rgba(255,255,255,.08);
  color:white;
}

textarea{
  resize:none;
  min-height:130px;
}

button{
  background:linear-gradient(135deg,var(--maroon),var(--pink));
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:.25s;
}

button:hover{
  transform:translateY(-2px);
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.preview{
  margin-top:20px;
  background:rgba(255,255,255,.05);
  border-radius:20px;
  padding:20px;
  line-height:1.8;
  border-left:5px solid var(--pink);
}

.preview h3{
  margin-bottom:12px;
  color:var(--pink);
}

.highlight{
  color:var(--pink);
  font-weight:bold;
}

.msg{
  margin-top:15px;
  padding:14px;
  border-radius:12px;
  display:none;
  font-weight:600;
}

.success{
  background:rgba(40,199,111,.15);
  border:1px solid rgba(40,199,111,.4);
  color:#8ff0b3;
}

.error{
  background:rgba(255,77,109,.15);
  border:1px solid rgba(255,77,109,.4);
  color:#ff9db0;
}

.loading{
  opacity:.7;
  pointer-events:none;
}

@media(max-width:700px){

  body{
    padding:14px;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .top h1{
    font-size:24px;
  }

}
</style>
</head>
<body>

<div class="container">

  <div class="top">
    <h1>🔑 TEF Credential Generator</h1>
    <p>
      Quickly generate ready-to-send login credentials for teachers, students,
      administrators, coordinators and other staff members.
    </p>
  </div>

  <div class="card">

    <label>Select User</label>
    <select id="userSelect">
      <option value="">Loading users...</option>
    </select>

    <label style="display:block; margin-top:18px;">
      Custom Message
    </label>

    <textarea id="customMessage">
Welcome to Tyneceploh Educational Foundation.

Use the login details below to access your portal dashboard.

Please keep your credentials safe and do not share them with others.

Thank you.
    </textarea>

    <div class="actions">
      <button onclick="generateMessage()">
        Generate Message
      </button>

      <button onclick="copyMessage()">
        Copy Message
      </button>

      <button onclick="printCard()">
        Print
      </button>
    </div>

    <div id="msg" class="msg"></div>

    <div class="preview" id="preview">

      <h3>Credential Preview</h3>

      <p>
        Select a user and generate a message.
      </p>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const currentUser = JSON.parse(localStorage.getItem("user"));

if(!currentUser || currentUser.role !== "admin"){
  location.href = "login.html";
}

let usersCache = [];
let generatedText = "";

const select = document.getElementById("userSelect");

function showMessage(text,type="success"){

  const msg = document.getElementById("msg");

  msg.style.display = "block";
  msg.className = `msg ${type}`;
  msg.innerText = text;

  setTimeout(()=>{
    msg.style.display = "none";
  },4000);
}

async function loadUsers(){

  try{

    const snap = await getDocs(collection(db,"users"));

    usersCache = [];

    snap.forEach(docSnap=>{

      const data = docSnap.data();

      if(data.userId && data.pin){

        usersCache.push({
          ...data,
          docId:docSnap.id
        });

      }

    });

    usersCache.sort((a,b)=>
      (a.name || "").localeCompare(b.name || "")
    );

    select.innerHTML = `
      <option value="">Select User</option>

      ${usersCache.map(u=>`

        <option value="${u.docId}">
          ${u.name} • ${formatRole(u.role)}
        </option>

      `).join("")}
    `;

  }catch(err){

    console.error(err);

    select.innerHTML = `
      <option>
        Failed to load users
      </option>
    `;

    showMessage(
      "Failed to load users",
      "error"
    );

  }

}

function formatRole(role){

  if(!role) return "User";

  const map = {
    admin:"Administrator",
    teacher:"Teacher",
    student:"Student",
    coordinator:"Coordinator",
    janitor:"Janitor",
    security:"Security Staff",
    principal:"Principal"
  };

  return map[role] || role;

}

window.generateMessage = function(){

  const id = select.value;

  if(!id){

    showMessage(
      "Please select a user first",
      "error"
    );

    return;
  }

  const user = usersCache.find(
    u => u.docId === id
  );

  if(!user){

    showMessage(
      "User not found",
      "error"
    );

    return;
  }

  const custom =
    document.getElementById("customMessage")
    .value
    .trim();

  generatedText = `
${user.name},

This is your login information for Tyneceploh Educational Foundation.

Position: ${formatRole(user.role)}

User ID: ${user.userId}

PIN: ${user.pin}

${custom}

TEF
Hope For The Future / By God's Grace
  `.trim();

  document.getElementById("preview").innerHTML = `

    <h3>
      ${user.name}
    </h3>

    <p>
      <span class="highlight">
        Position:
      </span>
      ${formatRole(user.role)}
    </p>

    <p>
      <span class="highlight">
        User ID:
      </span>
      ${user.userId}
    </p>

    <p>
      <span class="highlight">
        PIN:
      </span>
      ${user.pin}
    </p>

    <hr style="
      border:none;
      border-top:1px solid rgba(255,255,255,.1);
      margin:16px 0;
    ">

    <p style="white-space:pre-line;">
      ${custom}
    </p>

    <div style="
      margin-top:18px;
      color:var(--pink);
      font-weight:bold;
    ">
      TEF • Hope For The Future / By God's Grace
    </div>

  `;

  showMessage(
    "Credential message generated successfully"
  );

};

window.copyMessage = async function(){

  if(!generatedText){

    showMessage(
      "Generate a message first",
      "error"
    );

    return;
  }

  try{

    await navigator.clipboard.writeText(
      generatedText
    );

    showMessage(
      "Message copied successfully"
    );

  }catch(err){

    console.error(err);

    showMessage(
      "Failed to copy message",
      "error"
    );

  }

};

window.printCard = function(){

  if(!generatedText){

    showMessage(
      "Generate a message first",
      "error"
    );

    return;
  }

  const content =
    document.getElementById("preview").innerHTML;

  const win = window.open(
    "",
    "",
    "width=900,height=700"
  );

  win.document.write(`

    <html>
    <head>

      <title>
        TEF Credential Print
      </title>

      <style>

        body{
          font-family:sans-serif;
          padding:40px;
          line-height:1.8;
          color:#222;
        }

        h3{
          color:#800000;
        }

        .highlight{
          color:#800000;
          font-weight:bold;
        }

      </style>

    </head>

    <body>

      ${content}

    </body>
    </html>

  `);

  win.document.close();

  win.focus();

  win.print();

};

loadUsers();

</script>

</body>
  </html>
