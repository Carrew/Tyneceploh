<!DOCTYPE html>      <html>        <head>        
  <title>Teacher Management - TEF</title>        <style>        
    :root {        
      --maroon: #800000;        
      --pink: #ffc0cb;        
      --bg: #0b0b0f;        
      --card: rgba(255,255,255,0.06);        
      --text: #fff;        
    }        body {        
  font-family: system-ui;        
  background: radial-gradient(circle at top, #1a0010, var(--bg));        
  color: white;        
  margin: 0;        
  padding: 20px;        
}        
    
h2 {        
  text-align: center;        
  color: var(--pink);        
}        
    
.stats {        
  display: grid;        
  grid-template-columns: repeat(3, 1fr);        
  gap: 10px;        
  margin: 10px 0;        
}        
    
.stat {        
  background: var(--card);        
  padding: 10px;        
  border-radius: 10px;        
  text-align: center;        
}        
    
input, select {        
  width: 100%;        
  padding: 10px;        
  margin: 6px 0;        
  border-radius: 8px;        
  border: none;        
  background: rgba(255,255,255,0.08);        
  color: white;        
}        
    
button {        
  padding: 10px;        
  margin: 5px 0;        
  border: none;        
  border-radius: 8px;        
  background: linear-gradient(135deg, var(--maroon), var(--pink));        
  color: white;        
  cursor: pointer;        
}        
    
.card {        
  background: var(--card);        
  padding: 12px;        
  margin: 10px 0;        
  border-radius: 12px;        
  border-left: 4px solid var(--pink);        
}        
    
.small {        
  font-size: 12px;        
  opacity: 0.8;        
}        
    
img {        
  width: 60px;        
  height: 60px;        
  border-radius: 50%;        
  object-fit: cover;        
  margin-top: 5px;        
}

</style>      </head>      <body>      <h2>👨‍🏫 Teacher Management System</h2>      <div class="stats">

  <div class="stat">Total <div id="total">0</div></div>        
  <div class="stat">Active <div id="active">0</div></div>        
  <div class="stat">Inactive <div id="inactive">0</div></div>        
</div>      <input id="search" placeholder="Search teacher..." oninput="renderTeachers()">      <hr>      <!-- FORM -->      <input id="name" placeholder="Teacher Name">        
<input id="classes" placeholder="Classes (e.g. JSS1, JSS2)">        
<input id="dob" placeholder="Date of Birth">        
<input id="gender" placeholder="Gender">        
<input id="contact" placeholder="Contact">        
<input id="nationality" placeholder="Nationality">        
<input id="address" placeholder="Address">      <select id="status">        
  <option value="active">Active</option>        
  <option value="inactive">Inactive</option>        
</select>      <input type="file" id="photo">      <input type="hidden" id="editId">      <button onclick="saveTeacher()">Save Teacher</button>  <hr>      <div id="list"></div>      <script type="module">        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
authDomain: "tyneceploh.firebaseapp.com",
projectId: "tyneceploh",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// safer ID
function generateTeacherId(count) {
return TCH${Date.now().toString().slice(-4)}${count};
}

function generatePin() {
return Math.floor(1000 + Math.random() * 9000).toString();
}

let teachersCache = [];

async function loadTeachers() {
const snap = await getDocs(collection(db, "users"));
teachersCache = [];

snap.forEach(d => {
const data = d.data();
if (data.role === "teacher") {
teachersCache.push({ ...data, docId: d.id });
}
});

updateStats();
renderTeachers();
}

function updateStats() {
document.getElementById("total").innerText = teachersCache.length;
document.getElementById("active").innerText =
teachersCache.filter(t => t.status === "active").length;
document.getElementById("inactive").innerText =
teachersCache.filter(t => t.status === "inactive").length;
}

// CLOUDINARY
async function uploadImage(file) {
if (!file) return "";

const formData = new FormData();
formData.append("file", file);
formData.append("upload_preset", "Tyneceploh");

const res = await fetch("https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload", {
method: "POST",
body: formData
});

const data = await res.json();
return data.secure_url || "";
}

window.renderTeachers = function () {
const search = document.getElementById("search").value.toLowerCase();

const filtered = teachersCache.filter(t =>
(t.name || "").toLowerCase().includes(search) ||
(t.userId || "").toLowerCase().includes(search)
);

document.getElementById("list").innerHTML = filtered.map(t => `
<div class="card">
<b>🆔 ${t.userId}</b> | ${t.name}

<div class="small">        
    Classes: ${(t.classes || []).join(", ")} <br>        
    Status: ${t.status} <br>        
    DOB: ${t.dob || "-"} <br>        
    Contact: ${t.contact || "-"} <br>        
    Nationality: ${t.nationality || "-"} <br>        
    Address: ${t.address || "-"}        
    Pin: ${t.pin}<br>        
  </div>        
    
  ${t.photoURL ? `<img src="${t.photoURL}">` : ""}        
    
  <button onclick="editTeacher('${t.docId}')">Edit</button>        
  <button onclick="deleteTeacher('${t.docId}')">Delete</button>        
</div>

`).join("");
};

window.saveTeacher = async function () {
const editId = document.getElementById("editId").value;

const file = document.getElementById("photo").files[0];
const photoURL = await uploadImage(file);

const data = {
name: document.getElementById("name").value,
classes: document.getElementById("classes").value.split(",").map(c => c.trim()),
dob: document.getElementById("dob").value,
gender: document.getElementById("gender").value,
contact: document.getElementById("contact").value,
nationality: document.getElementById("nationality").value,
address: document.getElementById("address").value,
status: document.getElementById("status").value,
role: "teacher",
createdAt: Date.now()
};

if (photoURL) data.photoURL = photoURL;

if (!editId) {
const snap = await getDocs(collection(db, "users"));
const userId = generateTeacherId(snap.docs.length);
const pin = generatePin();

data.userId = userId;        
data.pin = pin;        
    
await addDoc(collection(db, "users"), data);        
    
alert(`Teacher Created\nID: ${userId}\nPIN: ${pin}`);

} else {
await updateDoc(doc(db, "users", editId), data);
document.getElementById("editId").value = "";
}

loadTeachers();
};

window.editTeacher = function (id) {
const t = teachersCache.find(x => x.docId === id);
if (!t) return;

document.getElementById("editId").value = id;
document.getElementById("name").value = t.name || "";
document.getElementById("classes").value = (t.classes || []).join(", ");
document.getElementById("dob").value = t.dob || "";
document.getElementById("gender").value = t.gender || "";
document.getElementById("contact").value = t.contact || "";
document.getElementById("nationality").value = t.nationality || "";
document.getElementById("address").value = t.address || "";
document.getElementById("status").value = t.status || "active";
};

window.deleteTeacher = async function (id) {
if (confirm("Delete teacher?")) {
await deleteDoc(doc(db, "users", id));
loadTeachers();
}
};

loadTeachers();

</script>     
</body>
</html>
