<!DOCTYPE html>
<html>
<head>
  <title>My Financial Record - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      margin-bottom:15px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    .hero{
      background:linear-gradient(135deg,#800000,#ff4d6d);
      color:white;
    }

    h2,h3{
      margin-top:0;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .box{
      padding:15px;
      background:#fafafa;
      border-radius:10px;
    }

    .good{ color:#27ae60; font-weight:bold; }
    .bad{ color:#c0392b; font-weight:bold; }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th,td{
      padding:10px;
      border-bottom:1px solid #ddd;
      text-align:left;
      font-size:14px;
    }

    .tag{
      display:inline-block;
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
      color:white;
    }

    .paid{ background:#27ae60; }
    .partial{ background:#f39c12; }
    .owing{ background:#c0392b; }

  </style>
</head>

<body>

<div class="container">

  <div class="card hero">

    <h2>My Financial Dashboard</h2>
    <p>Transparent view of your school payments</p>

  </div>

  <div class="card">

    <h3>Summary</h3>

    <div class="grid">

      <div class="box">
        <p>Total Fee</p>
        <h2 id="totalFee">$0</h2>
      </div>

      <div class="box">
        <p>Total Paid</p>
        <h2 id="totalPaid">$0</h2>
      </div>

      <div class="box">
        <p>Balance</p>
        <h2 id="balance">$0</h2>
      </div>

      <div class="box">
        <p>Status</p>
        <h2 id="status">Loading...</h2>
      </div>

    </div>

  </div>

  <div class="card">

    <h3>Payment History</h3>

    <div id="history">
      Loading...
    </div>

  </div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

// USER SESSION
const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  location.href = "login.html";
}

// ---------------------
// LOAD FINANCIAL DATA
// ---------------------
async function load(){

  const finRef = doc(db,"financials",user.userId);
  const feeSnap = await getDoc(doc(db,"classFees",user.class));

  const finSnap = await getDoc(finRef);

  let totalFee = feeSnap.exists()
    ? feeSnap.data().fee
    : 0;

  let data = finSnap.exists()
    ? finSnap.data()
    : {
        totalPaid:0,
        history:[]
      };

  let totalPaid = data.totalPaid || 0;
  let balance = totalFee - totalPaid;

  // UI
  totalFeeEl().textContent = "$" + totalFee;
  totalPaidEl().textContent = "$" + totalPaid;
  balanceEl().textContent = "$" + balance;

  if(balance <= 0){
    statusEl().textContent = "PAID";
    statusEl().className = "good";
  } else if(totalPaid > 0){
    statusEl().textContent = "PARTIAL";
    statusEl().className = "bad";
  } else {
    statusEl().textContent = "OWING";
    statusEl().className = "bad";
  }

  // HISTORY
  renderHistory(data.history || []);

}

// ---------------------
// HISTORY UI
// ---------------------
function renderHistory(history){

  const box = document.getElementById("history");

  if(history.length === 0){
    box.innerHTML = "<p>No payments recorded yet.</p>";
    return;
  }

  box.innerHTML = `
    <table>
      <tr>
        <th>Amount</th>
        <th>Date</th>
      </tr>
      ${history.map(h=>`
        <tr>
          <td>$${h.amount}</td>
          <td>${new Date(h.time).toLocaleDateString()}</td>
        </tr>
      `).join("")}
    </table>
  `;
}

// helpers
function totalFeeEl(){ return document.getElementById("totalFee"); }
function totalPaidEl(){ return document.getElementById("totalPaid"); }
function balanceEl(){ return document.getElementById("balance"); }
function statusEl(){ return document.getElementById("status"); }

load();

</script>

</body>
</html>
