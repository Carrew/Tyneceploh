<!DOCTYPE html>
<html>
<head>
  <title>Honor Board - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    h2{
      text-align:center;
      margin-bottom:10px;
    }

    .controls{
      max-width:700px;
      margin:auto;
      background:white;
      padding:15px;
      border-radius:10px;
      margin-bottom:20px;
    }

    select,button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button{
      background:#2980b9;
      color:white;
      border:none;
      font-weight:bold;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
      max-width:900px;
      margin:auto;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:12px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }

    .title{
      font-weight:bold;
      text-align:center;
      padding:8px;
      border-radius:6px;
      color:white;
      margin-bottom:10px;
    }

    .proprietor{ background:#27ae60; }
    .principal{ background:#3498db; }
    .honor{ background:#f39c12; }

    .student{
      padding:8px;
      border-bottom:1px solid #eee;
      font-size:14px;
    }

    .empty{
      text-align:center;
      color:#888;
      font-size:13px;
      padding:10px;
    }

  </style>
</head>

<body>

<h2>Honor Board</h2>

<div class="controls">

  <label>Class</label>
  <select id="classBox"></select>

  <label>Mode</label>
  <select id="modeBox">
    <option value="period">Period Honors</option>
    <option value="semester">Semester Honors</option>
    <option value="yearly">Yearly Honors</option>
  </select>

  <button onclick="loadBoard()">Load Honor Board</button>

</div>

<div class="grid">

  <div class="card">
    <div class="title proprietor">Proprietor (90–100)</div>
    <div id="proprietor"></div>
  </div>

  <div class="card">
    <div class="title principal">Principal (85–89.9)</div>
    <div id="principal"></div>
  </div>

  <div class="card">
    <div class="title honor">Honor Roll (80–84.9)</div>
    <div id="honor"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  getDocs,
  collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

// --------------------
// LOAD CLASSES
// --------------------
async function loadClasses(){

  const snap = await getDocs(collection(db,"users"));

  const set = new Set();

  snap.forEach(d=>{
    const u = d.data();
    if(u.role === "student" && u.class){
      set.add(u.class);
    }
  });

  classBox.innerHTML = [...set].map(c=>`<option>${c}</option>`).join("");

}

loadClasses();

// --------------------
// LOAD BOARD
// --------------------
window.loadBoard = async function(){

  const cls = classBox.value;
  const mode = modeBox.value;

  proprietor.innerHTML = "";
  principal.innerHTML = "";
  honor.innerHTML = "";

  const snap = await getDocs(collection(db,"honorResults"));

  let found = null;

  snap.forEach(d=>{
    if(d.id === cls + "_" + mode){
      found = d.data();
    }
  });

  if(!found){
    return showEmpty();
  }

  const list = found.results || [];

  if(list.length === 0){
    return showEmpty();
  }

  list.forEach(s=>{

    const row = `
      <div class="student">
        ${s.name}
        <b>(${s.average.toFixed(1)})</b>
      </div>
    `;

    if(s.category === "proprietor"){
      proprietor.innerHTML += row;
    }
    else if(s.category === "principal"){
      principal.innerHTML += row;
    }
    else if(s.category === "honor"){
      honor.innerHTML += row;
    }

  });

  if(proprietor.innerHTML === "") proprietor.innerHTML = `<div class="empty">No students</div>`;
  if(principal.innerHTML === "") principal.innerHTML = `<div class="empty">No students</div>`;
  if(honor.innerHTML === "") honor.innerHTML = `<div class="empty">No students</div>`;

};

// --------------------
// EMPTY STATE
// --------------------
function showEmpty(){

  proprietor.innerHTML =
  principal.innerHTML =
  honor.innerHTML =
    `<div class="empty">No honor data generated for this selection</div>`;

}

</script>

</body>
</html>
