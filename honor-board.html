<!DOCTYPE html>
<html>
<head>
  <title>Class Bulletin - TEF</title>

  <style>
    body{
      font-family:system-ui;
      background:radial-gradient(circle at top,#1a0010,#0b0b0f);
      color:white;
      padding:20px;
    }

    h2{
      text-align:center;
      color:#ffc0cb;
      margin-bottom:15px;
    }

    select, button{
      padding:10px;
      border-radius:8px;
      border:none;
      margin:5px;
    }

    button{
      background:#800000;
      color:white;
      cursor:pointer;
    }

    .tabs{
      display:flex;
      justify-content:center;
      gap:10px;
      margin:10px 0 20px;
    }

    .tab{
      padding:10px 14px;
      border-radius:20px;
      background:rgba(255,255,255,0.08);
      cursor:pointer;
      font-size:13px;
    }

    .active{
      background:#ffc0cb;
      color:#000;
      font-weight:bold;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:12px;
    }

    .card{
      background:rgba(255,255,255,0.05);
      padding:14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.08);
    }

    .top{
      display:flex;
      gap:10px;
      align-items:center;
    }

    img{
      width:55px;
      height:55px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid #ffc0cb;
    }

    .name{
      font-weight:bold;
    }

    .rank{
      font-size:13px;
      opacity:0.8;
    }

    .badge{
      display:inline-block;
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      margin-top:8px;
    }

    .proprietor{
      background:#27ae60;
    }

    .principal{
      background:#2ecc71;
    }

    .honor{
      background:#3498db;
    }

    .none{
      background:#555;
    }

    .score{
      margin-top:6px;
      font-size:13px;
    }

    .pass{ color:#4da6ff; }
    .fail{ color:#ff4d4d; }
  </style>
</head>

<body>

<h2>🏆 Class Performance Bulletin</h2>

<select id="classSelect"></select>
<select id="periodSelect">
  <option>1st Period</option>
  <option>2nd Period</option>
  <option>3rd Period</option>
  <option>Semester Exam</option>
  <option>4th Period</option>
  <option>5th Period</option>
  <option>6th Period</option>
  <option>Final Exam</option>
</select>

<button onclick="generate()">Generate</button>

<div class="tabs">
  <div class="tab active" onclick="switchView('honor')">Honor Board</div>
  <div class="tab" onclick="switchView('ranking')">Full Ranking</div>
</div>

<div class="grid" id="board"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

let users = [];
let results = [];
let dataset = [];
let currentView = "honor";

async function loadData(){
  const u = await getDocs(collection(db,"users"));
  const r = await getDocs(collection(db,"results"));

  users = u.docs.map(d=>d.data());
  results = r.docs.map(d=>d.data());

  const classes = [...new Set(users.map(u=>u.class).filter(Boolean))];

  document.getElementById("classSelect").innerHTML =
    classes.map(c=>`<option>${c}</option>`).join("");
}

function getUser(id){
  return users.find(u=>u.userId === id);
}

// HONOR CLASSIFICATION (NEW SYSTEM)
function getHonorType(avg, scores){

  const eligible = scores.every(s => Number(s) >= 70);

  if(!eligible) return null;

  if(avg >= 90) return "proprietor";
  if(avg >= 85) return "principal";
  if(avg >= 80) return "honor";

  return null;
}

function avg(arr){
  return arr.reduce((a,b)=>a+b,0)/arr.length;
}

window.generate = function(){

  const className = document.getElementById("classSelect").value;
  const period = document.getElementById("periodSelect").value;

  const filtered = results.filter(r =>
    r.class === className &&
    r.period === period
  );

  const map = {};

  filtered.forEach(r=>{
    if(!map[r.studentId]){
      map[r.studentId] = {
        studentId:r.studentId,
        name:r.studentName,
        scores:[]
      };
    }

    map[r.studentId].scores.push(Number(r.score));
  });

  dataset = Object.values(map).map(s=>{
    const average = avg(s.scores);
    const honorType = getHonorType(average, s.scores);

    return {
      ...s,
      average,
      honorType
    };
  });

  dataset.sort((a,b)=>b.average-a.average);
  dataset.forEach((s,i)=>s.rank=i+1);

  render();
};

function render(){

  let list = dataset;

  if(currentView === "honor"){
    list = dataset.filter(s=>s.honorType !== null);
  }

  document.getElementById("board").innerHTML =
    list.map(s=>{

      const user = getUser(s.studentId);

      let badgeText = "NO HONOR";
      let badgeClass = "none";

      if(s.honorType === "proprietor"){
        badgeText = "PROPRIETOR LIST";
        badgeClass = "proprietor";
      }
      else if(s.honorType === "principal"){
        badgeText = "PRINCIPAL LIST";
        badgeClass = "principal";
      }
      else if(s.honorType === "honor"){
        badgeText = "HONOR ROLL";
        badgeClass = "honor";
      }

      return `
        <div class="card">

          <div class="top">
            <img src="${user?.photoURL || 'https://via.placeholder.com/50'}">
            <div>
              <div class="name">${s.name}</div>
              <div class="rank">Rank #${s.rank}</div>
            </div>
          </div>

          <div class="badge ${badgeClass}">
            ${badgeText}
          </div>

          <div class="score">
            Avg:
            <span class="${s.average>=70?'pass':'fail'}">
              ${s.average.toFixed(1)}
            </span>
          </div>

        </div>
      `;
    }).join("");
}

window.switchView = function(type){
  currentView = type;

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  event.target.classList.add("active");

  render();
};

loadData();

</script>

</body>
</html>
