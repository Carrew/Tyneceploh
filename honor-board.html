<!DOCTYPE html>
<html>
<head>
  <title>Honor Board</title>

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    select,button{
      padding:10px;
      margin:5px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
      margin-top:20px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
    }

    .title{
      font-weight:bold;
      text-align:center;
      margin-bottom:10px;
    }

    .student{
      padding:6px;
      border-bottom:1px solid #eee;
    }

  </style>
</head>

<body>

<h2>Honor Board</h2>

<select id="class"></select>
<select id="period">
  <option value="1">1st Semester</option>
  <option value="2">2nd Semester</option>
</select>

<button onclick="load()">Load</button>

<div class="grid">

  <div class="card">
    <div class="title">Proprietor</div>
    <div id="p"></div>
  </div>

  <div class="card">
    <div class="title">Principal</div>
    <div id="pr"></div>
  </div>

  <div class="card">
    <div class="title">Honor</div>
    <div id="h"></div>
  </div>

  <div class="card">
    <div class="title">Disqualified</div>
    <div id="d"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const classes = ["JSS1","JSS2","SS1","SS2"];

const sel = document.getElementById("class");

classes.forEach(c=>{
  const o = document.createElement("option");
  o.value = c;
  o.textContent = c;
  sel.appendChild(o);
});

window.load = async function(){

  const cls = document.getElementById("class").value;
  const per = document.getElementById("period").value;

  const snap = await getDoc(doc(db,"honorResults",cls+"_"+per));

  p.innerHTML = pr.innerHTML = h.innerHTML = d.innerHTML = "";

  if(!snap.exists()){
    return; // stays empty intentionally
  }

  const data = snap.data().results;

  data.forEach(s=>{

    const el = `<div class="student">${s.name} - ${s.average.toFixed(1)}</div>`;

    if(s.category === "proprietor") p.innerHTML += el;
    else if(s.category === "principal") pr.innerHTML += el;
    else if(s.category === "honor") h.innerHTML += el;
    else d.innerHTML += el;

  });

};

</script>

</body>
</html>
