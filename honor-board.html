<!DOCTYPE html>
<html>
<head>
  <title>Honor Board - TEF</title>

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    select,button{
      padding:10px;
      margin:5px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:15px;
      margin-top:20px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
    }

    .title{
      font-weight:bold;
      margin-bottom:10px;
      text-align:center;
    }

    .student{
      border-bottom:1px solid #eee;
      padding:6px;
      font-size:14px;
    }

  </style>
</head>

<body>

<h2>Honor Board</h2>

<select id="classBox"></select>
<select id="periodBox"></select>

<button onclick="load()">Load Board</button>

<div class="grid">

  <div class="card">
    <div class="title">Proprietor</div>
    <div id="p"></div>
  </div>

  <div class="card">
    <div class="title">Principal</div>
    <div id="pr"></div>
  </div>

  <div class="card">
    <div class="title">Honor</div>
    <div id="h"></div>
  </div>

  <div class="card">
    <div class="title">Fail</div>
    <div id="f"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDocs, collection, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

// dropdowns from saved data
async function loadOptions(){

  const snap = await getDocs(collection(db,"honorResults"));

  const opts = [];

  snap.forEach(d=>{
    opts.push(d.id);
  });

  classBox.innerHTML = opts.map(o=>{
    const c = o.split("_")[0];
    return `<option>${c}</option>`;
  }).join("");

  periodBox.innerHTML = [1,2,3].map(p=>`<option>${p}</option>`).join("");

}

loadOptions();

window.load = async function(){

  const cls = classBox.value;
  const per = periodBox.value;

  const snap = await getDoc(doc(db,"honorResults",cls+"_"+per));

  p.innerHTML = pr.innerHTML = h.innerHTML = f.innerHTML = "";

  if(!snap.exists()){
    alert("No data yet. Generate first.");
    return;
  }

  const data = snap.data().results;

  data.forEach(s=>{

    const el = `<div class="student">${s.name} - ${s.average.toFixed(1)}</div>`;

    if(s.category==="proprietor") p.innerHTML+=el;
    else if(s.category==="principal") pr.innerHTML+=el;
    else if(s.category==="honor") h.innerHTML+=el;
    else f.innerHTML+=el;

  });

};

</script>

</body>
</html>
