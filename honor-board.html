<!DOCTYPE html>
<html>
<head>
  <title>Honor Board - TEF</title>

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    select,button{
      padding:10px;
      margin:5px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      max-width:500px;
      margin:auto;
    }

    .student{
      padding:8px;
      border-bottom:1px solid #eee;
    }

    .title{
      font-weight:bold;
      text-align:center;
      margin-bottom:10px;
    }

  </style>
</head>

<body>

<h2 style="text-align:center;">Honor Board</h2>

<select id="classBox"></select>
<select id="periodBox"></select>

<button onclick="load()">Load Honor List</button>

<div class="card">
  <div class="title">Honor Students</div>
  <div id="list"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDocs, doc, getDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

// load available generated sets
async function loadOptions(){

  const snap = await getDocs(collection(db,"honorResults"));

  const opts = [];

  snap.forEach(d=>{
    opts.push(d.id);
  });

  classBox.innerHTML = [...new Set(opts.map(o=>o.split("_")[0]))]
    .map(c=>`<option>${c}</option>`).join("");

  periodBox.innerHTML = [...new Set(opts.map(o=>o.split("_")[1]))]
    .map(p=>`<option>${p}</option>`).join("");

}

loadOptions();

window.load = async function(){

  const cls = classBox.value;
  const per = periodBox.value;

  const snap = await getDoc(doc(db,"honorResults",cls+"_"+per));

  list.innerHTML = "";

  if(!snap.exists()){
    list.innerHTML = "<p>No honor data found.</p>";
    return;
  }

  const data = snap.data().results;

  if(!data || data.length === 0){
    list.innerHTML = "<p>No honor students yet.</p>";
    return;
  }

  data.forEach(s=>{
    list.innerHTML += `
      <div class="student">
        ${s.name} — <b>${s.average.toFixed(1)}</b>
      </div>
    `;
  });

};

</script>

</body>
</html>
