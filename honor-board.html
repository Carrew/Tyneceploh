<!DOCTYPE html>
<html>
<head>
  <title>Honor Board</title>

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    select,button{
      padding:10px;
      margin:5px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
      margin-top:20px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
    }

    .student{
      border-bottom:1px solid #eee;
      padding:6px;
      font-size:14px;
    }

    .title{
      font-weight:bold;
      text-align:center;
      margin-bottom:10px;
    }

    .empty{
      text-align:center;
      margin-top:30px;
      color:#666;
    }
  </style>
</head>

<body>

<h2>Honor Board</h2>

<select id="classBox"></select>
<select id="periodBox"></select>

<button onclick="load()">Load</button>

<div id="empty" class="empty"></div>

<div class="grid">
  <div class="card">
    <div class="title">Proprietor</div>
    <div id="p"></div>
  </div>

  <div class="card">
    <div class="title">Principal</div>
    <div id="pr"></div>
  </div>

  <div class="card">
    <div class="title">Honor Roll</div>
    <div id="h"></div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDocs, collection, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

// load only generated datasets
async function loadOptions(){

  const snap = await getDocs(collection(db,"honorResults"));

  const list = [];

  snap.forEach(d=>{
    list.push(d.id);
  });

  if(list.length === 0){
    empty.innerText = "No honor data available yet.";
    return;
  }

  classBox.innerHTML = [...new Set(list.map(x=>x.split("_")[0]))]
    .map(c=>`<option>${c}</option>`).join("");

  periodBox.innerHTML = [1,2,3]
    .map(p=>`<option>${p}</option>`).join("");

}

loadOptions();

window.load = async function(){

  const cls = classBox.value;
  const per = periodBox.value;

  const snap = await getDoc(doc(db,"honorResults",cls+"_"+per));

  p.innerHTML = pr.innerHTML = h.innerHTML = "";
  empty.innerText = "";

  if(!snap.exists()){
    empty.innerText = "No generated honor list for this selection.";
    return;
  }

  const data = snap.data().results;

  data.forEach(s=>{

    const el = `<div class="student">${s.name} - ${s.average.toFixed(1)}</div>`;

    if(s.category==="proprietor") p.innerHTML+=el;
    else if(s.category==="principal") pr.innerHTML+=el;
    else if(s.category==="honor") h.innerHTML+=el;

  });

};

</script>

</body>
</html>
