<!DOCTYPE html>
<html>
<head>
  <title>Honor Board - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    h2{
      text-align:center;
    }

    .controls{
      max-width:700px;
      margin:auto;
      background:white;
      padding:15px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    select,button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button{
      background:#3498db;
      color:white;
      border:none;
      font-weight:bold;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
      margin-top:20px;
    }

    .card{
      background:white;
      border-radius:12px;
      padding:15px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }

    .title{
      text-align:center;
      font-weight:bold;
      margin-bottom:10px;
      padding:8px;
      border-radius:6px;
      color:white;
    }

    .proprietor{ background:#2ecc71; }
    .principal{ background:#3498db; }
    .honor{ background:#f39c12; }

    .row{
      padding:8px;
      border-bottom:1px solid #eee;
      font-size:14px;
    }

    .empty{
      text-align:center;
      color:#888;
      font-size:13px;
      padding:10px;
    }

  </style>
</head>

<body>

<h2>Honor Board</h2>

<div class="controls">

  <label>Class</label>
  <select id="classBox"></select>

  <label>Mode</label>
  <select id="modeBox">
    <option value="period">Period Honors</option>
    <option value="semester">Semester Honors</option>
    <option value="yearly">Yearly Honors</option>
  </select>

  <label>Period / Dataset</label>
  <select id="keyBox"></select>

  <button onclick="loadBoard()">Load Honor Board</button>

</div>

<div class="grid">

  <div class="card">
    <div class="title proprietor">Proprietor (90–100)</div>
    <div id="proprietor"></div>
  </div>

  <div class="card">
    <div class="title principal">Principal (85–89.9)</div>
    <div id="principal"></div>
  </div>

  <div class="card">
    <div class="title honor">Honor Roll (80–84.9)</div>
    <div id="honor"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  getDocs,
  doc,
  getDoc,
  collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

// --------------------
// LOAD AVAILABLE DATASETS
// --------------------
async function loadOptions(){

  const snap = await getDocs(collection(db,"honorResults"));

  const classes = new Set();
  const keys = [];

  snap.forEach(d=>{
    const id = d.id;

    const parts = id.split("_");

    if(parts[0]) classes.add(parts[0]);

    keys.push(id);
  });

  classBox.innerHTML = [...classes].map(c=>`<option>${c}</option>`).join("");
  keyBox.innerHTML = keys.map(k=>`<option value="${k}">${k}</option>`).join("");

}

loadOptions();

// --------------------
// LOAD BOARD
// --------------------
window.loadBoard = async function(){

  const key = keyBox.value;
  const mode = modeBox.value;

  const snap = await getDoc(doc(db,"honorResults",key));

  // reset UI
  proprietor.innerHTML = "";
  principal.innerHTML = "";
  honor.innerHTML = "";

  if(!snap.exists()){
    showEmpty();
    return;
  }

  const data = snap.data().results;

  if(!data || data.length === 0){
    showEmpty();
    return;
  }

  let p=0, pr=0, h=0;

  data.forEach(s=>{

    const row = `
      <div class="row">
        ${s.name} — <b>${s.average.toFixed(1)}</b>
      </div>
    `;

    if(s.category === "Proprietor"){
      proprietor.innerHTML += row;
      p++;
    }
    else if(s.category === "Principal"){
      principal.innerHTML += row;
      pr++;
    }
    else if(s.category === "Honor"){
      honor.innerHTML += row;
      h++;
    }

  });

  if(p===0) proprietor.innerHTML = `<div class="empty">No Proprietor students</div>`;
  if(pr===0) principal.innerHTML = `<div class="empty">No Principal students</div>`;
  if(h===0) honor.innerHTML = `<div class="empty">No Honor students</div>`;

};

function showEmpty(){
  proprietor.innerHTML =
  principal.innerHTML =
  honor.innerHTML =
    `<div class="empty">No honor data found</div>`;
}

</script>

</body>
</html>
