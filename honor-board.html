<!DOCTYPE html>
<html>
<head>
  <title>TEF Honor Board</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <style>

    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:1000px;
      margin:auto;
    }

    .top{
      background:white;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    select{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    .student{
      background:white;
      padding:15px;
      margin-bottom:12px;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
      border-left:6px solid #27ae60;
    }

    .badge{
      display:inline-block;
      padding:5px 12px;
      border-radius:20px;
      color:white;
      font-size:12px;
      font-weight:bold;
      margin-top:8px;
    }

    .proprietor{
      background:#8e44ad;
    }

    .principal{
      background:#2980b9;
    }

    .honor{
      background:#27ae60;
    }

  </style>
</head>

<body>

<div class="box">

  <div class="top">

    <h2>TEF Honor Board</h2>

    <label>Available Honor Lists</label>

    <select id="datasetBox"
            onchange="loadBoard()">
    </select>

  </div>

  <div id="board"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

let datasets = [];

// ----------------------------------
// LOAD AVAILABLE LISTS
// ----------------------------------
async function loadDatasets(){

  const snap =
    await getDocs(collection(db,"honorResults"));

  datasets = [];

  snap.forEach(d=>{

    datasets.push({
      id:d.id,
      ...d.data()
    });

  });

  if(datasets.length === 0){

    datasetBox.innerHTML =
      `<option>No Honor Lists Yet</option>`;

    return;
  }

  datasetBox.innerHTML =
    datasets.map(d=>`

      <option value="${d.id}">
        ${d.class}
        →
        ${d.datasetName}
      </option>

    `).join("");

  loadBoard();

}

loadDatasets();

// ----------------------------------
// LOAD BOARD
// ----------------------------------
window.loadBoard = function(){

  const id = datasetBox.value;

  const data =
    datasets.find(d=>d.id === id);

  if(!data) return;

  const board =
    document.getElementById("board");

  if(
    !data.students
    ||
    data.students.length === 0
  ){

    board.innerHTML =
      "<p>No students found</p>";

    return;
  }

  board.innerHTML = `

    <div style="
      background:white;
      padding:15px;
      border-radius:10px;
      margin-bottom:20px;
    ">

      <h3>
        ${data.class}
        •
        ${data.datasetName}
      </h3>

      Generated:
      ${
        new Date(
          data.generatedAt
        ).toLocaleString()
      }

    </div>

    ${data.students.map(s=>`

      <div class="student">

        <h3>
          ${s.studentName}
        </h3>

        Student ID:
        ${s.studentId}
        <br><br>

        Average:
        <b>${s.average}%</b>

        <br>

        <span class="
          badge
          ${
            s.category === "Proprietor"
            ? "proprietor"
            :
            s.category === "Principal"
            ? "principal"
            :
            "honor"
          }
        ">

          ${s.category} List

        </span>

      </div>

    `).join("")}

  `;

};

</script>

</body>
</html>
