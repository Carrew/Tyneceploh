<!DOCTYPE html>
<html>
<head>
  <title>Honor Board - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .wrap{
      max-width:800px;
      margin:auto;
    }

    select,button{
      padding:10px;
      margin:5px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:15px;
      margin-top:20px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
    }

    .title{
      font-weight:bold;
      text-align:center;
      margin-bottom:10px;
    }

    .student{
      padding:6px;
      border-bottom:1px solid #eee;
      font-size:14px;
    }

    .msg{
      text-align:center;
      margin-top:20px;
      color:#666;
    }

  </style>
</head>

<body>

<div class="wrap">

  <h2>Honor Board</h2>

  <select id="listBox"></select>

  <button onclick="loadBoard()">Load</button>

  <div id="msg" class="msg">Loading generated lists...</div>

  <div class="grid">

    <div class="card">
      <div class="title">Proprietor</div>
      <div id="p"></div>
    </div>

    <div class="card">
      <div class="title">Principal</div>
      <div id="pr"></div>
    </div>

    <div class="card">
      <div class="title">Honor</div>
      <div id="h"></div>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  getDocs,
  collection,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

let availableLists = [];

// 🔥 ONLY LOAD EXISTING GENERATED HONOR LISTS
async function loadLists(){

  const snap = await getDocs(collection(db,"honorResults"));

  availableLists = [];

  snap.forEach(d=>{
    availableLists.push(d.id);
  });

  if(availableLists.length === 0){
    msg.innerText = "No honor lists generated yet.";
    return;
  }

  listBox.innerHTML = availableLists
    .map(id=>`<option value="${id}">${id}</option>`)
    .join("");

  msg.innerText = "Select a generated list";

}

loadLists();

window.loadBoard = async function(){

  const id = listBox.value;

  if(!id){
    msg.innerText = "No list selected";
    return;
  }

  const snap = await getDoc(doc(db,"honorResults",id));

  if(!snap.exists()){
    msg.innerText = "This list no longer exists";
    return;
  }

  const data = snap.data().results;

  p.innerHTML = "";
  pr.innerHTML = "";
  h.innerHTML = "";

  data.forEach(s=>{

    const el = `<div class="student">${s.name} - ${s.average.toFixed(1)}</div>`;

    if(s.category === "proprietor") p.innerHTML += el;
    if(s.category === "principal") pr.innerHTML += el;
    if(s.category === "honor") h.innerHTML += el;

  });

  msg.innerText = `Loaded: ${id}`;

};

</script>

</body>
</html>
