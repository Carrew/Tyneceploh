<!DOCTYPE html>
<html>
<head>
  <title>Honor Board - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    select,button{
      padding:10px;
      margin:5px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
      margin-top:20px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:12px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }

    .title{
      text-align:center;
      font-weight:bold;
      margin-bottom:10px;
      padding:8px;
      border-radius:6px;
      color:white;
    }

    .proprietor{ background:#2ecc71; }
    .principal{ background:#3498db; }
    .honor{ background:#f39c12; }

    .student{
      padding:8px;
      border-bottom:1px solid #eee;
      font-size:14px;
    }

    .empty{
      text-align:center;
      color:#888;
      font-size:13px;
      padding:10px;
    }

  </style>
</head>

<body>

<h2>Honor Board</h2>

<select id="classBox"></select>
<select id="periodBox"></select>

<button onclick="loadBoard()">Load Honor Board</button>

<div class="grid">

  <div class="card">
    <div class="title proprietor">Proprietor (90–100)</div>
    <div id="proprietor"></div>
  </div>

  <div class="card">
    <div class="title principal">Principal (85–89.9)</div>
    <div id="principal"></div>
  </div>

  <div class="card">
    <div class="title honor">Honor Roll (80–84.9)</div>
    <div id="honor"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDocs, doc, getDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

// --------------------
// LOAD GENERATED SETS
// --------------------
async function loadOptions(){

  const snap = await getDocs(collection(db,"honorResults"));

  const keys = [];

  snap.forEach(d=>{
    keys.push(d.id);
  });

  const classes = [...new Set(keys.map(k=>k.split("_")[0]))];
  const periods = [...new Set(keys.map(k=>k.split("_")[1]))];

  classBox.innerHTML = classes.map(c=>`<option>${c}</option>`).join("");
  periodBox.innerHTML = periods.map(p=>`<option>${p}</option>`).join("");

}

loadOptions();

// --------------------
// LOAD BOARD
// --------------------
window.loadBoard = async function(){

  const cls = classBox.value;
  const per = periodBox.value;

  const snap = await getDoc(doc(db,"honorResults",cls+"_"+per));

  // reset
  proprietor.innerHTML = "";
  principal.innerHTML = "";
  honor.innerHTML = "";

  if(!snap.exists()){
    proprietor.innerHTML =
    principal.innerHTML =
    honor.innerHTML =
      `<div class="empty">No honor data found</div>`;
    return;
  }

  const data = snap.data().results;

  if(!data || data.length === 0){
    proprietor.innerHTML =
    principal.innerHTML =
    honor.innerHTML =
      `<div class="empty">No students qualify</div>`;
    return;
  }

  let p = 0, pr = 0, h = 0;

  data.forEach(s=>{

    const row = `
      <div class="student">
        ${s.name}
        <b>(${s.average.toFixed(1)})</b>
      </div>
    `;

    if(s.category === "proprietor"){
      proprietor.innerHTML += row;
      p++;
    }
    else if(s.category === "principal"){
      principal.innerHTML += row;
      pr++;
    }
    else if(s.category === "honor"){
      honor.innerHTML += row;
      h++;
    }

  });

  // empty states per box
  if(p === 0) proprietor.innerHTML = `<div class="empty">No Proprietor students</div>`;
  if(pr === 0) principal.innerHTML = `<div class="empty">No Principal students</div>`;
  if(h === 0) honor.innerHTML = `<div class="empty">No Honor students</div>`;

};

</script>

</body>
</html>
