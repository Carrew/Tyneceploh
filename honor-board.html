<!DOCTYPE html>
<html>
<head>
  <title>Honor Board - TEF</title>

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    select,button{
      padding:10px;
      margin:5px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
      margin-top:20px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
    }

    .title{
      text-align:center;
      font-weight:bold;
      margin-bottom:10px;
    }

    .student{
      border-bottom:1px solid #eee;
      padding:6px;
    }

    .empty{
      text-align:center;
      color:#777;
      margin-top:20px;
    }
  </style>
</head>

<body>

<h2>Honor Board</h2>

<select id="datasetBox"></select>
<button onclick="load()">Load Honor List</button>

<div id="empty" class="empty"></div>

<div class="grid">

  <div class="card">
    <div class="title">Proprietor</div>
    <div id="p"></div>
  </div>

  <div class="card">
    <div class="title">Principal</div>
    <div id="pr"></div>
  </div>

  <div class="card">
    <div class="title">Honor</div>
    <div id="h"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDocs, doc, getDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

// 🔥 ONLY LOAD SAVED HONOR DATASETS
async function loadDatasets(){

  const snap = await getDocs(collection(db,"honorResults"));

  datasetBox.innerHTML = "";

  snap.forEach(d=>{
    datasetBox.innerHTML += `<option value="${d.id}">${d.id}</option>`;
  });

  if(snap.empty){
    empty.innerText = "No honor lists generated yet.";
  }

}

loadDatasets();

// 🧠 PURE RENDER ONLY
window.load = async function(){

  const id = datasetBox.value;

  if(!id){
    empty.innerText = "No dataset selected.";
    return;
  }

  const snap = await getDoc(doc(db,"honorResults",id));

  p.innerHTML = pr.innerHTML = h.innerHTML = "";
  empty.innerText = "";

  if(!snap.exists()){
    empty.innerText = "Selected honor list not found.";
    return;
  }

  const data = snap.data().results;

  if(!data || data.length === 0){
    empty.innerText = "This honor list is empty.";
    return;
  }

  data.forEach(s=>{

    const el = `
      <div class="student">
        ${s.name} - ${Number(s.average).toFixed(1)}
      </div>
    `;

    if(s.category === "proprietor") p.innerHTML += el;
    if(s.category === "principal") pr.innerHTML += el;
    if(s.category === "honor") h.innerHTML += el;

  });

};

</script>

</body>
</html>
