<!DOCTYPE html>
<html>
<head>
  <title>Honor Board</title>

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    select,button{
      padding:10px;
      margin:5px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
      margin-top:20px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
    }

    .student{
      border-bottom:1px solid #eee;
      padding:6px;
    }

    .title{
      text-align:center;
      font-weight:bold;
      margin-bottom:10px;
    }
  </style>
</head>

<body>

<h2>Honor Board</h2>

<select id="classBox"></select>
<select id="periodBox"></select>

<button onclick="load()">Load</button>

<div class="grid">

  <div class="card">
    <div class="title">Proprietor</div>
    <div id="p"></div>
  </div>

  <div class="card">
    <div class="title">Principal</div>
    <div id="pr"></div>
  </div>

  <div class="card">
    <div class="title">Honor</div>
    <div id="h"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, getDocs, doc, getDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

async function loadOptions(){

  const snap = await getDocs(collection(db,"honorResults"));

  classBox.innerHTML="";
  periodBox.innerHTML="";

  snap.forEach(d=>{
    const [cls,per] = d.id.split("_");
    classBox.innerHTML += `<option>${cls}</option>`;
    periodBox.innerHTML += `<option>${per}</option>`;
  });

}

loadOptions();

window.load = async function(){

  const cls = classBox.value;
  const per = periodBox.value;

  const snap = await getDoc(doc(db,"honorResults",cls+"_"+per));

  p.innerHTML = pr.innerHTML = h.innerHTML = "";

  if(!snap.exists()){
    alert("No honor data found");
    return;
  }

  const data = snap.data().results;

  data.forEach(s=>{

    const el = `<div class="student">${s.name} - ${s.average.toFixed(1)}</div>`;

    if(s.category==="proprietor") p.innerHTML+=el;
    if(s.category==="principal") pr.innerHTML+=el;
    if(s.category==="honor") h.innerHTML+=el;

  });

};

</script>

</body>
</html>
