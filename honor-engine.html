<!DOCTYPE html>
<html>
<head>
  <title>Honor Engine - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:600px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
    }

    select,button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button{
      background:#27ae60;
      color:white;
      border:none;
      font-weight:bold;
      cursor:pointer;
    }

    .msg{
      margin-top:15px;
      padding:10px;
      border-radius:6px;
      font-size:14px;
    }

    .ok{
      background:#d4edda;
      color:#155724;
    }

    .bad{
      background:#f8d7da;
      color:#721c24;
    }

    .info{
      background:#d1ecf1;
      color:#0c5460;
    }
  </style>
</head>

<body>

<h2 style="text-align:center;">Honor Engine Generator</h2>

<div class="box">

  <label>Class</label>
  <select id="classBox"></select>

  <label>Period</label>
  <select id="periodBox"></select>

  <button onclick="generate()">Generate Honor List</button>

  <div id="msg" class="msg info">Waiting for input...</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));
if(!user || user.role !== "admin") location.href="login.html";

// load classes dynamically
async function loadClasses(){

  const snap = await getDocs(collection(db,"users"));

  const set = new Set();

  snap.forEach(d=>{
    const u = d.data();
    if(u.role==="student") set.add(u.class);
  });

  classBox.innerHTML = [...set].map(c=>`<option>${c}</option>`).join("");

  periodBox.innerHTML = [1,2,3].map(p=>`<option>${p}</option>`).join("");

}

loadClasses();

function show(type,text){
  msg.className = "msg "+type;
  msg.innerText = text;
}

window.generate = async function(){

  const cls = classBox.value;
  const per = periodBox.value;

  show("info","Checking eligibility...");

  const studentsSnap = await getDocs(collection(db,"users"));
  const resultsSnap = await getDocs(collection(db,"results"));

  const students = {};
  studentsSnap.forEach(d=>{
    const u = d.data();
    if(u.role==="student") students[u.userId]=u;
  });

  const results = [];

  resultsSnap.forEach(d=>{
    const r = d.data();

    if(!students[r.studentId]) return;
    if(students[r.studentId].class !== cls) return;
    if(r.period !== per) return;

    results.push(r);
  });

  if(results.length === 0){
    return show("bad","No approved results found for this class/period.");
  }

  const grouped = {};

  Object.keys(students).forEach(id=>{

    const s = students[id];

    if(s.class !== cls) return;

    const sr = results.filter(r=>r.studentId===id);

    if(sr.length === 0) return;

    let total = 0;

    sr.forEach(r=>{
      total += Number(r.score);
    });

    const avg = total / sr.length;

    let category = null;

    if(avg >= 90) category="proprietor";
    else if(avg >= 85) category="principal";
    else if(avg >= 80) category="honor";

    if(category){

      grouped[id] = {
        name:s.name,
        average:avg,
        category
      };

    }

  });

  const final = Object.values(grouped);

  if(final.length === 0){
    return show("bad","Condition NOT met. No student qualifies for honor list.");
  }

  await setDoc(doc(db,"honorResults",cls+"_"+per),{
    class:cls,
    period:per,
    results:final,
    generatedAt:Date.now()
  });

  show("ok",`Success! ${final.length} student(s) added to honor list.`);

};

</script>

</body>
</html>
