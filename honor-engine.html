<!DOCTYPE html>
<html>
<head>
  <title>Honor Engine - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:600px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
    }

    select,button{
      width:100%;
      padding:10px;
      margin-top:10px;
    }

    button{
      border:none;
      background:#27ae60;
      color:white;
      font-weight:bold;
      border-radius:6px;
    }

    .msg{
      margin-top:15px;
      padding:10px;
      border-radius:6px;
      font-size:14px;
    }

    .success{
      background:#d4edda;
      color:#155724;
    }

    .error{
      background:#f8d7da;
      color:#721c24;
    }
  </style>
</head>

<body>

<h2 style="text-align:center;">Honor Engine</h2>

<div class="box">

  <label>Class</label>
  <select id="classBox"></select>

  <label>Period</label>
  <select id="periodBox"></select>

  <button onclick="generate()">Generate Honor List</button>

  <div id="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));
if(!user || user.role !== "admin") location.href="login.html";

// load classes dynamically
let classSet = new Set();

async function loadMeta(){

  const snap = await getDocs(collection(db,"users"));

  snap.forEach(d=>{
    const u = d.data();
    if(u.role==="student") classSet.add(u.class);
  });

  classBox.innerHTML = [...classSet]
    .map(c=>`<option>${c}</option>`)
    .join("");

  periodBox.innerHTML = [1,2,3]
    .map(p=>`<option>${p}</option>`)
    .join("");

}

loadMeta();

// UI helper
function show(type,text){
  msg.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

// ENGINE
window.generate = async function(){

  const cls = classBox.value;
  const per = periodBox.value;

  const studentsSnap = await getDocs(collection(db,"users"));
  const resultsSnap = await getDocs(collection(db,"results"));

  const students = {};
  let studentCount = 0;
  let resultCount = 0;

  studentsSnap.forEach(d=>{
    const u = d.data();
    if(u.role==="student" && u.class===cls){
      students[u.userId]=u;
      studentCount++;
    }
  });

  const results = [];

  resultsSnap.forEach(d=>{
    const r = d.data();

    if(students[r.studentId] && r.period===per){
      results.push(r);
      resultCount++;
    }
  });

  // 🚨 VALIDATION RULES
  if(studentCount < 3){
    show("error","Not enough students in this class to generate honor list.");
    return;
  }

  if(resultCount < 3){
    show("error","Not enough valid results for this period.");
    return;
  }

  // BUILD HONOR LIST
  const grouped = [];

  Object.keys(students).forEach(id=>{

    const s = students[id];

    const sr = results.filter(r=>r.studentId===id);

    if(sr.length === 0) return;

    let avg = 0;

    sr.forEach(r=>{
      avg += Number(r.score);
    });

    avg = avg / sr.length;

    let category = null;

    if(avg >= 90) category="proprietor";
    else if(avg >= 85) category="principal";
    else if(avg >= 80) category="honor";

    if(category){

      grouped.push({
        studentId:id,
        name:s.name,
        average:avg,
        category
      });

    }

  });

  if(grouped.length === 0){
    show("error","No students met honor conditions.");
    return;
  }

  await setDoc(doc(db,"honorResults",cls+"_"+per),{
    class:cls,
    period:per,
    results:grouped,
    generatedAt:Date.now()
  });

  show("success","Honor list generated successfully.");

};

</script>

</body>
</html>
