<!DOCTYPE html>
<html>
<head>
  <title>TEF Honor Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:700px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
    }

    select,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    button{
      background:#27ae60;
      color:white;
      border:none;
      font-weight:bold;
      cursor:pointer;
    }

    .msg{
      margin-top:15px;
      padding:12px;
      border-radius:6px;
      font-size:14px;
    }

    .ok{
      background:#d4edda;
      color:#155724;
    }

    .bad{
      background:#f8d7da;
      color:#721c24;
    }

  </style>
</head>

<body>

<div class="box">

  <h2>Honor Engine Generator</h2>

  <label>Class</label>
  <select id="classBox"></select>

  <label>Honor Generation Mode</label>
  <select id="modeBox" onchange="renderModeOptions()">
    <option value="period">Direct Period</option>
    <option value="semester">Semester Honor</option>
    <option value="yearly">Yearly Honor</option>
  </select>

  <div id="dynamicArea"></div>

  <button onclick="generateHonor()">
    Generate Honor List
  </button>

  <div id="msg"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const msg = document.getElementById("msg");

let allPeriods = [];

const semester1Periods = [
  "1st Period",
  "2nd Period",
  "3rd Period",
  "Semester Exam"
];

const semester2Periods = [
  "4th Period",
  "5th Period",
  "6th Period",
  "Final Exam"
];

// ----------------------------------
// LOAD CLASSES + PERIODS
// ----------------------------------
async function loadMeta(){

  const usersSnap =
    await getDocs(collection(db,"users"));

  const resultsSnap =
    await getDocs(collection(db,"results"));

  const classSet = new Set();
  const periodSet = new Set();

  usersSnap.forEach(d=>{

    const u = d.data();

    if(
      u.role === "student"
      &&
      u.class
    ){
      classSet.add(u.class);
    }

  });

  resultsSnap.forEach(d=>{

    const r = d.data();

    if(r.period){
      periodSet.add(r.period);
    }

  });

  allPeriods = [...periodSet];

  classBox.innerHTML =
    [...classSet]
    .map(c=>`<option>${c}</option>`)
    .join("");

  renderModeOptions();

}

loadMeta();

// ----------------------------------
// MODE UI
// ----------------------------------
window.renderModeOptions = function(){

  const mode = modeBox.value;

  const area =
    document.getElementById("dynamicArea");

  if(mode === "period"){

    area.innerHTML = `
      <label>Select Period</label>

      <select id="periodBox">
        ${
          allPeriods.map(p=>
            `<option>${p}</option>`
          ).join("")
        }
      </select>
    `;

  }

  else if(mode === "semester"){

    area.innerHTML = `
      <label>Select Semester</label>

      <select id="semesterBox">
        <option value="Semester 1">
          Semester 1
        </option>

        <option value="Semester 2">
          Semester 2
        </option>
      </select>
    `;
  }

  else if(mode === "yearly"){

    area.innerHTML = `
      <div style="margin-top:10px;">
        Generates yearly honor using:
        <br><br>

        1st → 6th Period
        <br>
        Semester Exam
        <br>
        Final Exam
      </div>
    `;
  }

};

// ----------------------------------
// MAIN ENGINE
// ----------------------------------
window.generateHonor = async function(){

  const cls = classBox.value;
  const mode = modeBox.value;

  if(!cls){
    return show("Select class","bad");
  }

  const rulesSnap =
    await getDoc(doc(db,"honorRules","main"));

  if(!rulesSnap.exists()){
    return show("Honor rules missing","bad");
  }

  const rules = rulesSnap.data();

  const studentsSnap =
    await getDocs(collection(db,"users"));

  const resultsSnap =
    await getDocs(collection(db,"results"));

  const students = {};

  studentsSnap.forEach(d=>{

    const u = d.data();

    if(u.role === "student"){
      students[u.userId] = u;
    }

  });

  let selectedPeriods = [];
  let datasetName = "";

  // ----------------------------------
  // PERIOD MODE
  // ----------------------------------
  if(mode === "period"){

    const p =
      document.getElementById("periodBox").value;

    selectedPeriods = [p];

    datasetName = p;

  }

  // ----------------------------------
  // SEMESTER MODE
  // ----------------------------------
  else if(mode === "semester"){

    const sem =
      document.getElementById("semesterBox").value;

    if(sem === "Semester 1"){
      selectedPeriods = semester1Periods;
    }

    else{
      selectedPeriods = semester2Periods;
    }

    datasetName = sem;

  }

  // ----------------------------------
  // YEARLY MODE
  // ----------------------------------
  else if(mode === "yearly"){

    selectedPeriods = [
      ...semester1Periods,
      ...semester2Periods
    ];

    datasetName = "Yearly Average";

  }

  // ----------------------------------
  // FILTER RESULTS
  // ----------------------------------
  const filtered = [];

  resultsSnap.forEach(d=>{

    const r = d.data();

    if(
      students[r.studentId]
      &&
      students[r.studentId].class === cls
      &&
      selectedPeriods.includes(r.period)
    ){
      filtered.push(r);
    }

  });

  if(filtered.length === 0){
    return show(
      "No approved results found",
      "bad"
    );
  }

  // ----------------------------------
  // CALCULATE HONORS
  // ----------------------------------
  const finalList = [];

  Object.keys(students).forEach(id=>{

    const stu = students[id];

    if(stu.class !== cls) return;

    const records =
      filtered.filter(r=>r.studentId === id);

    if(records.length === 0) return;

    // -----------------------------
    // MISSING PERIOD CHECK
    // -----------------------------
    const periodsOwned =
      [...new Set(records.map(r=>r.period))];

    if(
      periodsOwned.length
      !==
      selectedPeriods.length
    ){
      return;
    }

    // -----------------------------
    // RED MARK CHECK
    // -----------------------------
    let redMark = false;

    records.forEach(r=>{

      if(Number(r.score) < 70){
        redMark = true;
      }

    });

    if(redMark) return;

    // -----------------------------
    // AVERAGE
    // -----------------------------
    let total = 0;

    records.forEach(r=>{
      total += Number(r.score);
    });

    const avg =
      total / records.length;

    // -----------------------------
    // CATEGORY
    // -----------------------------
    let category = null;

    rules.bands.forEach(b=>{

      if(
        avg >= b.min
        &&
        avg <= b.max
      ){
        category = b.name;
      }

    });

    if(!category) return;

    finalList.push({
      studentId:id,
      studentName:stu.name,
      class:cls,
      average:Number(avg.toFixed(2)),
      category
    });

  });

  // ----------------------------------
  // EMPTY RESULT
  // ----------------------------------
  if(finalList.length === 0){

    return show(
      "No students qualified",
      "bad"
    );

  }

  // ----------------------------------
  // SAVE DATASET
  // ----------------------------------
  const docId =
    cls + "_" + datasetName;

  await setDoc(
    doc(db,"honorResults",docId),
    {
      class:cls,
      datasetName,
      mode,
      generatedAt:Date.now(),
      generatedFrom:selectedPeriods,
      students:finalList
    }
  );

  show(
    `Success: ${finalList.length} students added`,
    "ok"
  );

};

// ----------------------------------
function show(text,type){

  msg.className =
    "msg " + type;

  msg.textContent = text;

}

</script>

</body>
</html>
