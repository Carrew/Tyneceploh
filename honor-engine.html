<!DOCTYPE html>
<html>
<head>
  <title>Honor Engine - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:600px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    select,button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button{
      background:#27ae60;
      color:white;
      font-weight:bold;
      border:none;
    }

    .msg{
      margin-top:15px;
      padding:10px;
      border-radius:6px;
      font-size:14px;
    }

    .ok{ background:#d4edda; color:#155724; }
    .bad{ background:#f8d7da; color:#721c24; }

  </style>
</head>

<body>

<h2 style="text-align:center;">Honor Engine Generator</h2>

<div class="box">

  <label>Class</label>
  <select id="classBox"></select>

  <label>Period</label>
  <select id="periodBox"></select>

  <button onclick="generate()">Generate Honor List</button>

  <div id="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const msg = document.getElementById("msg");

// ----------------------
// LOAD CLASSES + PERIODS
// ----------------------
async function loadMeta(){

  const usersSnap = await getDocs(collection(db,"users"));
  const resultsSnap = await getDocs(collection(db,"results"));

  const classSet = new Set();
  const periodSet = new Set();

  usersSnap.forEach(d=>{
    const u = d.data();
    if(u.role === "student" && u.class){
      classSet.add(u.class);
    }
  });

  resultsSnap.forEach(d=>{
    const r = d.data();
    if(r.period){
      periodSet.add(r.period);
    }
  });

  classBox.innerHTML = [...classSet].map(c=>`<option>${c}</option>`).join("");
  periodBox.innerHTML = [...periodSet].map(p=>`<option>${p}</option>`).join("");

  show("System ready", "ok");

}

loadMeta();

// ----------------------
// ENGINE
// ----------------------
window.generate = async function(){

  const cls = classBox.value;
  const per = periodBox.value;

  if(!cls || !per){
    return show("Missing class or period", "bad");
  }

  const studentsSnap = await getDocs(collection(db,"users"));
  const resultsSnap = await getDocs(collection(db,"results"));
  const rulesSnap = await getDoc(doc(db,"honorRules","main"));

  if(!rulesSnap.exists()){
    return show("Honor rules not set", "bad");
  }

  const rules = rulesSnap.data();

  const students = {};
  studentsSnap.forEach(d=>{
    const u = d.data();
    if(u.role === "student"){
      students[u.userId] = u;
    }
  });

  const results = [];

  resultsSnap.forEach(d=>{
    const r = d.data();

    if(!students[r.studentId]) return;
    if(students[r.studentId].class !== cls) return;
    if(String(r.period) !== String(per)) return;

    results.push(r);
  });

  if(results.length === 0){
    return show("No approved results found for this class/period", "bad");
  }

  const grouped = [];

  Object.keys(students).forEach(id=>{

    const s = students[id];
    if(s.class !== cls) return;

    const sr = results.filter(r=>r.studentId === id);
    if(sr.length === 0) return;

    let total = 0;

    sr.forEach(r=>{
      total += Number(r.score);
    });

    const avg = total / sr.length;

    let category = null;

    for(const b of rules.bands){
      if(avg >= b.min && avg <= b.max){
        category = b.name;
      }
    }

    if(!category) return;

    grouped.push({
      studentId:id,
      name:s.name,
      average:avg,
      category
    });

  });

  if(grouped.length === 0){
    return show("No students meet honor criteria", "bad");
  }

  await setDoc(doc(db,"honorResults",cls+"_"+per),{
    class:cls,
    period:per,
    results:grouped,
    generatedAt:Date.now()
  });

  show(`Success: ${grouped.length} student(s) added to honor list`, "ok");

};

// ----------------------
// UI MESSAGE
// ----------------------
function show(text,type){

  msg.className = "msg " + type;
  msg.textContent = text;

}

</script>

</body>
</html>
