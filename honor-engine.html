<!DOCTYPE html>
<html>
<head>
  <title>Honor Engine - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:650px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    select,button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button{
      background:#27ae60;
      color:white;
      font-weight:bold;
      border:none;
    }

    .msg{
      margin-top:15px;
      padding:10px;
      border-radius:6px;
    }

    .ok{ background:#d4edda; color:#155724; }
    .bad{ background:#f8d7da; color:#721c24; }

  </style>
</head>

<body>

<h2 style="text-align:center;">Honor Engine Generator</h2>

<div class="box">

  <label>Class</label>
  <select id="classBox"></select>

  <label>Honor Mode</label>
  <select id="modeBox" onchange="togglePeriods()">
    <option value="period">Period Honors</option>
    <option value="semester">Semester Honors</option>
    <option value="yearly">Yearly Honors</option>
  </select>

  <label>Period (only for Period Mode)</label>
  <select id="periodBox" multiple></select>

  <button onclick="generate()">Generate Honor List</button>

  <div id="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const msg = document.getElementById("msg");

// -------------------------
// LOAD META
// -------------------------
async function loadMeta(){

  const usersSnap = await getDocs(collection(db,"users"));

  const classes = new Set();

  usersSnap.forEach(d=>{
    const u = d.data();
    if(u.role === "student"){
      classes.add(u.class);
    }
  });

  classBox.innerHTML = [...classes].map(c=>`<option>${c}</option>`).join("");

  const periods = [
    "1st Period",
    "2nd Period",
    "3rd Period",
    "Semester Exam",
    "4th Period",
    "5th Period",
    "6th Period",
    "Final Exam"
  ];

  periodBox.innerHTML = periods.map(p=>`<option>${p}</option>`).join("");

  show("System ready", "ok");
}

loadMeta();

// -------------------------
// UI CONTROL
// -------------------------
window.togglePeriods = function(){

  const mode = modeBox.value;

  periodBox.disabled = (mode !== "period");

};

togglePeriods();

// -------------------------
// HELPERS
// -------------------------
function avg(arr){
  if(arr.length === 0) return null;
  return arr.reduce((a,b)=>a+b,0)/arr.length;
}

// -------------------------
// ENGINE
// -------------------------
window.generate = async function(){

  const cls = classBox.value;
  const mode = modeBox.value;
  const selectedPeriods = [...periodBox.selectedOptions].map(o=>o.value);

  const usersSnap = await getDocs(collection(db,"users"));
  const resultsSnap = await getDocs(collection(db,"results"));

  const students = {};

  usersSnap.forEach(d=>{
    const u = d.data();
    if(u.role === "student"){
      students[u.userId] = u;
    }
  });

  const results = [];

  resultsSnap.forEach(d=>{
    const r = d.data();

    if(!students[r.studentId]) return;
    if(students[r.studentId].class !== cls) return;

    results.push(r);
  });

  if(results.length === 0){
    return show("No results found", "bad");
  }

  const grouped = {};

  results.forEach(r=>{

    const id = r.studentId;

    if(!grouped[id]){
      grouped[id] = {
        name:r.studentName,
        scores:{}
      };
    }

    grouped[id].scores[r.period] = Number(r.score);

  });

  const finalList = [];

  Object.keys(grouped).forEach(id=>{

    const g = grouped[id];

    let average = null;

    // -------------------------
    // PERIOD HONORS
    // -------------------------
    if(mode === "period"){

      const vals = selectedPeriods.map(p=>g.scores[p]);

      if(vals.includes(undefined)) return;

      average = avg(vals);
    }

    // -------------------------
    // SEMESTER HONORS
    // -------------------------
    if(mode === "semester"){

      const sem1 = avg([
        g.scores["1st Period"],
        g.scores["2nd Period"],
        g.scores["3rd Period"],
        g.scores["Semester Exam"]
      ]);

      const sem2 = avg([
        g.scores["4th Period"],
        g.scores["5th Period"],
        g.scores["6th Period"],
        g.scores["Final Exam"]
      ]);

      if(sem1 == null || sem2 == null) return;

      average = (sem1 + sem2) / 2;
    }

    // -------------------------
    // YEARLY HONORS
    // -------------------------
    if(mode === "yearly"){

      const sem1 = avg([
        g.scores["1st Period"],
        g.scores["2nd Period"],
        g.scores["3rd Period"],
        g.scores["Semester Exam"]
      ]);

      const sem2 = avg([
        g.scores["4th Period"],
        g.scores["5th Period"],
        g.scores["6th Period"],
        g.scores["Final Exam"]
      ]);

      if(sem1 == null || sem2 == null) return;

      average = (sem1 + sem2) / 2;
    }

    if(average == null) return;

    let category = "";

    if(average >= 90) category = "Proprietor";
    else if(average >= 85) category = "Principal";
    else if(average >= 80) category = "Honor";

    finalList.push({
      studentId:id,
      name:g.name,
      average,
      category
    });

  });

  if(finalList.length === 0){
    return show("No eligible students", "bad");
  }

  await setDoc(doc(db,"honorResults",cls+"_"+mode),{
    class:cls,
    mode,
    results:finalList,
    generatedAt:Date.now()
  });

  show(`Generated ${finalList.length} honors`, "ok");

};

// -------------------------
function show(text,type){
  msg.className = "msg " + type;
  msg.textContent = text;
}

</script>

</body>
</html>
