<!DOCTYPE html>
<html>
<head>
  <title>Honor Engine - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:650px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    select,button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button{
      background:#27ae60;
      color:white;
      font-weight:bold;
      border:none;
    }

    .msg{
      margin-top:15px;
      padding:10px;
      border-radius:6px;
      font-size:14px;
    }

    .ok{ background:#d4edda; color:#155724; }
    .bad{ background:#f8d7da; color:#721c24; }

  </style>
</head>

<body>

<h2 style="text-align:center;">Honor Engine Generator</h2>

<div class="box">

  <label>Class</label>
  <select id="classBox"></select>

  <label>Honor Mode</label>
  <select id="modeBox">
    <option value="period">Period Honors</option>
    <option value="semester">Semester Honors</option>
    <option value="yearly">Yearly Honors</option>
  </select>

  <button onclick="generate()">Generate Honor List</button>

  <div id="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const msg = document.getElementById("msg");

// --------------------
// LOAD CLASSES
// --------------------
async function loadMeta(){

  const snap = await getDocs(collection(db,"users"));

  const classSet = new Set();

  snap.forEach(d=>{
    const u = d.data();
    if(u.role === "student" && u.class){
      classSet.add(u.class);
    }
  });

  classBox.innerHTML = [...classSet]
    .map(c=>`<option>${c}</option>`)
    .join("");

  show("System ready", "ok");
}

loadMeta();

// --------------------
// CORE HELPERS
// --------------------
function avg(arr){
  if(arr.length === 0) return null;
  return arr.reduce((a,b)=>a+b,0) / arr.length;
}

function complete(obj, keys){
  return keys.every(k => obj[k] != null);
}

// --------------------
// ENGINE
// --------------------
window.generate = async function(){

  const cls = classBox.value;
  const mode = modeBox.value;

  if(!cls){
    return show("Select class", "bad");
  }

  const usersSnap = await getDocs(collection(db,"users"));
  const resultsSnap = await getDocs(collection(db,"results"));
  const rulesSnap = await getDocs(collection(db,"honorRules"));

  let rules = null;
  rulesSnap.forEach(d=>{
    rules = d.data();
  });

  if(!rules){
    return show("Honor rules missing", "bad");
  }

  // students map
  const students = {};
  usersSnap.forEach(d=>{
    const u = d.data();
    if(u.role === "student"){
      students[u.userId] = u;
    }
  });

  // filter class results
  const results = [];

  resultsSnap.forEach(d=>{
    const r = d.data();

    if(!students[r.studentId]) return;
    if(students[r.studentId].class !== cls) return;

    results.push(r);
  });

  if(results.length === 0){
    return show("No results found", "bad");
  }

  const grouped = {};

  results.forEach(r=>{

    const id = r.studentId;

    if(!grouped[id]){
      grouped[id] = {
        name: r.studentName,
        class: cls,
        scores: {}
      };
    }

    const key = r.period || r.term;

    grouped[id].scores[key] = Number(r.score);

  });

  const final = [];

  Object.keys(grouped).forEach(id=>{

    const g = grouped[id];

    let average = null;

    // -------------------------
    // PERIOD MODE
    // -------------------------
    if(mode === "period"){

      const scores = Object.values(g.scores);

      if(scores.length === 0) return;

      average = avg(scores);
    }

    // -------------------------
    // SEMESTER MODE
    // -------------------------
    if(mode === "semester"){

      const sem1 = complete(g.scores, ["P1","P2","P3","EXAM"])
        ? avg([g.scores.P1, g.scores.P2, g.scores.P3, g.scores.EXAM])
        : null;

      const sem2 = complete(g.scores, ["P4","P5","P6","EXAM2"])
        ? avg([g.scores.P4, g.scores.P5, g.scores.P6, g.scores.EXAM2])
        : null;

      if(sem1 == null || sem2 == null) return;

      average = (sem1 + sem2) / 2;
    }

    // -------------------------
    // YEARLY MODE
    // -------------------------
    if(mode === "yearly"){

      const sem1 = complete(g.scores, ["P1","P2","P3","EXAM"])
        ? avg([g.scores.P1, g.scores.P2, g.scores.P3, g.scores.EXAM])
        : null;

      const sem2 = complete(g.scores, ["P4","P5","P6","EXAM2"])
        ? avg([g.scores.P4, g.scores.P5, g.scores.P6, g.scores.EXAM2])
        : null;

      if(sem1 == null || sem2 == null) return;

      average = (sem1 + sem2) / 2;
    }

    if(average == null) return;

    let category = null;

    for(const b of rules.bands){
      if(average >= b.min && average <= b.max){
        category = b.name;
      }
    }

    if(!category) return;

    final.push({
      studentId:id,
      name:g.name,
      average,
      category
    });

  });

  if(final.length === 0){
    return show("No eligible students", "bad");
  }

  await setDoc(doc(db,"honorResults",cls+"_"+mode),{
    class:cls,
    mode,
    results:final,
    generatedAt:Date.now()
  });

  show(`Generated ${final.length} honor students (${mode})`, "ok");

};

// --------------------
// UI
// --------------------
function show(text,type){
  msg.className = "msg " + type;
  msg.textContent = text;
}

</script>

</body>
</html>
