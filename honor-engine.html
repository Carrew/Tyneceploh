<!DOCTYPE html>
<html>
<head>
  <title>Honor Engine - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:600px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
    }

    select,button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
    }

    button{
      background:#27ae60;
      color:white;
      border:none;
      font-weight:bold;
      cursor:pointer;
    }

    .msg{
      margin-top:15px;
      padding:10px;
      border-radius:6px;
      font-size:14px;
    }

    .ok{background:#d4edda;color:#155724;}
    .bad{background:#f8d7da;color:#721c24;}
    .info{background:#d1ecf1;color:#0c5460;}
  </style>
</head>

<body>

<h2 style="text-align:center;">Honor Engine</h2>

<div class="box">

  <label>Class</label>
  <select id="classBox"></select>

  <label>Period (Auto-detected available)</label>
  <select id="periodBox"></select>

  <button onclick="generate()">Generate Honor List</button>

  <div id="msg" class="msg info">Loading system...</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));
if(!user || user.role!=="admin") location.href="login.html";

let classes = new Set();
let periods = new Set();

function show(text,type="info"){
  msg.className="msg "+type;
  msg.innerText=text;
}

// LOAD CLASSES + PERIODS FROM REAL DATA
async function loadMeta(){

  const snap = await getDocs(collection(db,"users"));

  snap.forEach(d=>{
    const u = d.data();
    if(u.role==="student") classes.add(u.class);
  });

  const resSnap = await getDocs(collection(db,"results"));

  resSnap.forEach(d=>{
    const r = d.data();
    if(r.period) periods.add(r.period);
  });

  classBox.innerHTML = [...classes].map(c=>`<option>${c}</option>`).join("");

  periodBox.innerHTML = [...periods].length
    ? [...periods].map(p=>`<option>${p}</option>`).join("")
    : `<option>No periods found</option>`;

  show("System ready","ok");
}

loadMeta();

window.generate = async function(){

  const cls = classBox.value;
  const per = periodBox.value;

  if(!cls || !per){
    show("Invalid selection","bad");
    return;
  }

  const usersSnap = await getDocs(collection(db,"users"));
  const resultsSnap = await getDocs(collection(db,"results"));

  const students = {};

  usersSnap.forEach(d=>{
    const u = d.data();
    if(u.role==="student" && u.class===cls){
      students[u.userId]=u;
    }
  });

  const results = [];

  resultsSnap.forEach(d=>{
    const r = d.data();
    if(r.period===per && students[r.studentId]){
      results.push(r);
    }
  });

  if(results.length === 0){
    show("No approved grades found for this class/period","bad");
    return;
  }

  const grouped = {};

  Object.keys(students).forEach(id=>{

    const s = students[id];

    const sr = results.filter(r=>r.studentId===id);

    if(sr.length===0) return;

    let total=0;

    sr.forEach(r=>{
      total += Number(r.score);
    });

    const avg = total / sr.length;

    let category=null;

    if(avg>=90) category="proprietor";
    else if(avg>=85) category="principal";
    else if(avg>=80) category="honor";

    if(category){
      grouped[id]={
        name:s.name,
        average:avg,
        category
      };
    }

  });

  const finalList = Object.values(grouped);

  if(finalList.length===0){
    show("No students meet honor criteria","bad");
    return;
  }

  await setDoc(doc(db,"honorResults",cls+"_"+per),{
    class:cls,
    period:per,
    results:finalList,
    generatedAt:Date.now()
  });

  show(`Success: ${finalList.length} student(s) qualified`,"ok");

};

</script>

</body>
</html>
