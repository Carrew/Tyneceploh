<!DOCTYPE html>
<html>
<head>
  <title>Honor Engine - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .box{
      max-width:600px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    select,button{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    button{
      background:#27ae60;
      color:white;
      font-weight:bold;
      border:none;
      cursor:pointer;
    }

    .msg{
      margin-top:15px;
      font-size:14px;
      padding:10px;
      border-radius:6px;
    }

    .ok{
      background:#d4edda;
      color:#155724;
    }

    .bad{
      background:#f8d7da;
      color:#721c24;
    }

  </style>
</head>

<body>

<h2 style="text-align:center;">Honor Engine</h2>

<div class="box">

  <label>Class</label>
  <select id="classBox"></select>

  <label>Period (Auto Detected)</label>
  <select id="periodBox"></select>

  <button onclick="generate()">Generate Honor List</button>

  <div id="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));
if(!user || user.role !== "admin") location.href="login.html";

let classes = new Set();
let periods = new Set();

async function loadMeta(){

  const snap = await getDocs(collection(db,"users"));

  snap.forEach(d=>{
    const u = d.data();
    if(u.role==="student") classes.add(u.class);
  });

  // detect periods from results
  const resSnap = await getDocs(collection(db,"results"));

  resSnap.forEach(d=>{
    const r = d.data();
    if(r.period) periods.add(r.period);
  });

  classBox.innerHTML = [...classes].map(c=>`<option>${c}</option>`).join("");

  periodBox.innerHTML = [...periods].length
    ? [...periods].map(p=>`<option>${p}</option>`).join("")
    : `<option disabled>No periods found</option>`;

}

loadMeta();

function show(msg,type){
  msgBox.innerHTML = `<div class="msg ${type}">${msg}</div>`;
}

window.generate = async function(){

  const cls = classBox.value;
  const per = periodBox.value;

  const studentsSnap = await getDocs(collection(db,"users"));
  const resultsSnap = await getDocs(collection(db,"results"));

  const students = {};

  studentsSnap.forEach(d=>{
    const u = d.data();
    if(u.role==="student") students[u.userId]=u;
  });

  let results = [];

  resultsSnap.forEach(d=>{
    const r = d.data();

    if(!students[r.studentId]) return;
    if(students[r.studentId].class !== cls) return;
    if(r.period !== per) return;

    results.push(r);
  });

  if(results.length === 0){
    show("No valid results found for this class & period","bad");
    return;
  }

  let grouped = {};
  let eligibleCount = 0;

  Object.keys(students).forEach(id=>{

    const s = students[id];

    if(s.class !== cls) return;

    const sr = results.filter(r=>r.studentId===id);

    if(sr.length === 0) return;

    let total = 0;

    sr.forEach(r=>{
      total += Number(r.score);
    });

    const avg = total / sr.length;

    let category = null;

    if(avg >= 90){
      category = "proprietor";
      eligibleCount++;
    }
    else if(avg >= 85){
      category = "principal";
      eligibleCount++;
    }
    else if(avg >= 80){
      category = "honor";
      eligibleCount++;
    }

    if(category){

      grouped[id] = {
        name:s.name,
        average:avg,
        category
      };

    }

  });

  if(eligibleCount === 0){
    show("No students meet honor conditions","bad");
    return;
  }

  await setDoc(doc(db,"honorResults",cls+"_"+per),{
    class:cls,
    period:per,
    results:Object.values(grouped),
    generatedAt:Date.now()
  });

  show(`Success! ${eligibleCount} student(s) added to honor list`,"ok");

};

</script>

</body>
</html>
