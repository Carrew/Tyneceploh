<!DOCTYPE html>
<html>
<head>
  <title>Rejected Grades - TEF</title>

  <style>
    body{
      font-family:sans-serif;
      background:#f4f6f9;
      padding:20px;
    }

    h2{
      margin-bottom:15px;
    }

    .wrap{
      max-width:900px;
      margin:auto;
    }

    .card{
      background:white;
      padding:15px;
      margin-bottom:15px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    input{
      width:100%;
      padding:10px;
      margin-top:5px;
      margin-bottom:10px;
      border:1px solid #ddd;
      border-radius:6px;
    }

    .feedback{
      background:#fff3cd;
      padding:10px;
      border-left:4px solid #ffc107;
      margin-top:10px;
      border-radius:6px;
      font-size:14px;
    }

    .badge{
      display:inline-block;
      padding:5px 10px;
      border-radius:20px;
      font-size:12px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .rejected{
      background:#f8d7da;
      color:#721c24;
    }

    .btn{
      background:#27ae60;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:6px;
      cursor:pointer;
      width:100%;
    }

    .btn:hover{
      background:#219150;
    }

    .empty{
      text-align:center;
      color:#666;
      margin-top:40px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h2>Rejected Grades</h2>

  <div id="list">Loading...</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "teacher"){
  location.href = "login.html";
}

let rejected = [];

async function load(){

  document.getElementById("list").innerHTML = "Loading...";

  const snap = await getDocs(collection(db,"gradeSubmissions"));

  rejected = [];

  snap.forEach(d=>{

    const g = d.data();

    if(
      g.teacherId === user.userId &&
      g.status === "rejected"
    ){
      rejected.push({
        ...g,
        docId:d.id
      });
    }
  });

  render();
}

function render(){

  const div = document.getElementById("list");

  if(rejected.length === 0){
    div.innerHTML = `<p class="empty">No rejected grades right now.</p>`;
    return;
  }

  div.innerHTML = rejected.map(g=>`

    <div class="card">

      <div class="badge rejected">REJECTED</div>

      <h3>${g.studentName || "Unknown Student"}</h3>

      <label>Subject</label>
      <input id="subject-${g.docId}" value="${g.subject || ""}">

      <label>Score</label>
      <input id="score-${g.docId}" type="number" value="${g.score || 0}">

      <div class="feedback">
        <b>Teacher Feedback:</b><br>
        ${g.feedback || "No feedback provided"}
      </div>

      <button class="btn" onclick="resubmit('${g.docId}')">
        Resubmit Grade
      </button>

    </div>

  `).join("");
}

window.resubmit = async function(id){

  const subject =
    document.getElementById(`subject-${id}`).value.trim();

  const score =
    Number(document.getElementById(`score-${id}`).value);

  if(!subject){
    alert("Subject cannot be empty");
    return;
  }

  if(isNaN(score)){
    alert("Invalid score");
    return;
  }

  try{

    await updateDoc(doc(db,"gradeSubmissions",id),{

      subject,
      score,

      status:"resubmitted",
      resubmittedAt:Date.now(),
      feedback:""

    });

    alert("Resubmitted successfully");

    load();

  }catch(err){
    console.error(err);
    alert("Failed to resubmit grade");
  }
};

load();

</script>

</body>
</html>
