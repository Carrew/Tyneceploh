<!DOCTYPE html>
<html>
<head>
  <title>Quiz Review - TEF</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f6f9;
    }

    h2 { margin-bottom: 10px; }

    select {
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }

    .big {
      font-size: 22px;
      font-weight: bold;
      margin-top: 5px;
    }

    .table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 10px;
      border: 1px solid #eee;
      text-align: center;
    }

    th {
      background: #2c3e50;
      color: white;
    }

    .high { color: #2980b9; font-weight: bold; }
    .low { color: #e74c3c; font-weight: bold; }

    .student-card {
      background: white;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background: #27ae60;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>Quiz Review Dashboard</h2>

<select id="quizSelect"></select>

<div class="grid" id="stats"></div>

<button onclick="downloadPDF()">Download PDF Report</button>

<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));
if(!user || user.role !== "teacher") location.href = "login.html";

let quizzes = [];
let submissions = [];
let currentQuiz = null;

async function load() {
  const qSnap = await getDocs(collection(db, "quizzes"));
  const sSnap = await getDocs(collection(db, "quizSubmissions"));

  quizzes = [];
  submissions = [];

  qSnap.forEach(d => {
    const q = d.data();
    if(q.teacherId === user.id) {
      quizzes.push({ id: d.id, ...q });
    }
  });

  sSnap.forEach(d => submissions.push({ id: d.id, ...d.data() }));

  document.getElementById("quizSelect").innerHTML =
    quizzes.map(q => `<option value="${q.id}">${q.title}</option>`).join("");

  render();
}

function render() {
  const id = document.getElementById("quizSelect").value;
  const quiz = quizzes.find(q => q.id === id);
  currentQuiz = quiz;

  if(!quiz) return;

  const results = submissions.filter(s => s.quizId === id);

  let total = results.length;
  let sum = 0;
  let highest = 0;
  let lowest = 100;

  results.forEach(r => {
    const p = (r.score / (r.total || 1)) * 100;
    sum += p;
    if(p > highest) highest = p;
    if(p < lowest) lowest = p;
  });

  const avg = total ? (sum / total).toFixed(1) : 0;

  document.getElementById("stats").innerHTML = `
    <div class="card"><div>Total</div><div class="big">${total}</div></div>
    <div class="card"><div>Average</div><div class="big">${avg}%</div></div>
    <div class="card"><div>Highest</div><div class="big">${highest.toFixed(1)}%</div></div>
    <div class="card"><div>Lowest</div><div class="big">${lowest.toFixed(1)}%</div></div>
  `;

  let html = `
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Score</th>
          <th>Total</th>
          <th>%</th>
        </tr>
      </thead>
      <tbody>
  `;

  results.forEach(r => {
    const totalScore = r.total || 1;
    const percent = ((r.score / totalScore) * 100).toFixed(1);

    html += `
      <tr>
        <td>${r.studentName}</td>
        <td>${r.score}</td>
        <td>${totalScore}</td>
        <td class="${percent >= 50 ? "high" : "low"}">${percent}%</td>
      </tr>
    `;
  });

  html += "</tbody></table>";

  html += "<h3>Student Answers</h3>";

  results.forEach(r => {
    html += `
      <div class="student-card">
        <b>${r.studentName}</b><br>
        ${r.answers?.map((a,i)=>`Q${i+1}: ${a}`).join("<br>") || "No answers"}
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

window.downloadPDF = function () {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let text = `Quiz Report\n\n`;

  const id = document.getElementById("quizSelect").value;
  const quiz = quizzes.find(q => q.id === id);
  const results = submissions.filter(s => s.quizId === id);

  text += `Title: ${quiz?.title || ""}\n\n`;

  results.forEach((r, i) => {
    const p = ((r.score / (r.total || 1)) * 100).toFixed(1);
    text += `${i+1}. ${r.studentName} - ${p}%\n`;
  });

  doc.text(text, 10, 10);
  doc.save("quiz-report.pdf");
};

document.getElementById("quizSelect").addEventListener("change", render);

load();
</script>

</body>
</html>
