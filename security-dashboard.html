<!DOCTYPE html>
<html>
<head>
  <title>Security Dashboard - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    :root{
      --bg:#0b0b0f;
      --panel:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.08);
      --pink:#ffc0cb;
      --danger:#ff3b3b;
      --text:#fff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:system-ui;
    }

    body{
      background:radial-gradient(circle at top,#120008,var(--bg));
      color:var(--text);
      min-height:100vh;
    }

    header{
      padding:22px;
      text-align:center;
      background:linear-gradient(135deg,#800000,#1a0010);
    }

    header h1{
      color:var(--pink);
    }

    .sub{
      opacity:.7;
      margin-top:6px;
      font-size:13px;
    }

    /* PROFILE */
    .profile{
      margin:16px;
      padding:18px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      display:flex;
      align-items:center;
      gap:14px;
    }

    .profile img{
      width:70px;
      height:70px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--pink);
      background:#222;
    }

    .meta{
      font-size:13px;
      opacity:.8;
      margin-top:3px;
    }

    .badge{
      display:inline-block;
      margin-top:6px;
      padding:4px 10px;
      border-radius:999px;
      background:rgba(255,255,255,0.08);
      font-size:12px;
    }

    /* ALERT */
    .alert{
      margin:12px 16px;
      padding:12px;
      border-radius:12px;
      background:rgba(255,59,59,0.08);
      border:1px solid rgba(255,59,59,0.3);
      font-size:13px;
    }

    /* STATS */
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:10px;
      padding:0 16px;
    }

    .stat{
      background:var(--panel);
      border:1px solid var(--border);
      padding:14px;
      border-radius:12px;
      text-align:center;
    }

    .stat b{
      color:var(--pink);
      font-size:13px;
    }

    .stat h3{
      margin-top:6px;
    }

    /* GRID */
    .section-title{
      padding:18px 16px 8px;
      font-size:12px;
      opacity:.7;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:10px;
      padding:12px 16px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--border);
      padding:14px;
      border-radius:12px;
      cursor:pointer;
      transition:.2s;
    }

    .card:hover{
      border-color:var(--pink);
      transform:translateY(-3px);
    }

    .logout{
      width:90%;
      margin:25px auto;
      display:block;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#1b1b25;
      color:white;
    }

  </style>
</head>

<body>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "security"){
  location.href = "login.html";
}
</script>

<header>
  <h1>Security Control Panel</h1>
  <div class="sub">Campus safety & monitoring system</div>
</header>

<!-- PROFILE -->
<div class="profile">

  <img id="photo">

  <div>

    <b id="name"></b>

    <div class="meta">ID: <span id="id"></span></div>

    <div class="badge" id="shift"></div>

  </div>

</div>

<!-- ALERT -->
<div class="alert">
  Stay alert. Report incidents immediately through the admin system.
</div>

<!-- STATS (REAL ONLY — NO FAKE VALUES) -->
<div class="stats">

  <div class="stat">
    <b>Status</b>
    <h3>Active</h3>
  </div>

  <div class="stat">
    <b>Shift</b>
    <h3 id="shiftBox">--</h3>
  </div>

</div>

<!-- TOOLS -->
<div class="section-title">Security Tools</div>

<div class="grid">

  <div class="card" onclick="go('staff-attendance.html')">
    🕒 Attendance
  </div>

  <div class="card" onclick="go('qr-scan-attendance.html')">
    📱 QR Scan
  </div>

  <div class="card" onclick="go('admin-view-attendance.html')">
    📌 Logs
  </div>

</div>

<!-- COMMUNICATION -->
<div class="section-title">Communication</div>

<div class="grid">

  <div class="card" onclick="go('admin-announcements.html')">
    📢 Announcements
  </div>

  <div class="card" onclick="go('users-announcement.html')">
    📣 Broadcasts
  </div>

</div>

<!-- SUPPORT -->
<div class="section-title">Support</div>

<div class="grid">

  <div class="card" onclick="go('admin-dashboard.html')">
    🏠 Admin Panel
  </div>

</div>

<button class="logout" onclick="logout()">Logout</button>

<script>

/* PROFILE DATA */
document.getElementById("name").innerText = user.name || "Security";
document.getElementById("id").innerText = user.userId || "-";

const shift = user.shift || "Not assigned";
document.getElementById("shift").innerText = shift;
document.getElementById("shiftBox").innerText = shift;

/* IMAGE */
const img = user.photoURL || "https://via.placeholder.com/100";
document.getElementById("photo").src = img;

/* NAV */
function go(page){
  location.href = page;
}

function logout(){
  localStorage.removeItem("user");
  location.href = "login.html";
}

</script>

</body>
</html>
