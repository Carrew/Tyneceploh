<!DOCTYPE html>
<html>
<head>
  <title>Security Dashboard - TEF</title>

  <style>
    :root {
      --maroon: #800000;
      --pink: #ffc0cb;
      --bg: #0b0b0f;
      --card: rgba(255,255,255,0.06);
    }

    body {
      margin: 0;
      font-family: system-ui;
      background: radial-gradient(circle at top, #120008, var(--bg));
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: linear-gradient(135deg, var(--maroon), #1a0010);
    }

    h1 {
      margin: 0;
      color: var(--pink);
    }

    .sub {
      opacity: 0.8;
      margin-top: 5px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      margin: 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
    }

    .profile img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      background: rgba(255,255,255,0.1);
      margin-top: 4px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .stat {
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .section-title {
      padding: 10px 15px;
      font-size: 13px;
      opacity: 0.8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      padding: 15px;
    }

    .card {
      background: var(--card);
      padding: 14px;
      border-radius: 12px;
      border-left: 3px solid var(--pink);
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.09);
    }

    .alert {
      margin: 10px 15px;
      padding: 10px;
      background: rgba(255, 0, 0, 0.1);
      border-left: 3px solid red;
      border-radius: 8px;
    }

    .logout {
      width: 90%;
      margin: 20px auto;
      display: block;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "security"){
  location.href = "login.html";
}

// image cache system
const imageCache = {
  get(key){ return localStorage.getItem("img_" + key); },
  set(key, value){ localStorage.setItem("img_" + key, value); }
};
</script>

<header>
  <h1>Security Control Panel</h1>
  <div class="sub">Monitoring & campus safety hub</div>
</header>

<div class="profile">
  <img id="photo" />
  <div>
    <b id="name"></b><br>
    <span id="id"></span><br>
    <span class="badge" id="shift"></span>
  </div>
</div>

<div class="alert">
  ⚠️ Stay alert. Report incidents immediately to admin dashboard.
</div>

<div class="stats">
  <div class="stat">
    <b>Checkpoints</b><br>--
  </div>
  <div class="stat">
    <b>Incidents</b><br>--
  </div>
  <div class="stat">
    <b>Attendance</b><br>--
  </div>
</div>

<div class="section-title">Security Tools</div>

<div class="grid">
  <div class="card" onclick="go('staff-attendance.html')">🕒 Staff Attendance</div>
  <div class="card" onclick="go('qr-scan-attendance.html')">📱 QR Scan</div>
  <div class="card" onclick="go('admin-view-attendance.html')">📌 View Logs</div>
</div>

<div class="section-title">Communication</div>

<div class="grid">
  <div class="card" onclick="go('admin-announcements.html')">📢 Announcements</div>
  <div class="card" onclick="go('users-announcement.html')">📣 Broadcasts</div>
</div>

<div class="section-title">Support</div>

<div class="grid">
  <div class="card" onclick="go('admin-dashboard.html')">🏠 Admin Panel</div>
</div>

<button class="logout" onclick="logout()">Logout</button>

<script>
document.getElementById("name").innerText = user.name;
document.getElementById("id").innerText = user.userId || "";
document.getElementById("shift").innerText = user.shift ? `Shift: ${user.shift}` : "";

// IMAGE CACHE
const cachedImg = localStorage.getItem("img_" + user.userId);

if(cachedImg){
  document.getElementById("photo").src = cachedImg;
} else if(user.photoURL){
  document.getElementById("photo").src = user.photoURL;
  localStorage.setItem("img_" + user.userId, user.photoURL);
} else {
  document.getElementById("photo").src = "https://via.placeholder.com/60";
}

function go(page){
  location.href = page;
}

function logout(){
  localStorage.removeItem("user");
  location.href = "login.html";
}
</script>

</body>
</html>
