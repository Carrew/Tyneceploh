<!DOCTYPE html>
<html>
<head>
  <title>TEF Attendance Control</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>

    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    input,select{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
    }

    .green{
      background:#27ae60;
      color:white;
    }

    .blue{
      background:#2980b9;
      color:white;
    }

    .red{
      background:#c0392b;
      color:white;
    }

    #qr{
      margin-top:20px;
      text-align:center;
    }

    #info{
      text-align:center;
      margin-top:10px;
      font-weight:bold;
    }

    @media(max-width:768px){

      .grid{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

<h2>TEF Attendance Control</h2>

<div class="grid">

  <!-- QR SECTION -->
  <div class="card">

    <h3>QR Management</h3>

    <label>QR Valid Hours</label>

    <input
      type="number"
      id="hours"
      value="6"
    >

    <button
      class="green"
      onclick="generateQR()"
    >
      Generate New QR
    </button>

    <button
      class="blue"
      onclick="reprintQR()"
    >
      Reprint Existing QR
    </button>

    <div id="qr"></div>

    <div id="info"></div>

  </div>

  <!-- SETTINGS -->
  <div class="card">

    <h3>Staff Attendance Settings</h3>

    <select id="staff">
      <option value="">
        Loading Users...
      </option>
    </select>

    <label>
      Expected Clock In
    </label>

    <input
      type="time"
      id="clockIn"
    >

    <label>
      Expected Clock Out
    </label>

    <input
      type="time"
      id="clockOut"
    >

    <label>
      Grace Minutes
    </label>

    <input
      type="number"
      id="grace"
      value="10"
    >

    <button
      class="green"
      onclick="saveSettings()"
    >
      Save Settings
    </button>

    <button
      class="red"
      onclick="resetDevice()"
    >
      Reset Device Lock
    </button>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

  getFirestore,
  doc,
  setDoc,
  getDoc,
  getDocs,
  collection,
  updateDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

//
// FIREBASE
//
const firebaseConfig = {

  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"

};

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

//
// USER CHECK
//
const user =
  JSON.parse(
    localStorage.getItem("user")
  );

if(
  !user ||
  user.role !== "admin"
){

  location.href = "login.html";

}

//
// LOAD USERS
//
async function loadStaffUsers(){

  const select =
    document.getElementById("staff");

  select.innerHTML =
    `<option value="">
      Select Staff
    </option>`;

  try{

    const snap =
      await getDocs(
        collection(db,"users")
      );

    snap.forEach(docSnap => {

      const u =
        docSnap.data();

      //
      // EXCLUDE STUDENTS
      //
      if(
        u.role &&
        u.role.toLowerCase()
        !== "student"
      ){

        const option =
          document.createElement("option");

        option.value =
          u.userId;

        option.textContent =
          `${u.name}
          (${u.userId})
          - ${u.role}`;

        select.appendChild(option);

      }

    });

  }

  catch(err){

    console.error(err);

    alert(
      "Failed loading users"
    );

  }

}

loadStaffUsers();

//
// AUTO LOAD SETTINGS
//
document
.getElementById("staff")
.addEventListener(

  "change",

  async function(){

    const userId =
      this.value;

    if(!userId) return;

    try{

      const settingsRef =
        doc(
          db,
          "attendanceSettings",
          userId
        );

      const settingsSnap =
        await getDoc(settingsRef);

      //
      // SETTINGS EXIST
      //
      if(settingsSnap.exists()){

        const s =
          settingsSnap.data();

        document
        .getElementById("clockIn")
        .value =
          s.expectedClockIn || "";

        document
        .getElementById("clockOut")
        .value =
          s.expectedClockOut || "";

        document
        .getElementById("grace")
        .value =
          s.graceMinutes || 10;

        console.log(
          "Loaded Settings:",
          s
        );

      }

      //
      // NO SETTINGS
      //
      else{

        document
        .getElementById("clockIn")
        .value = "";

        document
        .getElementById("clockOut")
        .value = "";

        document
        .getElementById("grace")
        .value = 10;

        console.log(
          "No settings found"
        );

      }

    }

    catch(err){

      console.error(
        "Load Settings Error:",
        err
      );

      alert(
        "Failed loading settings"
      );

    }

  }

);

//
// GENERATE QR
//
window.generateQR =
async function(){

  try{

    const hours =
      Number(
        document
        .getElementById("hours")
        .value
      );

    const now =
      Date.now();

    const qrData = {

      token:
        "TEF-" + now,

      createdAt:
        now,

      expiresAt:
        now +
        (hours * 3600000)

    };

    await setDoc(

      doc(
        db,
        "attendanceSystem",
        "mainQR"
      ),

      qrData

    );

    renderQR(qrData);

    alert(
      "QR generated successfully"
    );

  }

  catch(err){

    console.error(err);

    alert(
      "QR generation failed"
    );

  }

};

//
// REPRINT QR
//
window.reprintQR =
async function(){

  try{

    const snap =
      await getDoc(
        doc(
          db,
          "attendanceSystem",
          "mainQR"
        )
      );

    if(!snap.exists()){

      alert(
        "No QR available"
      );

      return;

    }

    renderQR(
      snap.data()
    );

  }

  catch(err){

    console.error(err);

    alert(
      "Failed loading QR"
    );

  }

};

//
// RENDER QR
//
function renderQR(data){

  QRCode.toCanvas(

    JSON.stringify(data),

    {
      width:220
    },

    (err,canvas)=>{

      if(err){

        console.error(err);

        return;

      }

      const qr =
        document
        .getElementById("qr");

      qr.innerHTML = "";

      qr.appendChild(canvas);

    }

  );

  document
  .getElementById("info")
  .innerText =

    "Expires: " +

    new Date(
      data.expiresAt
    ).toLocaleString();

}

//
// SAVE SETTINGS
//
window.saveSettings =
async function(){

  const userId =
    document
    .getElementById("staff")
    .value;

  if(!userId){

    alert(
      "Select staff"
    );

    return;

  }

  try{

    await setDoc(

      doc(
        db,
        "attendanceSettings",
        userId
      ),

      {

        userId,

        expectedClockIn:

          document
          .getElementById("clockIn")
          .value,

        expectedClockOut:

          document
          .getElementById("clockOut")
          .value,

        graceMinutes:

          Number(
            document
            .getElementById("grace")
            .value
          )

      }

    );

    alert(
      "Settings saved"
    );

  }

  catch(err){

    console.error(err);

    alert(
      "Failed saving settings"
    );

  }

};

//
// RESET DEVICE
//
window.resetDevice =
async function(){

  const userId =
    document
    .getElementById("staff")
    .value;

  if(!userId){

    alert(
      "Select user"
    );

    return;

  }

  try{

    const snap =
      await getDocs(
        collection(db,"users")
      );

    let docId = null;

    snap.forEach(docSnap => {

      const u =
        docSnap.data();

      if(u.userId === userId){

        docId =
          docSnap.id;

      }

    });

    if(!docId){

      alert(
        "User not found"
      );

      return;

    }

    await updateDoc(

      doc(
        db,
        "users",
        docId
      ),

      {
        primaryDevice:null
      }

    );

    alert(
      "Device reset successful"
    );

  }

  catch(err){

    console.error(err);

    alert(
      "Reset failed"
    );

  }

};

//
// LOAD EXISTING QR
//
reprintQR();

</script>

</body>
</html>
