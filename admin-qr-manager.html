<!DOCTYPE html>
<html>
<head>
  <title>TEF Attendance Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    :root{
      --maroon:#800000;
      --pink:#ffc0cb;
      --bg:#0b0b0f;
      --card:rgba(255,255,255,0.06);
      --text:#fff;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:system-ui;
      background:radial-gradient(circle at top,#1a0010,var(--bg));
      color:white;
      padding:20px;
      min-height:100vh;
    }

    h2{
      text-align:center;
      color:var(--pink);
      margin-bottom:20px;
      font-size:28px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .card{
      background:var(--card);
      padding:20px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    .card h3{
      margin-top:0;
      color:var(--pink);
    }

    input,select{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      background:rgba(255,255,255,0.08);
      color:white;
      outline:none;
      font-size:15px;
    }

    button{
      width:100%;
      padding:13px;
      margin-top:12px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      transition:0.2s;
      font-size:15px;
    }

    button:hover{
      transform:translateY(-2px);
    }

    .green{
      background:linear-gradient(135deg,#27ae60,var(--pink));
      color:white;
    }

    .blue{
      background:linear-gradient(135deg,#2980b9,var(--pink));
      color:white;
    }

    .red{
      background:linear-gradient(135deg,#c0392b,var(--maroon));
      color:white;
    }

    #qrPrintArea{
      margin-top:20px;
      background:white;
      border-radius:20px;
      padding:30px 20px;
      text-align:center;
      color:black;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      min-height:420px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    #qr{
      display:flex;
      justify-content:center;
      align-items:center;
      margin:20px 0;
    }

    #qr canvas{
      border-radius:16px;
      background:white;
      padding:12px;
    }

    .tef-title{
      font-size:28px;
      font-weight:900;
      color:var(--maroon);
      margin-bottom:5px;
    }

    .tef-sub{
      font-size:15px;
      opacity:0.7;
      margin-bottom:20px;
    }

    .info{
      margin-top:10px;
      font-size:14px;
      color:#444;
      text-align:center;
    }

    .print-note{
      margin-top:15px;
      font-size:13px;
      color:#666;
    }

    @media(max-width:768px){
      .grid{
        grid-template-columns:1fr;
      }
    }

    /* PRINT STYLES */
    @media print {

      body{
        background:white !important;
        padding:0;
        margin:0;
      }

      body *{
        visibility:hidden;
      }

      #qrPrintArea,
      #qrPrintArea *{
        visibility:visible;
      }

      #qrPrintArea{
        position:fixed;
        left:0;
        top:0;
        width:100vw;
        height:100vh;
        background:white !important;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        border:none;
        border-radius:0;
        box-shadow:none;
        margin:0;
        padding:0;
      }

      #qr canvas{
        width:420px !important;
        height:420px !important;
      }

      .tef-title{
        font-size:38px;
      }

      .tef-sub{
        font-size:18px;
      }

      .info{
        font-size:16px;
      }

      .print-note{
        font-size:14px;
      }
    }
  </style>
</head>

<body>

<h2>TEF Attendance Control Panel</h2>

<div class="grid">

  <!-- QR SYSTEM -->
  <div class="card">

    <h3>QR System</h3>

    <label>Valid Hours</label>
    <input type="number" id="hours" value="6">

    <button class="green" onclick="generateQR()">
      Generate New QR
    </button>

    <button class="blue" onclick="reprintQR()">
      Reprint QR
    </button>

    <button class="blue" onclick="printQR()">
      Print / Save PDF
    </button>

    <!-- PRINT AREA -->
    <div id="qrPrintArea">

      <div class="tef-title">
        TYNECEPLOH EDUCATIONAL FOUNDATION
      </div>

      <div class="tef-sub">
        Official Attendance QR Code
      </div>

      <div id="qr"></div>

      <div class="info" id="info">
        No QR generated yet
      </div>

      <div class="print-note">
        Scan this QR for attendance verification
      </div>

    </div>

  </div>

  <!-- STAFF SETTINGS -->
  <div class="card">

    <h3>Staff Settings</h3>

    <select id="staff">
      <option value="">Loading staff...</option>
    </select>

    <label>Clock In</label>
    <input type="time" id="clockIn">

    <label>Clock Out</label>
    <input type="time" id="clockOut">

    <label>Grace (mins)</label>
    <input type="number" id="grace" value="10">

    <button class="green" onclick="saveSettings()">
      Save Settings
    </button>

    <button class="red" onclick="resetDevice()">
      Reset Device
    </button>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  getDocs,
  collection,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

/* ---------------- LOAD STAFF ---------------- */

async function loadStaff(){

  const select = document.getElementById("staff");

  select.innerHTML =
    `<option value="">Select Staff</option>`;

  try{

    const snap = await getDocs(collection(db,"users"));

    snap.forEach(d => {

      const u = d.data();

      if(u.role && u.role.toLowerCase() !== "student"){

        const opt = document.createElement("option");

        opt.value = u.userId;
        opt.textContent =
          `${u.name} (${u.role})`;

        select.appendChild(opt);
      }

    });

  }catch(err){

    console.error(err);
    alert("Failed loading staff");

  }

}

loadStaff();

/* ---------------- LOAD SETTINGS ---------------- */

document.getElementById("staff")
.addEventListener("change", async function(){

  const id = this.value;

  if(!id) return;

  try{

    const snap =
      await getDoc(doc(db,"attendanceSettings",id));

    if(snap.exists()){

      const s = snap.data();

      clockIn.value =
        s.expectedClockIn || "";

      clockOut.value =
        s.expectedClockOut || "";

      grace.value =
        s.graceMinutes || 10;

    }else{

      clockIn.value = "";
      clockOut.value = "";
      grace.value = 10;

    }

  }catch(err){

    console.error(err);
    alert("Failed loading settings");

  }

});

/* ---------------- QR GENERATION ---------------- */

window.generateQR = async function(){

  try{

    const hours =
      Number(document.getElementById("hours").value);

    const now = Date.now();

    const data = {
      token: "TEF-" + now,
      createdAt: now,
      expiresAt: now + (hours * 3600000)
    };

    await setDoc(
      doc(db,"attendanceSystem","mainQR"),
      data
    );

    renderQR(data);

    alert("QR generated successfully");

  }catch(err){

    console.error(err);
    alert("QR generation failed");

  }

};

/* ---------------- REPRINT QR ---------------- */

window.reprintQR = async function(){

  try{

    const snap =
      await getDoc(doc(db,"attendanceSystem","mainQR"));

    if(!snap.exists())
      return;

    renderQR(snap.data());

  }catch(err){

    console.error(err);
    alert("Failed loading QR");

  }

};

/* ---------------- QR RENDER ---------------- */

function renderQR(data){

  QRCode.toCanvas(
    JSON.stringify(data),
    {
      width:320
    },

    (err, canvas)=>{

      if(err){
        console.error(err);
        return;
      }

      const qr =
        document.getElementById("qr");

      qr.innerHTML = "";

      qr.appendChild(canvas);

    }
  );

  document.getElementById("info").innerText =
    "Expires: " +
    new Date(data.expiresAt).toLocaleString();

}

/* ---------------- PRINT QR ---------------- */

window.printQR = function(){

  window.print();

};

/* ---------------- SAVE SETTINGS ---------------- */

window.saveSettings = async function(){

  const id =
    document.getElementById("staff").value;

  if(!id)
    return alert("Select staff");

  try{

    await setDoc(
      doc(db,"attendanceSettings",id),
      {
        userId:id,
        expectedClockIn:clockIn.value,
        expectedClockOut:clockOut.value,
        graceMinutes:Number(grace.value)
      }
    );

    alert("Settings saved");

  }catch(err){

    console.error(err);
    alert("Failed saving settings");

  }

};

/* ---------------- RESET DEVICE ---------------- */

window.resetDevice = async function(){

  const id =
    document.getElementById("staff").value;

  if(!id)
    return alert("Select user");

  try{

    const snap =
      await getDocs(collection(db,"users"));

    let docId = null;

    snap.forEach(d=>{

      const u = d.data();

      if(u.userId === id)
        docId = d.id;

    });

    if(!docId)
      return alert("User not found");

    await updateDoc(
      doc(db,"users",docId),
      {
        primaryDevice:null
      }
    );

    alert("Device reset successful");

  }catch(err){

    console.error(err);
    alert("Reset failed");

  }

};

reprintQR();

</script>

</body>
</html>
