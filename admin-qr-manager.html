<!DOCTYPE html>
<html>
<head>
  <title>TEF Attendance Control</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    h2{
      text-align:center;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    input, select{
      width:100%;
      padding:10px;
      margin-top:8px;
      box-sizing:border-box;
    }

    button{
      padding:10px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      margin-top:10px;
      font-weight:bold;
    }

    .green{
      background:#27ae60;
      color:white;
    }

    .blue{
      background:#2980b9;
      color:white;
    }

    #qrcode{
      margin-top:20px;
      text-align:center;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10px;
    }

    th, td{
      border:1px solid #ddd;
      padding:8px;
      text-align:center;
      font-size:13px;
    }

    th{
      background:#eee;
    }

    .late{
      color:#e67e22;
      font-weight:bold;
    }

    .good{
      color:#27ae60;
      font-weight:bold;
    }
  </style>
</head>

<body>

<h2>Attendance Control Center</h2>

<div class="grid">

  <!-- QR -->
  <div class="card">

    <h3>Attendance QR</h3>

    <button class="green" onclick="generateQR()">
      Generate / Refresh QR
    </button>

    <div id="qrcode"></div>

  </div>

  <!-- RULES -->
  <div class="card">

    <h3>Role Expected Times</h3>

    <select id="role">
      <option value="teacher">Teacher</option>
      <option value="security">Security</option>
      <option value="janitor">Janitor</option>
      <option value="coordinator">Coordinator</option>
      <option value="admin">Admin</option>
    </select>

    <input type="time" id="clockIn">
    <input type="time" id="clockOut">

    <button class="blue" onclick="saveRules()">
      Save Rules
    </button>

  </div>

</div>

<!-- LIVE -->
<div class="card" style="margin-top:20px;">

  <h3>Live Attendance</h3>

  <table>

    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Clock-In</th>
        <th>Clock-Out</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="logs"></tbody>

  </table>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  setDoc,
  doc,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

//
// QR GENERATOR
//
window.generateQR = async function(){

  const qrData = {
    type:"attendance",
    token:"TEF-" + Date.now()
  };

  await setDoc(
    doc(db,"attendanceSystem","mainQR"),
    qrData
  );

  document.getElementById("qrcode").innerHTML = "";

  QRCode.toCanvas(
    JSON.stringify(qrData),
    { width:250 },
    function(err, canvas){

      if(err){
        console.error(err);
        return;
      }

      document.getElementById("qrcode")
        .appendChild(canvas);

    }
  );

};


//
// SAVE RULES
//
window.saveRules = async function(){

  const role = document.getElementById("role").value;

  const expectedClockIn =
    document.getElementById("clockIn").value;

  const expectedClockOut =
    document.getElementById("clockOut").value;

  await setDoc(
    doc(db,"attendanceRules",role),
    {
      role,
      expectedClockIn,
      expectedClockOut,
      updatedAt:Date.now()
    }
  );

  alert("Rules saved");

};


//
// LIVE ATTENDANCE
//
const today =
  new Date().toISOString().split("T")[0];

onSnapshot(
  collection(db,"attendanceDaily"),
  snap => {

    const rows = [];

    snap.forEach(d => {

      const r = d.data();

      if(r.date !== today) return;

      rows.push(`
        <tr>

          <td>${r.name}</td>

          <td>${r.role}</td>

          <td>
            ${
              r.clockIn?.time
              ? new Date(r.clockIn.time)
                  .toLocaleTimeString()
              : "-"
            }
          </td>

          <td>
            ${
              r.clockOut?.time
              ? new Date(r.clockOut.time)
                  .toLocaleTimeString()
              : "-"
            }
          </td>

          <td class="${
            r.clockIn?.status === "LATE"
            ? "late"
            : "good"
          }">

            ${
              r.clockIn?.status || "PRESENT"
            }

          </td>

        </tr>
      `);

    });

    document.getElementById("logs")
      .innerHTML = rows.join("");

  }
);

</script>

</body>
</html>
