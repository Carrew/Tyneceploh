<!DOCTYPE html>
<html>
<head>
<title>TEF Attendance Control</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{font-family:sans-serif;background:#f4f4f4;padding:20px}
h2{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
input,select{width:100%;padding:10px;margin-top:10px}
button{padding:10px;border:none;border-radius:6px;margin-top:10px;cursor:pointer;font-weight:bold}
.green{background:#27ae60;color:#fff}
.blue{background:#2980b9;color:#fff}
.red{background:#c0392b;color:#fff}
#qr{text-align:center;margin-top:15px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:13px}
th{background:#eee}
</style>
</head>

<body>

<h2>Attendance Admin Control</h2>

<div class="grid">

<div class="card">
<h3>QR Generator</h3>

<input type="number" id="hours" value="6">

<button class="green" onclick="generateQR()">Generate QR</button>
<button class="blue" onclick="reprintQR()">Reprint QR</button>

<div id="qr"></div>
<p id="info"></p>
</div>

<div class="card">
<h3>Staff Settings</h3>

<select id="staff"></select>

<input type="time" id="in">
<input type="time" id="out">
<input type="number" id="grace" value="10">

<button class="green" onclick="save()">Save</button>
<button class="red" onclick="resetDevice()">Reset Device</button>

</div>

</div>

<div class="card" style="margin-top:20px">
<h3>Live Attendance</h3>
<table>
<thead>
<tr><th>Name</th><th>Role</th><th>In</th><th>Status</th><th>Out</th></tr>
</thead>
<tbody id="log"></tbody>
</table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
authDomain:"tyneceploh.firebaseapp.com",
projectId:"tyneceploh"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const user=JSON.parse(localStorage.getItem("user"));
if(!user||user.role!=="admin") location.href="login.html";

window.generateQR=async()=>{
const h=Number(hours.value);
const now=Date.now();

const qr={
token:"TEF-"+now,
createdAt:now,
expiresAt:now+(h*3600000)
};

await setDoc(doc(db,"attendanceSystem","mainQR"),qr);

QRCode.toCanvas(JSON.stringify(qr),{width:220},(e,c)=>{
if(!e){qr.innerCanvas=c;document.getElementById("qr").innerHTML="";document.getElementById("qr").appendChild(c);}
});

info.innerText="Expires: "+new Date(qr.expiresAt).toLocaleString();
};

window.reprintQR=async()=>{
const d=await getDoc(doc(db,"attendanceSystem","mainQR"));
if(d.exists()){
QRCode.toCanvas(JSON.stringify(d.data()),{width:220},(e,c)=>{
document.getElementById("qr").innerHTML="";document.getElementById("qr").appendChild(c);
});
}
};

window.save=async()=>{
await setDoc(doc(db,"attendanceSettings",staff.value),{
userId:staff.value,
expectedClockIn:in.value,
expectedClockOut:out.value,
graceMinutes:Number(grace.value)
});
alert("Saved");
};

window.resetDevice=async()=>{
const ref=doc(db,"teachers",staff.value);
await updateDoc(ref,{primaryDevice:null});
alert("Device reset");
};

onSnapshot(collection(db,"attendanceDaily"),snap=>{
let rows="";
snap.forEach(d=>{
const x=d.data();
if(x.date!==new Date().toISOString().split("T")[0])return;

rows+=`
<tr>
<td>${x.name}</td>
<td>${x.role}</td>
<td>${x.clockIn?new Date(x.clockIn.time).toLocaleTimeString():"-"}</td>
<td>${x.clockIn?.status||"-"}</td>
<td>${x.clockOut?new Date(x.clockOut.time).toLocaleTimeString():"-"}</td>
</tr>`;
});
log.innerHTML=rows;
});
</script>

</body>
</html>
