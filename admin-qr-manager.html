<!DOCTYPE html>
<html>
<head>
  <title>TEF Attendance Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    :root{
      --maroon:#800000;
      --pink:#ffc0cb;
      --bg:#0b0b0f;
      --card:rgba(255,255,255,0.06);
      --text:#fff;
    }

    body{
      margin:0;
      font-family:system-ui;
      background:radial-gradient(circle at top,#1a0010,var(--bg));
      color:white;
      padding:20px;
    }

    h2{
      text-align:center;
      color:var(--pink);
      margin-bottom:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .card{
      background:var(--card);
      padding:20px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
    }

    input,select{
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:8px;
      border:none;
      background:rgba(255,255,255,0.08);
      color:white;
      outline:none;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      transition:0.2s;
    }

    button:hover{
      transform:translateY(-2px);
    }

    .green{ background:linear-gradient(135deg,#27ae60,var(--pink)); color:white; }
    .blue{ background:linear-gradient(135deg,#2980b9,var(--pink)); color:white; }
    .red{ background:linear-gradient(135deg,#c0392b,var(--maroon)); color:white; }

    #qr{
      margin-top:15px;
      text-align:center;
      background:rgba(255,255,255,0.05);
      padding:15px;
      border-radius:12px;
    }

    .info{
      text-align:center;
      margin-top:10px;
      font-size:13px;
      opacity:0.8;
    }

    @media(max-width:768px){
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>

<body>

<h2>TEF Attendance Control Panel</h2>

<div class="grid">

  <!-- QR SYSTEM -->
  <div class="card">
    <h3>QR System</h3>

    <label>Valid Hours</label>
    <input type="number" id="hours" value="6">

    <button class="green" onclick="generateQR()">Generate New QR</button>
    <button class="blue" onclick="reprintQR()">Reprint QR</button>

    <div id="qr"></div>
    <div class="info" id="info">No QR generated yet</div>
  </div>

  <!-- STAFF SETTINGS -->
  <div class="card">
    <h3>Staff Settings</h3>

    <select id="staff">
      <option value="">Loading staff...</option>
    </select>

    <label>Clock In</label>
    <input type="time" id="clockIn">

    <label>Clock Out</label>
    <input type="time" id="clockOut">

    <label>Grace (mins)</label>
    <input type="number" id="grace" value="10">

    <button class="green" onclick="saveSettings()">Save Settings</button>
    <button class="red" onclick="resetDevice()">Reset Device</button>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  getDocs,
  collection,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

/* ---------------- LOAD STAFF ---------------- */
async function loadStaff(){

  const select = document.getElementById("staff");
  select.innerHTML = `<option value="">Select Staff</option>`;

  try{

    const snap = await getDocs(collection(db,"users"));

    snap.forEach(d => {
      const u = d.data();

      if(u.role && u.role.toLowerCase() !== "student"){
        const opt = document.createElement("option");
        opt.value = u.userId;
        opt.textContent = `${u.name} (${u.role})`;
        select.appendChild(opt);
      }
    });

  }catch(err){
    console.error(err);
    alert("Failed loading staff");
  }
}

loadStaff();

/* ---------------- LOAD SETTINGS ---------------- */
document.getElementById("staff").addEventListener("change", async function(){

  const id = this.value;
  if(!id) return;

  try{

    const snap = await getDoc(doc(db,"attendanceSettings",id));

    if(snap.exists()){
      const s = snap.data();
      clockIn.value = s.expectedClockIn || "";
      clockOut.value = s.expectedClockOut || "";
      grace.value = s.graceMinutes || 10;
    } else {
      clockIn.value = "";
      clockOut.value = "";
      grace.value = 10;
    }

  }catch(err){
    console.error(err);
    alert("Failed loading settings");
  }

});

/* ---------------- QR GENERATION ---------------- */
window.generateQR = async function(){

  try{

    const hours = Number(document.getElementById("hours").value);
    const now = Date.now();

    const data = {
      token: "TEF-" + now,
      createdAt: now,
      expiresAt: now + (hours * 3600000)
    };

    await setDoc(doc(db,"attendanceSystem","mainQR"), data);

    renderQR(data);

    alert("QR generated successfully");

  }catch(err){
    console.error(err);
    alert("QR generation failed");
  }
};

window.reprintQR = async function(){

  try{

    const snap = await getDoc(doc(db,"attendanceSystem","mainQR"));

    if(!snap.exists()) return alert("No QR available");

    renderQR(snap.data());

  }catch(err){
    console.error(err);
    alert("Failed loading QR");
  }
};

/* ---------------- QR RENDER ---------------- */
function renderQR(data){

  QRCode.toCanvas(JSON.stringify(data), { width:220 }, (err, canvas)=>{

    if(err){
      console.error(err);
      return;
    }

    const qr = document.getElementById("qr");
    qr.innerHTML = "";
    qr.appendChild(canvas);
  });

  document.getElementById("info").innerText =
    "Expires: " + new Date(data.expiresAt).toLocaleString();
}

/* ---------------- SAVE SETTINGS ---------------- */
window.saveSettings = async function(){

  const id = document.getElementById("staff").value;
  if(!id) return alert("Select staff");

  try{

    await setDoc(doc(db,"attendanceSettings",id),{
      userId:id,
      expectedClockIn:clockIn.value,
      expectedClockOut:clockOut.value,
      graceMinutes:Number(grace.value)
    });

    alert("Settings saved");

  }catch(err){
    console.error(err);
    alert("Failed saving settings");
  }
};

/* ---------------- RESET DEVICE ---------------- */
window.resetDevice = async function(){

  const id = document.getElementById("staff").value;
  if(!id) return alert("Select user");

  try{

    const snap = await getDocs(collection(db,"users"));

    let docId = null;

    snap.forEach(d=>{
      const u = d.data();
      if(u.userId === id) docId = d.id;
    });

    if(!docId) return alert("User not found");

    await updateDoc(doc(db,"users",docId),{
      primaryDevice:null
    });

    alert("Device reset successful");

  }catch(err){
    console.error(err);
    alert("Reset failed");
  }
};

reprintQR();

</script>

</body>
</html>
