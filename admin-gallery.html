<!DOCTYPE html>
<html>
<head>
  <title>Gallery Admin - TEF</title>

  <style>
    body {
      font-family: system-ui;
      background: #0b0b0f;
      color: white;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      backdrop-filter: blur(10px);
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: linear-gradient(135deg, #800000, #ffc0cb);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #27ae60;
      padding: 10px 15px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>

<body>

<h2>📸 Gallery Admin Panel</h2>

<div class="card">
  <h3>Create Group</h3>
  <input id="groupName" placeholder="Group name (e.g. Sports Day)">
  <button onclick="createGroup()">Create Group</button>
</div>

<div class="card">
  <h3>Upload Images</h3>

  <select id="groupSelect"></select>
  <input type="file" id="images" multiple>
  <button onclick="uploadImages()">Upload</button>
</div>

<div class="card">
  <h3>Group Images</h3>
  <div id="gallery" class="grid"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"YOUR_KEY",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

function toast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=> t.style.display="none", 3000);
}

// upload to cloudinary
async function upload(file){
  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", "Tyneceploh");

  const res = await fetch("https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload", {
    method: "POST",
    body: form
  });

  const data = await res.json();
  return data.secure_url;
}

// LOAD GROUPS
async function loadGroups(){
  const snap = await getDocs(collection(db,"galleryGroups"));
  const select = document.getElementById("groupSelect");

  select.innerHTML = snap.docs.map(d =>
    `<option value="${d.id}">${d.data().name}</option>`
  ).join("");

  loadImages();
}

// CREATE GROUP
window.createGroup = async function(){
  const name = document.getElementById("groupName").value;
  if(!name) return toast("Enter group name");

  await addDoc(collection(db,"galleryGroups"),{
    name,
    createdAt: Date.now()
  });

  toast("Group created");
  loadGroups();
};

// UPLOAD IMAGES
window.uploadImages = async function(){
  const files = document.getElementById("images").files;
  const groupId = document.getElementById("groupSelect").value;

  if(!files.length) return toast("No images selected");

  for(let f of files){
    const url = await upload(f);

    await addDoc(collection(db,"galleryImages"),{
      groupId,
      imageUrl: url,
      createdAt: Date.now()
    });
  }

  toast("Images uploaded");
  loadImages();
};

// LOAD IMAGES
async function loadImages(){
  const groupId = document.getElementById("groupSelect").value;
  const snap = await getDocs(collection(db,"galleryImages"));

  const filtered = snap.docs
    .map(d => ({id:d.id, ...d.data()}))
    .filter(i => i.groupId === groupId);

  document.getElementById("gallery").innerHTML =
    filtered.map(i => `
      <div>
        <img src="${i.imageUrl}">
      </div>
    `).join("");
}

window.loadImages = loadImages;

loadGroups();

</script>

</body>
</html>
