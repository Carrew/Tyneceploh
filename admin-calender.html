<!DOCTYPE html>
<html>
<head>
  <title>TEF Academic Calendar Admin</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <style>

    body{
      margin:0;
      padding:20px;
      background:#f4f4f4;
      font-family:sans-serif;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    .box{
      background:white;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }

    h2{
      margin-top:0;
    }

    input,
    select,
    textarea,
    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    button{
      background:#27ae60;
      color:white;
      border:none;
      cursor:pointer;
      font-weight:bold;
    }

    .session-card,
    .event-card{
      background:#fafafa;
      padding:15px;
      border-radius:10px;
      margin-top:15px;
      border-left:6px solid #3498db;
    }

    .active{
      border-left-color:#27ae60;
    }

    .badge{
      display:inline-block;
      padding:5px 12px;
      border-radius:20px;
      color:white;
      font-size:12px;
      font-weight:bold;
      margin-top:10px;
    }

    .active-badge{
      background:#27ae60;
    }

    .inactive-badge{
      background:#7f8c8d;
    }

    .Holiday{ background:#e74c3c; }
    .Exam{ background:#8e44ad; }
    .Sports{ background:#27ae60; }
    .Meeting{ background:#2980b9; }
    .Academic{ background:#f39c12; }
    .Deadline{ background:#d35400; }
    .Celebration{ background:#16a085; }
    .Emergency{ background:#2c3e50; }
    .Other{ background:#7f8c8d; }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .actions{
      margin-top:15px;
      display:flex;
      gap:10px;
    }

    .danger{
      background:#c0392b;
    }

    .blue{
      background:#2980b9;
    }

    .msg{
      margin-top:15px;
      padding:12px;
      border-radius:6px;
    }

    .ok{
      background:#d4edda;
      color:#155724;
    }

    .bad{
      background:#f8d7da;
      color:#721c24;
    }

    @media(max-width:700px){

      .row{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>

<body>

<div class="container">

  <!-- SESSION CREATOR -->

  <div class="box">

    <h2>Academic Session Manager</h2>

    <input type="hidden" id="sessionEditId">

    <label>Academic Session Name</label>

    <input id="sessionName"
           placeholder="2026 / 2027">

    <div class="row">

      <div>

        <label>Start Date</label>

        <input type="date"
               id="sessionStart">

      </div>

      <div>

        <label>End Date</label>

        <input type="date"
               id="sessionEnd">

      </div>

    </div>

    <button onclick="saveSession()">
      Save Academic Session
    </button>

    <div id="sessionMsg"></div>

  </div>

  <!-- EVENT CREATOR -->

  <div class="box">

    <h2>Calendar Event Builder</h2>

    <input type="hidden" id="eventEditId">

    <label>Select Academic Session</label>

    <select id="eventSession"></select>

    <label>Event Title</label>

    <input id="eventTitle">

    <label>Description</label>

    <textarea id="eventDescription"></textarea>

    <label>Category</label>

    <select id="eventCategory">

      <option>Holiday</option>
      <option>Exam</option>
      <option>Sports</option>
      <option>Meeting</option>
      <option>Academic</option>
      <option>Deadline</option>
      <option>Celebration</option>
      <option>Emergency</option>
      <option>Other</option>

    </select>

    <div class="row">

      <div>

        <label>Start Date</label>

        <input type="date"
               id="eventStart">

      </div>

      <div>

        <label>End Date</label>

        <input type="date"
               id="eventEnd">

      </div>

    </div>

    <button onclick="saveEvent()">
      Save Calendar Event
    </button>

    <div id="eventMsg"></div>

  </div>

  <!-- SESSIONS -->

  <div class="box">

    <h2>Academic Sessions</h2>

    <div id="sessions">
      Loading...
    </div>

  </div>

  <!-- EVENTS -->

  <div class="box">

    <h2>Calendar Events</h2>

    <div id="events">
      Loading...
    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  query,
  orderBy

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({

  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"

});

const db = getFirestore(app);

const user =
  JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

let sessionsCache = [];
let eventsCache = [];

// -----------------------------------
// LOAD EVERYTHING
// -----------------------------------
async function loadData(){

  await loadSessions();

  await loadEvents();

}

loadData();

// -----------------------------------
// LOAD SESSIONS
// -----------------------------------
async function loadSessions(){

  const snap =
    await getDocs(
      query(
        collection(db,"academicSessions"),
        orderBy("createdAt","desc")
      )
    );

  sessionsCache = [];

  snap.forEach(d=>{

    sessionsCache.push({
      docId:d.id,
      ...d.data()
    });

  });

  renderSessions();

  renderSessionDropdown();

}

// -----------------------------------
// SESSION DROPDOWN
// -----------------------------------
function renderSessionDropdown(){

  const box =
    document.getElementById("eventSession");

  if(sessionsCache.length === 0){

    box.innerHTML =
      `<option>No Sessions</option>`;

    return;
  }

  box.innerHTML =
    sessionsCache.map(s=>`

      <option value="${s.name}">
        ${s.name}
      </option>

    `).join("");

}

// -----------------------------------
// RENDER SESSIONS
// -----------------------------------
function renderSessions(){

  const container =
    document.getElementById("sessions");

  if(sessionsCache.length === 0){

    container.innerHTML =
      "<p>No sessions yet.</p>";

    return;
  }

  container.innerHTML =
    sessionsCache.map(s=>`

      <div class="
        session-card
        ${s.active ? "active" : ""}
      ">

        <h3>${s.name}</h3>

        <div class="
          badge
          ${s.active
            ? "active-badge"
            : "inactive-badge"}
        ">
          ${s.active
            ? "ACTIVE SESSION"
            : "INACTIVE"}
        </div>

        <p>

          <b>Start:</b>
          ${s.startDate}

          <br><br>

          <b>End:</b>
          ${s.endDate}

        </p>

        <div class="actions">

          <button
            class="blue"
            onclick="activateSession('${s.docId}')"
          >
            Set Active
          </button>

          <button
            class="danger"
            onclick="deleteSession('${s.docId}')"
          >
            Delete
          </button>

        </div>

      </div>

    `).join("");

}

// -----------------------------------
// SAVE SESSION
// -----------------------------------
window.saveSession = async function(){

  const name =
    sessionName.value.trim();

  const start =
    sessionStart.value;

  const end =
    sessionEnd.value;

  if(
    !name ||
    !start ||
    !end
  ){
    return showSessionMsg(
      "Fill all fields",
      "bad"
    );
  }

  try{

    await addDoc(
      collection(db,"academicSessions"),
      {

        name,
        startDate:start,
        endDate:end,

        active:false,

        createdAt:Date.now(),
        createdBy:user.userId

      }
    );

    sessionName.value = "";
    sessionStart.value = "";
    sessionEnd.value = "";

    showSessionMsg(
      "Session created",
      "ok"
    );

    loadSessions();

  }catch(err){

    console.error(err);

    showSessionMsg(
      "Failed to create session",
      "bad"
    );

  }

};

// -----------------------------------
// ACTIVATE SESSION
// -----------------------------------
window.activateSession =
async function(id){

  try{

    // REMOVE ACTIVE FROM ALL
    for(const s of sessionsCache){

      await updateDoc(
        doc(db,"academicSessions",s.docId),
        {
          active:false
        }
      );

    }

    // SET TARGET ACTIVE
    await updateDoc(
      doc(db,"academicSessions",id),
      {
        active:true
      }
    );

    loadSessions();

  }catch(err){

    console.error(err);

  }

};

// -----------------------------------
// DELETE SESSION
// -----------------------------------
window.deleteSession =
async function(id){

  const ok =
    confirm(
      "Delete session?"
    );

  if(!ok) return;

  await deleteDoc(
    doc(db,"academicSessions",id)
  );

  loadSessions();

};

// -----------------------------------
// LOAD EVENTS
// -----------------------------------
async function loadEvents(){

  const snap =
    await getDocs(
      query(
        collection(db,"schoolCalendar"),
        orderBy("startDate","asc")
      )
    );

  eventsCache = [];

  snap.forEach(d=>{

    eventsCache.push({
      docId:d.id,
      ...d.data()
    });

  });

  renderEvents();

}

// -----------------------------------
// SAVE EVENT
// -----------------------------------
window.saveEvent = async function(){

  const session =
    eventSession.value;

  const title =
    eventTitle.value.trim();

  const description =
    eventDescription.value.trim();

  const category =
    eventCategory.value;

  const start =
    eventStart.value;

  const end =
    eventEnd.value;

  if(
    !session ||
    !title ||
    !start ||
    !end
  ){
    return showEventMsg(
      "Fill all required fields",
      "bad"
    );
  }

  try{

    await addDoc(
      collection(db,"schoolCalendar"),
      {

        session,

        title,
        description,
        category,

        startDate:start,
        endDate:end,

        visibility:"public",
        status:"active",

        createdBy:user.userId,
        createdAt:Date.now()

      }
    );

    eventTitle.value = "";
    eventDescription.value = "";
    eventStart.value = "";
    eventEnd.value = "";

    showEventMsg(
      "Event created",
      "ok"
    );

    loadEvents();

  }catch(err){

    console.error(err);

    showEventMsg(
      "Failed to create event",
      "bad"
    );

  }

};

// -----------------------------------
// RENDER EVENTS
// -----------------------------------
function renderEvents(){

  const container =
    document.getElementById("events");

  if(eventsCache.length === 0){

    container.innerHTML =
      "<p>No events found.</p>";

    return;
  }

  container.innerHTML =
    eventsCache.map(e=>`

      <div class="event-card">

        <h3>${e.title}</h3>

        <div class="
          badge
          ${e.category}
        ">
          ${e.category}
        </div>

        <p style="margin-top:15px;">

          <b>Session:</b>
          ${e.session}

          <br><br>

          ${
            e.description ||
            "No description"
          }

        </p>

        <b>Start:</b>
        ${e.startDate}

        <br><br>

        <b>End:</b>
        ${e.endDate}

      </div>

    `).join("");

}

// -----------------------------------
// MESSAGES
// -----------------------------------
function showSessionMsg(text,type){

  const box =
    document.getElementById("sessionMsg");

  box.className =
    "msg " + type;

  box.textContent = text;

}

function showEventMsg(text,type){

  const box =
    document.getElementById("eventMsg");

  box.className =
    "msg " + type;

  box.textContent = text;

}

</script>

</body>
</html>
