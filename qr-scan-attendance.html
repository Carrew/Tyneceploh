<!DOCTYPE html>
<html>
<head>
  <title>TEF Attendance Scan</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
      text-align:center;
    }

    #reader{
      width:320px;
      margin:auto;
      background:white;
      border-radius:12px;
      overflow:hidden;
      border:2px solid #ddd;
    }

    .status{
      margin-top:20px;
      padding:15px;
      border-radius:10px;
      font-weight:bold;
      min-height:20px;
    }

    .ok{
      background:#d4edda;
      color:#155724;
    }

    .bad{
      background:#f8d7da;
      color:#721c24;
    }

    .info{
      background:#d1ecf1;
      color:#0c5460;
    }

  </style>
</head>

<body>

<h2>TEF Attendance Scanner</h2>

<div id="reader"></div>

<div id="status" class="status info">
  Waiting for scan...
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

//
// FIREBASE
//
const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

//
// USER
//
const user =
  JSON.parse(localStorage.getItem("user"));

if(!user){

  alert("Login required");

  location.href = "login.html";

}

//
// STUDENTS BLOCKED
//
if(user.role === "student"){

  alert("Students do not use attendance");

  location.href = "login.html";

}

console.log("Logged User:", user);

//
// DEVICE ID
//
const deviceId =
  btoa(
    navigator.userAgent +
    screen.width +
    screen.height
  );

console.log("Device ID:", deviceId);

//
// STATUS
//
function show(msg,type){

  const el =
    document.getElementById("status");

  el.innerText = msg;

  el.className =
    "status " + type;

}

//
// TIME DIFFERENCE
//
function getMinutesDifference(now,timeString){

  if(!timeString) return 0;

  const [h,m] =
    timeString.split(":").map(Number);

  const target =
    (h * 60) + m;

  const current =
    (now.getHours() * 60) +
    now.getMinutes();

  return current - target;

}

//
// MAIN PROCESS
//
async function processScan(qrText){

  try{

    show("Checking QR...","info");

    console.log("QR RAW:", qrText);

    //
    // PARSE QR
    //
    let qr;

    try{

      qr = JSON.parse(qrText);

    }

    catch(e){

      console.error(e);

      throw new Error("Invalid QR");

    }

    console.log("QR Parsed:", qr);

    //
    // ACTIVE QR
    //
    const qrSnap =
      await getDoc(
        doc(db,"attendanceSystem","mainQR")
      );

    if(!qrSnap.exists()){

      throw new Error("QR not found");

    }

    const activeQR =
      qrSnap.data();

    console.log("Active QR:", activeQR);

    //
    // TOKEN MATCH
    //
    if(activeQR.token !== qr.token){

      throw new Error("QR mismatch");

    }

    //
    // EXPIRY
    //
    if(Date.now() > activeQR.expiresAt){

      throw new Error("QR expired");

    }

    //
    // FIND USER
    //
    show("Loading user...","info");

    const usersSnap =
      await getDocs(
        collection(db,"users")
      );

    let userDocId = null;

    let userData = null;

    usersSnap.forEach(docSnap => {

      const u =
        docSnap.data();

      console.log("Checking user:", u);

      if(u.userId === user.userId){

        userDocId =
          docSnap.id;

        userData =
          u;

      }

    });

    //
    // USER NOT FOUND
    //
    if(!userData){

      console.error("No user found");

      throw new Error("User missing");

    }

    console.log("Matched User:", userData);

    //
    // DEVICE CHECK
    //
    if(
      userData.primaryDevice &&
      userData.primaryDevice !== deviceId
    ){

      throw new Error(
        "Wrong device"
      );

    }

    //
    // REGISTER FIRST DEVICE
    //
    if(!userData.primaryDevice){

      console.log(
        "Registering first device"
      );

      await updateDoc(

        doc(
          db,
          "users",
          userDocId
        ),

        {
          primaryDevice:deviceId
        }

      );

    }

    //
    // SETTINGS
    //
    const settingsSnap =
      await getDoc(
        doc(
          db,
          "attendanceSettings",
          user.userId
        )
      );

    if(!settingsSnap.exists()){

      throw new Error(
        "Attendance settings missing"
      );

    }

    const settings =
      settingsSnap.data();

    console.log("Settings:", settings);

    //
    // TODAY
    //
    const today =
      new Date()
      .toISOString()
      .split("T")[0];

    //
    // DAILY DOC
    //
    const attendanceRef =
      doc(
        db,
        "attendanceDaily",
        user.userId + "_" + today
      );

    const attendanceSnap =
      await getDoc(attendanceRef);

    //
    // CURRENT TIME
    //
    const now =
      new Date();

    //
    // CLOCK IN
    //
    if(!attendanceSnap.exists()){

      console.log("Clocking In");

      const diff =
        getMinutesDifference(
          now,
          settings.expectedClockIn
        );

      let status = "ON_TIME";

      if(diff > settings.graceMinutes){

        status = "LATE";

      }

      if(diff < 0){

        status = "EARLY";

      }

      await setDoc(

        attendanceRef,

        {

          userId:user.userId,

          name:user.name,

          role:user.role,

          date:today,

          deviceId,

          clockIn:{

            time:Date.now(),

            status,

            minutes:
              Math.abs(diff)

          },

          clockOut:null,

          createdAt:Date.now()

        }

      );

      console.log("Clock In Saved");

      show(
        `Clock In Success (${status})`,
        "ok"
      );

      return;

    }

    //
    // ALREADY CLOCKED OUT
    //
    if(attendanceSnap.data().clockOut){

      throw new Error(
        "Attendance already completed"
      );

    }

    //
    // CLOCK OUT
    //
    console.log("Clocking Out");

    const diff =
      getMinutesDifference(
        now,
        settings.expectedClockOut
      );

    let status = "ON_TIME";

    if(diff < 0){

      status = "EARLY_EXIT";

    }

    if(diff > 0){

      status = "OVERTIME";

    }

    await updateDoc(

      attendanceRef,

      {

        clockOut:{

          time:Date.now(),

          status,

          minutes:
            Math.abs(diff)

        }

      }

    );

    console.log("Clock Out Saved");

    show(
      `Clock Out Success (${status})`,
      "ok"
    );

  }

  catch(err){

    console.error("SCAN ERROR:", err);

    show(err.message,"bad");

  }

}

//
// START SCANNER
//
const scanner =
  new Html5Qrcode("reader");

scanner.start(

  { facingMode:"environment" },

  {
    fps:10,
    qrbox:250
  },

  async(qrText)=>{

    scanner.pause();

    await processScan(qrText);

    setTimeout(
      ()=>scanner.resume(),
      3000
    );

  }

)

.catch(err=>{

  console.error("Camera Error:", err);

  show(
    "Camera access failed",
    "bad"
  );

});

</script>

</body>
</html>
