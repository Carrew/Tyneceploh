<!DOCTYPE html>
<html>
<head>
<title>Scan Attendance</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{font-family:sans-serif;background:#f4f4f4;text-align:center;padding:20px}
#reader{width:320px;margin:auto;background:#fff;border-radius:10px}
.status{margin-top:20px;padding:15px;border-radius:10px}
.ok{background:#d4edda}
.bad{background:#f8d7da}
.info{background:#d1ecf1}
</style>
</head>

<body>

<h2>Attendance Scan</h2>
<div id="reader"></div>
<div id="status" class="status info">Waiting...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
projectId:"tyneceploh"
});

const db=getFirestore(app);
const user=JSON.parse(localStorage.getItem("user"));
if(!user)location.href="login.html";

const device=btoa(navigator.userAgent+screen.width);

function status(msg,type){
statusBox.innerText=msg;
statusBox.className="status "+type;
}

async function run(qrText){
try{
const qr=JSON.parse(qrText);
const active=await getDoc(doc(db,"attendanceSystem","mainQR"));
if(!active.exists()||active.data().token!==qr.token) throw new Error("Invalid QR");
if(Date.now()>qr.expiresAt) throw new Error("Expired QR");

const ref=doc(db,"attendanceDaily",user.userId+"_"+new Date().toISOString().split("T")[0]);
const snap=await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
userId:user.userId,
name:user.name,
role:user.role,
clockIn:{time:Date.now(),status:"ON_TIME"},
deviceId:device,
date:new Date().toISOString().split("T")[0]
});
status("Clocked In","ok");
return;
}

if(snap.data().clockOut){
throw new Error("Already done today");
}

await updateDoc(ref,{
clockOut:{time:Date.now(),status:"DONE"}
});
status("Clocked Out","ok");

}catch(e){
status(e.message,"bad");
}
}

const scanner=new Html5Qrcode("reader");
scanner.start({facingMode:"environment"},{fps:10,qrbox:250},run);
</script>

</body>
</html>
