<!DOCTYPE html>
<html>
<head>
  <title>TEF Attendance Scan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    :root{
      --bg:#f4f4f4;
      --card:#ffffff;
      --text:#222;
      --muted:#666;
      --green:#27ae60;
      --red:#c0392b;
      --blue:#2980b9;
      --shadow:0 10px 25px rgba(0,0,0,0.08);
      --radius:14px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:sans-serif;
      background:var(--bg);
      text-align:center;
      padding:20px;
      color:var(--text);
    }

    .header{
      background:linear-gradient(135deg,#800000,#ff4d6d);
      color:white;
      padding:20px;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      margin-bottom:20px;
    }

    .header h2{
      margin:0;
      font-size:24px;
    }

    .header p{
      margin-top:8px;
      font-size:13px;
      opacity:0.9;
    }

    #reader{
      width:320px;
      margin:20px auto;
      background:white;
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      border:1px solid #eee;
    }

    .status{
      margin-top:20px;
      padding:14px;
      border-radius:12px;
      font-weight:bold;
      min-height:20px;
      transition:0.2s;
    }

    .ok{
      background:#d4edda;
      color:#155724;
    }

    .bad{
      background:#f8d7da;
      color:#721c24;
    }

    .info{
      background:#d1ecf1;
      color:#0c5460;
    }

    .pulse{
      animation:pulse 1.2s infinite;
    }

    @keyframes pulse{
      0%{transform:scale(1);}
      50%{transform:scale(1.02);}
      100%{transform:scale(1);}
    }

    .hint{
      margin-top:10px;
      font-size:12px;
      color:var(--muted);
    }

  </style>
</head>

<body>

<div class="header">
  <h2>TEF Attendance Scanner</h2>
  <p>Scan. Verify. Lock attendance instantly.</p>
</div>

<div id="reader"></div>

<div id="status" class="status info">
  Waiting for scan...
</div>

<div class="hint">
  Point camera at QR code. Keep it steady.
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  alert("Login required");
  location.href = "login.html";
}

if(user.role === "student"){
  alert("Students cannot scan attendance");
  location.href = "login.html";
}

const deviceId = btoa(navigator.userAgent + screen.width + screen.height);

function show(msg,type){

  const el = document.getElementById("status");

  el.innerText = msg;
  el.className = "status " + type;

  if(type === "ok"){
    el.classList.add("pulse");
    setTimeout(()=>el.classList.remove("pulse"),1200);
  }

}

function getMinutesDifference(now,timeString){

  if(!timeString) return 0;

  const [h,m] = timeString.split(":").map(Number);

  const target = (h*60)+m;
  const current = (now.getHours()*60)+now.getMinutes();

  return current - target;
}

async function processScan(qrText){

  try{

    show("Verifying QR code...","info");

    let qr;
    try{
      qr = JSON.parse(qrText);
    }catch{
      throw new Error("Invalid QR format");
    }

    const qrSnap = await getDoc(doc(db,"attendanceSystem","mainQR"));

    if(!qrSnap.exists()){
      throw new Error("QR system not active");
    }

    const activeQR = qrSnap.data();

    if(activeQR.token !== qr.token){
      throw new Error("QR not recognized");
    }

    if(Date.now() > activeQR.expiresAt){
      throw new Error("QR expired");
    }

    show("Loading profile...","info");

    const usersSnap = await getDocs(collection(db,"users"));

    let userDocId = null;
    let userData = null;

    usersSnap.forEach(d=>{
      const u = d.data();
      if(u.userId === user.userId){
        userDocId = d.id;
        userData = u;
      }
    });

    if(!userData){
      throw new Error("User not found");
    }

    if(userData.primaryDevice && userData.primaryDevice !== deviceId){
      throw new Error("Device mismatch");
    }

    if(!userData.primaryDevice){
      await updateDoc(doc(db,"users",userDocId),{
        primaryDevice:deviceId
      });
    }

    const settingsSnap = await getDoc(doc(db,"attendanceSettings",user.userId));

    if(!settingsSnap.exists()){
      throw new Error("No attendance settings found");
    }

    const settings = settingsSnap.data();

    const today = new Date().toISOString().split("T")[0];

    const ref = doc(db,"attendanceDaily",user.userId+"_"+today);

    const snap = await getDoc(ref);

    const now = new Date();

    // CLOCK IN
    if(!snap.exists()){

      const diff = getMinutesDifference(now,settings.expectedClockIn);

      let status = "ON_TIME";
      if(diff > settings.graceMinutes) status = "LATE";
      if(diff < 0) status = "EARLY";

      await setDoc(ref,{
        userId:user.userId,
        name:user.name,
        role:user.role,
        date:today,
        deviceId,
        clockIn:{
          time:Date.now(),
          status,
          minutes:Math.abs(diff)
        },
        clockOut:null,
        createdAt:Date.now()
      });

      show(`Clock In confirmed (${status})`,"ok");
      return;
    }

    if(snap.data().clockOut){
      throw new Error("Attendance already completed");
    }

    // CLOCK OUT
    const diff = getMinutesDifference(now,settings.expectedClockOut);

    let status = "ON_TIME";
    if(diff < 0) status = "EARLY_EXIT";
    if(diff > 0) status = "OVERTIME";

    await updateDoc(ref,{
      clockOut:{
        time:Date.now(),
        status,
        minutes:Math.abs(diff)
      }
    });

    show(`Clock Out confirmed (${status})`,"ok");

  }catch(err){
    show(err.message,"bad");
  }

}

const scanner = new Html5Qrcode("reader");

scanner.start(
  { facingMode:"environment" },
  { fps:10, qrbox:250 },
  async(qrText)=>{

    scanner.pause();

    await processScan(qrText);

    setTimeout(()=>scanner.resume(),2500);

  }
).catch(()=>{

  show("Camera blocked or unavailable","bad");

});

</script>

</body>
</html>
