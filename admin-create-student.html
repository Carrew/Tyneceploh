<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Management - TEF</title>

  <style>
    :root{
      --maroon:#800000;
      --pink:#ffc0cb;
      --bg:#0b0b0f;
      --card:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.1);
      --text:#ffffff;
      --muted:#bbbbbb;
      --success:#28c76f;
      --danger:#ff5a5f;
      --warning:#ffb020;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:system-ui;
      background:
        radial-gradient(circle at top,#2a0019 0%,#14000d 30%,#0b0b0f 100%);
      color:var(--text);
      min-height:100vh;
      padding:15px;
    }

    .container{
      width:100%;
      max-width:1200px;
      margin:auto;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    .title-wrap h1{
      font-size:clamp(1.8rem,4vw,2.8rem);
      color:var(--pink);
      line-height:1.1;
    }

    .title-wrap p{
      color:var(--muted);
      margin-top:5px;
      font-size:14px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
      gap:12px;
      margin-bottom:20px;
    }

    .stat{
      background:var(--card);
      backdrop-filter:blur(10px);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.25);
    }

    .stat h2{
      font-size:1.8rem;
      color:var(--pink);
    }

    .stat p{
      color:var(--muted);
      margin-top:5px;
      font-size:14px;
    }

    .panel{
      background:var(--card);
      backdrop-filter:blur(14px);
      border:1px solid var(--border);
      border-radius:24px;
      padding:20px;
      margin-bottom:25px;
      box-shadow:0 10px 40px rgba(0,0,0,0.3);
    }

    .panel h3{
      margin-bottom:18px;
      color:var(--pink);
      font-size:1.3rem;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:14px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .field label{
      font-size:14px;
      color:#f3d7df;
    }

    input,
    select{
      width:100%;
      padding:13px 14px;
      border:none;
      outline:none;
      border-radius:14px;
      background:rgba(255,255,255,0.08);
      color:white;
      border:1px solid rgba(255,255,255,0.08);
      transition:0.25s;
      font-size:15px;
    }

    input:focus,
    select:focus{
      border-color:var(--pink);
      box-shadow:0 0 0 3px rgba(255,192,203,0.12);
    }

    input::placeholder{
      color:#b8b8b8;
    }

    select option{
      color:black;
    }

    .action-row{
      display:flex;
      gap:12px;
      margin-top:18px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      cursor:pointer;
      border-radius:14px;
      padding:13px 18px;
      font-weight:700;
      transition:0.25s;
      font-size:15px;
    }

    .primary-btn{
      background:linear-gradient(135deg,var(--maroon),var(--pink));
      color:white;
      flex:1;
      min-width:180px;
    }

    .secondary-btn{
      background:rgba(255,255,255,0.08);
      color:white;
      border:1px solid rgba(255,255,255,0.08);
    }

    button:hover{
      transform:translateY(-2px);
      opacity:0.95;
    }

    .message{
      display:none;
      margin-top:15px;
      padding:14px;
      border-radius:14px;
      font-weight:600;
      animation:fadeIn 0.3s ease;
    }

    .success{
      background:rgba(40,199,111,0.15);
      color:#7dffb0;
      border:1px solid rgba(40,199,111,0.3);
    }

    .error{
      background:rgba(255,90,95,0.12);
      color:#ff8f94;
      border:1px solid rgba(255,90,95,0.3);
    }

    .warning{
      background:rgba(255,176,32,0.12);
      color:#ffd37a;
      border:1px solid rgba(255,176,32,0.3);
    }

    .search-box{
      margin-bottom:20px;
    }

    .student-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:18px;
    }

    .card{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:22px;
      overflow:hidden;
      position:relative;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-4px);
      border-color:rgba(255,192,203,0.25);
    }

    .card-top{
      padding:18px;
      display:flex;
      align-items:center;
      gap:15px;
    }

    .avatar{
      width:72px;
      height:72px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid rgba(255,255,255,0.15);
      background:#1a1a1a;
    }

    .avatar-placeholder{
      width:72px;
      height:72px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--maroon),var(--pink));
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      font-weight:700;
    }

    .student-name{
      font-size:1.1rem;
      font-weight:700;
    }

    .student-id{
      color:var(--pink);
      font-size:13px;
      margin-top:3px;
    }

    .badge{
      display:inline-block;
      margin-top:7px;
      padding:5px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
    }

    .badge.new{
      background:rgba(40,199,111,0.15);
      color:#83ffb8;
    }

    .badge.old{
      background:rgba(255,176,32,0.15);
      color:#ffd27d;
    }

    .card-body{
      padding:0 18px 18px;
      color:#dddddd;
      font-size:14px;
      line-height:1.7;
    }

    .info-line{
      margin-bottom:5px;
    }

    .card-actions{
      display:flex;
      gap:10px;
      padding:18px;
      border-top:1px solid rgba(255,255,255,0.06);
    }

    .edit-btn{
      flex:1;
      background:linear-gradient(135deg,#a00050,#ff8ac2);
      color:white;
    }

    .delete-btn{
      flex:1;
      background:rgba(255,90,95,0.12);
      color:#ff9ca0;
      border:1px solid rgba(255,90,95,0.2);
    }

    .loader{
      width:20px;
      height:20px;
      border:2px solid rgba(255,255,255,0.2);
      border-top-color:white;
      border-radius:50%;
      animation:spin 0.8s linear infinite;
      display:inline-block;
      vertical-align:middle;
      margin-right:8px;
    }

    .empty{
      text-align:center;
      padding:40px 20px;
      color:var(--muted);
      background:rgba(255,255,255,0.03);
      border-radius:18px;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(5px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:700px){

      body{
        padding:12px;
      }

      .panel{
        padding:16px;
        border-radius:20px;
      }

      .card-top{
        flex-direction:column;
        text-align:center;
      }

      .card-actions{
        flex-direction:column;
      }

      .action-row{
        flex-direction:column;
      }

      .primary-btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <div class="title-wrap">
      <h1>🎓 Student Management</h1>
      <p>Tyneceploh Educational Foundation</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <h2 id="total">0</h2>
      <p>Total Students</p>
    </div>

    <div class="stat">
      <h2 id="newCount">0</h2>
      <p>New Students</p>
    </div>

    <div class="stat">
      <h2 id="oldCount">0</h2>
      <p>Old Students</p>
    </div>
  </div>

  <div class="panel">

    <h3 id="formTitle">Create Student</h3>

    <div class="grid">

      <div class="field">
        <label>Student Name *</label>
        <input id="name" placeholder="Enter full name">
      </div>

      <div class="field">
        <label>Class *</label>
        <input id="class" placeholder="Example: 7th Grade">
      </div>

      <div class="field">
        <label>Date of Birth</label>
        <input type="date" id="dob">
      </div>

      <div class="field">
        <label>Gender</label>
        <select id="gender">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>

      <div class="field">
        <label>Nationality</label>
        <input id="nationality" placeholder="Nationality">
      </div>

      <div class="field">
        <label>Parent / Guardian</label>
        <input id="parent" placeholder="Parent name">
      </div>

      <div class="field">
        <label>Parent Contact</label>
        <input id="contact" placeholder="Contact number">
      </div>

      <div class="field">
        <label>Status *</label>
        <select id="status">
          <option value="New">New</option>
          <option value="Old">Old</option>
        </select>
      </div>

      <div class="field">
        <label>Student Photo</label>
        <input type="file" id="photo" accept="image/*">
      </div>

    </div>

    <input type="hidden" id="editId">

    <div class="action-row">
      <button class="primary-btn" id="saveBtn" onclick="saveStudent()">
        Save Student
      </button>

      <button class="secondary-btn" onclick="resetForm()">
        Clear Form
      </button>
    </div>

    <div id="msg" class="message"></div>

  </div>

  <div class="panel">

    <div class="search-box">
      <input
        id="search"
        placeholder="Search by name or student ID..."
        oninput="renderStudents()"
      >
    </div>

    <div id="list" class="student-grid"></div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let studentsCache = [];

function generatePin(){
  return Math.floor(1000 + Math.random() * 9000).toString();
}

function showMessage(type, text){

  const msg = document.getElementById("msg");

  msg.className = `message ${type}`;
  msg.style.display = "block";
  msg.innerHTML = text;

  setTimeout(() => {
    msg.style.display = "none";
  }, 4500);
}

function setLoading(loading){

  const btn = document.getElementById("saveBtn");

  if(loading){
    btn.disabled = true;
    btn.innerHTML = `<span class="loader"></span>Saving...`;
  }else{
    btn.disabled = false;
    btn.innerHTML = "Save Student";
  }
}

async function generateStudentId(){

  const snap = await getDocs(collection(db, "users"));

  const students = snap.docs.filter(
    d => d.data().role === "student"
  );

  const next = students.length + 1;

  return `TEF${String(next).padStart(3, "0")}`;
}

async function uploadImage(file){

  if(!file) return "";

  const formData = new FormData();

  formData.append("file", file);
  formData.append("upload_preset", "Tyneceploh");

  const res = await fetch(
    "https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload",
    {
      method:"POST",
      body:formData
    }
  );

  const data = await res.json();

  return data.secure_url || "";
}

async function loadStudents(){

  document.getElementById("list").innerHTML = `
    <div class="empty">
      <span class="loader"></span>
      Loading students...
    </div>
  `;

  try{

    const snap = await getDocs(collection(db, "users"));

    studentsCache = [];

    snap.forEach(d => {

      const data = d.data();

      if(data.role === "student"){
        studentsCache.push({
          ...data,
          docId:d.id
        });
      }
    });

    updateStats();
    renderStudents();

  }catch(err){

    console.error(err);

    document.getElementById("list").innerHTML = `
      <div class="empty">
        Failed to load students.
      </div>
    `;
  }
}

function updateStats(){

  document.getElementById("total").innerText =
    studentsCache.length;

  document.getElementById("newCount").innerText =
    studentsCache.filter(s => s.status === "New").length;

  document.getElementById("oldCount").innerText =
    studentsCache.filter(s => s.status === "Old").length;
}

window.renderStudents = function(){

  const search =
    document.getElementById("search")
    .value
    .toLowerCase();

  const filtered = studentsCache.filter(s =>

    (s.name || "")
    .toLowerCase()
    .includes(search)

    ||

    (s.userId || "")
    .toLowerCase()
    .includes(search)
  );

  if(filtered.length === 0){

    document.getElementById("list").innerHTML = `
      <div class="empty">
        No students found.
      </div>
    `;

    return;
  }

  document.getElementById("list").innerHTML = filtered.map(s => `

    <div class="card">

      <div class="card-top">

        ${
          s.photoURL
          ?
          `<img src="${s.photoURL}" class="avatar">`
          :
          `<div class="avatar-placeholder">
            ${s.name?.charAt(0) || "S"}
          </div>`
        }

        <div>
          <div class="student-name">${s.name}</div>

          <div class="student-id">
            ${s.userId}
          </div>

          <span class="badge ${s.status === "New" ? "new" : "old"}">
            ${s.status}
          </span>
        </div>

      </div>

      <div class="card-body">

        <div class="info-line">
          <b>Class:</b> ${s.class || "-"}
        </div>

        ${
          s.gender
          ?
          `<div class="info-line">
            <b>Gender:</b> ${s.gender}
          </div>`
          :
          ""
        }

        ${
          s.dob
          ?
          `<div class="info-line">
            <b>DOB:</b> ${s.dob}
          </div>`
          :
          ""
        }

        ${
          s.nationality
          ?
          `<div class="info-line">
            <b>Nationality:</b> ${s.nationality}
          </div>`
          :
          ""
        }

        ${
          s.parent
          ?
          `<div class="info-line">
            <b>Parent:</b> ${s.parent}
          </div>`
          :
          ""
        }

        ${
          s.contact
          ?
          `<div class="info-line">
            <b>Contact:</b> ${s.contact}
          </div>`
          :
          ""
        }

        <div class="info-line">
          <b>PIN:</b> ${s.pin || "-"}
        </div>

      </div>

      <div class="card-actions">

        <button
          class="edit-btn"
          onclick="editStudent('${s.docId}')"
        >
          Edit
        </button>

        <button
          class="delete-btn"
          onclick="deleteStudent('${s.docId}')"
        >
          Delete
        </button>

      </div>

    </div>

  `).join("");
};

window.saveStudent = async function(){

  const editId =
    document.getElementById("editId").value;

  const studentData = {

    name:
      document.getElementById("name")
      .value
      .trim(),

    class:
      document.getElementById("class")
      .value
      .trim(),

    dob:
      document.getElementById("dob")
      .value,

    gender:
      document.getElementById("gender")
      .value,

    nationality:
      document.getElementById("nationality")
      .value
      .trim(),

    parent:
      document.getElementById("parent")
      .value
      .trim(),

    contact:
      document.getElementById("contact")
      .value
      .trim(),

    status:
      document.getElementById("status")
      .value,

    role:"student",

    createdAt:Date.now()
  };

  if(!studentData.name){

    showMessage(
      "error",
      "⚠️ Student name is required."
    );

    return;
  }

  if(!studentData.class){

    showMessage(
      "error",
      "⚠️ Student class is required."
    );

    return;
  }

  try{

    setLoading(true);

    const file =
      document.getElementById("photo")
      .files[0];

    const photoURL =
      await uploadImage(file);

    if(photoURL){
      studentData.photoURL = photoURL;
    }

    if(!editId){

      const userId =
        await generateStudentId();

      const pin =
        generatePin();

      studentData.userId = userId;
      studentData.pin = pin;

      await addDoc(
        collection(db,"users"),
        studentData
      );

      showMessage(
        "success",
        `✅ Student created successfully.<br><br>
        <b>ID:</b> ${userId}<br>
        <b>PIN:</b> ${pin}`
      );

    }else{

      await updateDoc(
        doc(db,"users",editId),
        studentData
      );

      showMessage(
        "success",
        "✅ Student updated successfully."
      );
    }

    resetForm();
    loadStudents();

  }catch(err){

    console.error(err);

    showMessage(
      "error",
      "❌ Failed to save student. Check your internet connection."
    );

  }finally{

    setLoading(false);
  }
};

window.editStudent = function(id){

  const s =
    studentsCache.find(x => x.docId === id);

  if(!s) return;

  document.getElementById("formTitle").innerText =
    "Edit Student";

  document.getElementById("editId").value =
    id;

  document.getElementById("name").value =
    s.name || "";

  document.getElementById("class").value =
    s.class || "";

  document.getElementById("dob").value =
    s.dob || "";

  document.getElementById("gender").value =
    s.gender || "";

  document.getElementById("nationality").value =
    s.nationality || "";

  document.getElementById("parent").value =
    s.parent || "";

  document.getElementById("contact").value =
    s.contact || "";

  document.getElementById("status").value =
    s.status || "New";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
};

window.deleteStudent = async function(id){

  const confirmed =
    confirm("Delete this student?");

  if(!confirmed) return;

  try{

    await deleteDoc(
      doc(db,"users",id)
    );

    showMessage(
      "success",
      "🗑️ Student deleted successfully."
    );

    loadStudents();

  }catch(err){

    console.error(err);

    showMessage(
      "error",
      "❌ Failed to delete student."
    );
  }
};

window.resetForm = function(){

  document.getElementById("formTitle").innerText =
    "Create Student";

  document.getElementById("editId").value = "";

  document.getElementById("name").value = "";
  document.getElementById("class").value = "";
  document.getElementById("dob").value = "";
  document.getElementById("gender").value = "";
  document.getElementById("nationality").value = "";
  document.getElementById("parent").value = "";
  document.getElementById("contact").value = "";
  document.getElementById("status").value = "New";
  document.getElementById("photo").value = "";
};

loadStudents();

</script>

</body>
  
</html>
