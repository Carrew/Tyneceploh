<!DOCTYPE html>
<html>
<head>
  <title>Janitor Dashboard - TEF</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    :root{
      --bg:#0b0b0f;
      --panel:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.08);
      --pink:#ffc0cb;
      --text:#fff;
      --shadow:0 15px 40px rgba(0,0,0,0.4);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:system-ui;
    }

    body{
      background: radial-gradient(circle at top,#1a0010,var(--bg));
      color:var(--text);
      min-height:100vh;
    }

    header{
      padding:24px;
      text-align:center;
      background:linear-gradient(135deg,#800000,#1a0010);
    }

    header h1{
      color:var(--pink);
    }

    .sub{
      opacity:.7;
      margin-top:6px;
      font-size:13px;
    }

    /* PROFILE */
    .profile{
      margin:16px;
      padding:18px;
      border-radius:16px;
      background:var(--panel);
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      gap:14px;
      box-shadow:var(--shadow);
    }

    .profile img{
      width:70px;
      height:70px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--pink);
      background:#222;
    }

    .profile h2{
      font-size:18px;
    }

    .meta{
      font-size:13px;
      opacity:.7;
    }

    /* STATS */
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:10px;
      padding:0 16px;
    }

    .stat{
      background:var(--panel);
      border:1px solid var(--border);
      padding:14px;
      border-radius:14px;
      text-align:center;
    }

    .stat b{
      color:var(--pink);
      font-size:13px;
    }

    .stat h3{
      margin-top:8px;
    }

    /* TASKS */
    .section-title{
      padding:18px 16px 8px;
      font-size:13px;
      opacity:.7;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .task{
      margin:10px 16px;
      padding:12px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:12px;
      border-left:3px solid var(--pink);
    }

    .task small{
      opacity:.7;
    }

    /* GRID */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:10px;
      padding:12px 16px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--border);
      padding:14px;
      border-radius:12px;
      cursor:pointer;
      transition:.2s;
    }

    .card:hover{
      border-color:var(--pink);
      transform:translateY(-3px);
    }

    .logout{
      width:90%;
      margin:25px auto;
      display:block;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#1b1b25;
      color:white;
    }

  </style>
</head>

<body>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "janitor"){
  location.href = "login.html";
}
</script>

<header>
  <h1>Janitor Operations</h1>
  <div class="sub">Daily facility management hub</div>
</header>

<!-- PROFILE -->
<div class="profile">

  <img id="photo">

  <div>

    <h2 id="name"></h2>

    <div class="meta">
      ID: <span id="id"></span>
    </div>

    <div class="meta">
      Role: <span id="role"></span>
    </div>

  </div>

</div>

<!-- STATS -->
<div class="stats">

  <div class="stat">
    <b>Assigned Tasks</b>
    <h3 id="tasksCount">--</h3>
  </div>

  <div class="stat">
    <b>Status</b>
    <h3>Active</h3>
  </div>

</div>

<!-- TASKS -->
<div class="section-title">Daily Operations</div>

<div id="taskList"></div>

<!-- TOOLS -->
<div class="section-title">System Tools</div>

<div class="grid">

  <div class="card" onclick="go('qr-scan-attendance.html')">
    🕒 Attendance
  </div>

  <div class="card" onclick="go('user-announcements.html')">
    📢 Announcements
  </div>

  <div class="card" onclick="go('calender.html')">
    📅 School Calendar
  </div>

</div>

<button class="logout" onclick="logout()">Logout</button>

<script>

/* PROFILE */
document.getElementById("name").innerText = user.name || "Janitor";
document.getElementById("id").innerText = user.userId || "-";
document.getElementById("role").innerText = (user.role || "").toUpperCase();

const img = user.photoURL || "https://via.placeholder.com/100";
document.getElementById("photo").src = img;

/* TASKS (REAL DATA OR DEFAULT) */
const tasks = user.tasks || [
  { title:"Clean assigned classrooms", desc:"Follow daily schedule" },
  { title:"Waste management", desc:"Maintain compound cleanliness" },
  { title:"Sanitize key areas", desc:"Focus on toilets & entry points" }
];

document.getElementById("tasksCount").innerText = tasks.length;

const list = document.getElementById("taskList");

tasks.forEach(t => {

  const div = document.createElement("div");
  div.className = "task";

  div.innerHTML = `
    <b>${t.title}</b><br>
    <small>${t.desc}</small>
  `;

  list.appendChild(div);

});

function go(page){
  location.href = page;
}

function logout(){
  localStorage.removeItem("user");
  location.href = "login.html";
}

</script>

</body>
</html>
