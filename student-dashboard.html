<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard - TEF</title>

  <style>
    :root {
      --maroon: #800000;
      --pink: #ffc0cb;
      --bg: #0b0b0f;
      --card: rgba(255,255,255,0.06);
    }

    body {
      margin: 0;
      font-family: system-ui;
      background: radial-gradient(circle at top, #1a0010, var(--bg));
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: linear-gradient(135deg, var(--maroon), #1a0010);
    }

    h1 {
      margin: 0;
      color: var(--pink);
    }

    .sub {
      opacity: 0.8;
      margin-top: 5px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      margin: 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
    }

    .profile img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .stat {
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .section-title {
      padding: 10px 15px;
      font-size: 13px;
      opacity: 0.8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      padding: 15px;
    }

    .card {
      background: var(--card);
      padding: 14px;
      border-radius: 12px;
      border-left: 3px solid var(--pink);
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.09);
    }

    .logout {
      width: 90%;
      margin: 20px auto;
      display: block;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "student"){
  location.href = "login.html";
}

// image cache system
const imageCache = {
  get(key){ return localStorage.getItem("img_" + key); },
  set(key, value){ localStorage.setItem("img_" + key, value); }
};
</script>

<header>
  <h1>Student Learning Hub</h1>
  <div class="sub">Everything you need in one place</div>
</header>

<div class="profile">
  <img id="photo" />
  <div>
    <b id="name"></b><br>
    <span id="id"></span>
  </div>
</div>

<div class="stats">
  <div class="stat">
    <b>Assignments</b><br>
    --
  </div>
  <div class="stat">
    <b>Results</b><br>
    --
  </div>
  <div class="stat">
    <b>Attendance</b><br>
    --
  </div>
</div>

<div class="section-title">Academics</div>

<div class="grid">
  <div class="card" onclick="go('student-assignments.html')">📝 Assignments</div>
  <div class="card" onclick="go('student-results.html')">📊 Results</div>
  <div class="card" onclick="go('student-quiz.html')">🧠 Quizzes</div>
</div>

<div class="section-title">Learning Tools</div>

<div class="grid">
  <div class="card" onclick="go('student-notes.html')">📚 Notes</div>
  <div class="card" onclick="go('student-attendance.html')">📌 Attendance</div>
  <div class="card" onclick="go('student-financials.html')">💰 Financials</div>
</div>

<div class="section-title">School System</div>

<div class="grid">
  <div class="card" onclick="go('calender.html')">📅 Calendar</div>
  <div class="card" onclick="go('users-announcement.html')">📢 Announcements</div>
</div>

<button class="logout" onclick="logout()">Logout</button>

<script>
document.getElementById("name").innerText = user.name;
document.getElementById("id").innerText = user.userId || "";

// IMAGE CACHE
const cachedImg = localStorage.getItem("img_" + user.userId);

if(cachedImg){
  document.getElementById("photo").src = cachedImg;
} else if(user.photoURL){
  document.getElementById("photo").src = user.photoURL;
  localStorage.setItem("img_" + user.userId, user.photoURL);
} else {
  document.getElementById("photo").src = "https://via.placeholder.com/60";
}

function go(page){
  location.href = page;
}

function logout(){
  localStorage.removeItem("user");
  location.href = "login.html";
}
</script>

</body>
</html>
