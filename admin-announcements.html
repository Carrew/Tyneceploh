<!DOCTYPE html>
<html>
<head>
  <title>Announcement Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background: radial-gradient(circle at top, #1a0010, #0b0b0f);
      padding:20px;
      color:white;
    }

    .box{
      max-width:800px;
      margin:auto;
      background: rgba(255,255,255,0.05);
      padding:20px;
      border-radius:14px;
      backdrop-filter: blur(10px);
    }

    input,textarea,select,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      box-sizing:border-box;
      background: rgba(255,255,255,0.08);
      color:white;
      outline:none;
    }

    textarea{
      min-height:120px;
      resize:none;
    }

    button{
      background: linear-gradient(135deg, #800000, #ffc0cb);
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      transform: translateY(-2px);
    }

    .hidden{ display:none; }

    .toast{
      margin-top:10px;
      padding:10px;
      border-left:3px solid #ffc0cb;
      background: rgba(0,0,0,0.4);
      border-radius:8px;
    }

    .success {
      border-left-color: #28a745;
    }

    .error {
      border-left-color: #dc3545;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📢 Create Announcement</h2>

  <input id="title" placeholder="Title">
  <textarea id="message" placeholder="Message"></textarea>

  <label>Audience Type</label>
  <select id="type" onchange="toggleFields()">
    <option value="public">Public (All Users)</option>
    <option value="role">Role Based (Select Roles)</option>
    <option value="class">Class Based</option>
  </select>

  <div id="roleBox" class="hidden">
    <label>Target Roles</label>
    <select id="roles" multiple>
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="admin">Admin</option>
      <option value="janitor">Janitor</option>
      <option value="security">Security</option>
      <option value="coordinator">Coordinator</option>
    </select>
  </div>

  <div id="classBox" class="hidden">
    <label>Target Class</label>
    <select id="classes"></select>
  </div>

  <label style="margin-top: 15px;">
    <input type="checkbox" id="notifyCheckbox" checked>
    Send Push Notifications to Selected Users
  </label>

  <button onclick="send()" id="btn">Publish</button>

  <div id="msg"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { triggerToRole, triggerToPublic } from "./trigger-notification.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

// 🔐 ROLE GUARD (IMPORTANT)
if(!user || !["admin","coordinator"].includes(user.role)){
  location.href = "login.html";
}

// -------------------
// LOAD CLASSES
// -------------------
async function loadClasses(){
  const snap = await getDocs(collection(db,"users"));
  const set = new Set();

  snap.forEach(d=>{
    const u = d.data();
    if(u.class) set.add(u.class);
  });

  classes.innerHTML = [...set]
    .map(c=>`<option value="${c}">${c}</option>`)
    .join("");
}

loadClasses();

// -------------------
window.toggleFields = function(){
  const type = document.getElementById("type").value;

  roleBox.classList.add("hidden");
  classBox.classList.add("hidden");

  if(type === "role") roleBox.classList.remove("hidden");
  if(type === "class") classBox.classList.remove("hidden");
};

// -------------------
function toast(msg, type = "default"){
  const msgBox = document.getElementById("msg");
  const toastClass = type === "success" ? "toast success" : type === "error" ? "toast error" : "toast";
  msgBox.innerHTML = `<div class="${toastClass}">${msg}</div>`;
}

// -------------------
window.send = async function(){

  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.innerText = "Publishing...";

  try{

    const type = document.getElementById("type").value;
    const shouldNotify = document.getElementById("notifyCheckbox").checked;

    const roles = [...document.getElementById("roles").selectedOptions]
      .map(o => o.value);

    const cls = document.getElementById("classes").value;

    if(!title.value || !message.value){
      toast("❌ Fill all fields", "error");
      btn.disabled = false;
      btn.innerText = "Publish";
      return;
    }

    // Save announcement to Firestore
    await addDoc(collection(db,"announcements"),{
      title: title.value,
      message: message.value,
      type,
      targetRoles: roles,
      targetClass: cls,
      createdBy: user.name,
      createdByRole: user.role,
      createdAt: Date.now()
    });

    // SEND PUSH NOTIFICATIONS
    if(shouldNotify){
      
      if(type === "public"){
        // Broadcast to all users
        await triggerToPublic(db, 
          `📢 ${title.value}`,
          message.value,
          "announcement"
        );
      }
      else if(type === "role" && roles.length > 0){
        // Send to each selected role
        for(const role of roles){
          await triggerToRole(db,
            `📢 ${title.value}`,
            message.value,
            role,
            "announcement"
          );
        }
      }
      else if(type === "class"){
        // For class-based, trigger to students in that class
        // (Note: This requires a triggerToClass function or filtering)
        await triggerToRole(db,
          `📢 ${title.value}`,
          message.value,
          "student",
          "announcement_class"
        );
      }
    }

    toast("✅ Announcement published successfully with notifications!", "success");

    title.value = "";
    message.value = "";
    document.getElementById("roles").selectedIndex = -1;

  }catch(err){
    console.error("Error publishing announcement:", err);
    toast("❌ Failed to publish announcement. Check console for details.", "error");
  }

  btn.disabled = false;
  btn.innerText = "Publish";
};

</script>

</body>
</html>
