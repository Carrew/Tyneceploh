<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class Attendance - TEF</title>

<style>

:root{
  --maroon:#800000;
  --pink:#ffc0cb;
  --bg:#0b0b10;
  --card:rgba(255,255,255,0.07);
  --text:#ffffff;
  --muted:#bbbbbb;
  --green:#28c76f;
  --red:#ff5b6e;
  --yellow:#ffb020;
  --blue:#00bfff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:system-ui,sans-serif;
  background:
    radial-gradient(circle at top,#2a0015 0%, #13020b 45%, #09090d 100%);
  color:var(--text);
  padding:16px;
  min-height:100vh;
}

.topbar{
  background:linear-gradient(135deg,var(--maroon),#ff4f88);
  border-radius:24px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.topbar h1{
  font-size:28px;
  margin-bottom:8px;
}

.topbar p{
  opacity:.9;
  line-height:1.6;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:12px;
  margin-bottom:18px;
}

select,
button,
input{
  border:none;
  outline:none;
  border-radius:16px;
  padding:14px;
  font-size:15px;
}

select,
input{
  background:rgba(255,255,255,.08);
  color:white;
}

button{
  background:linear-gradient(135deg,var(--maroon),var(--pink));
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:.25s;
}

button:hover{
  transform:translateY(-2px);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:var(--card);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:18px;
  text-align:center;
  backdrop-filter:blur(10px);
}

.stat h2{
  color:var(--pink);
  font-size:25px;
  margin-bottom:6px;
}

.stat span{
  font-size:13px;
  color:var(--muted);
}

.student-card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  backdrop-filter:blur(12px);
}

.student-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.student-left img{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.1);
}

.student-name{
  font-size:17px;
  font-weight:700;
}

.student-id{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.present{
  background:rgba(40,199,111,.18);
  color:#8ef0b4;
}

.absent{
  background:rgba(255,91,110,.18);
  color:#ff9aa7;
}

.late{
  background:rgba(255,176,32,.18);
  color:#ffd27c;
}

.selected{
  outline:2px solid white;
}

.message{
  padding:14px;
  border-radius:14px;
  margin-bottom:16px;
  display:none;
  font-weight:600;
}

.success{
  background:rgba(40,199,111,.15);
  border:1px solid rgba(40,199,111,.4);
  color:#8ef0b4;
}

.error{
  background:rgba(255,91,110,.15);
  border:1px solid rgba(255,91,110,.4);
  color:#ff9aa7;
}

.loader{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}

.quick-actions{
  display:flex;
  gap:10px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.empty{
  background:var(--card);
  padding:30px;
  border-radius:18px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:650px){

  body{
    padding:12px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .student-card{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    width:100%;
  }

  .actions button{
    flex:1;
  }

  .topbar h1{
    font-size:23px;
  }

}

</style>
</head>
<body>

<div class="topbar">

  <h1>📚 Student Attendance</h1>

  <p>
    One click attendance tracking for analytics,
    student reports, punctuality monitoring and
    school performance insights.
  </p>

</div>

<div id="msg" class="message"></div>

<div class="controls">

  <select id="classSelect"></select>

  <input type="date" id="attendanceDate">

  <button onclick="saveAttendance()">
    Save Attendance
  </button>

</div>

<div class="quick-actions">

  <button onclick="markAll('Present')">
    Mark All Present
  </button>

  <button onclick="markAll('Absent')">
    Mark All Absent
  </button>

  <button onclick="markAll('Late')">
    Mark All Late
  </button>

</div>

<div class="stats">

  <div class="stat">
    <h2 id="totalStudents">0</h2>
    <span>Total Students</span>
  </div>

  <div class="stat">
    <h2 id="presentCount">0</h2>
    <span>Present</span>
  </div>

  <div class="stat">
    <h2 id="absentCount">0</h2>
    <span>Absent</span>
  </div>

  <div class="stat">
    <h2 id="lateCount">0</h2>
    <span>Late</span>
  </div>

</div>

<div id="studentList">

  <div class="loader">
    Loading students...
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  setDoc,
  doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(
  localStorage.getItem("user")
);

if(!user || user.role !== "teacher"){

  location.href = "login.html";

}

let studentsCache = [];
let attendanceMap = {};

document.getElementById(
  "attendanceDate"
).value =
  new Date().toISOString().split("T")[0];

function showMessage(text,type="success"){

  const el =
    document.getElementById("msg");

  el.style.display = "block";
  el.className =
    `message ${type}`;

  el.innerText = text;

  setTimeout(()=>{

    el.style.display = "none";

  },4000);

}

function loadClassOptions(){

  const select =
    document.getElementById(
      "classSelect"
    );

  const classes =
    user.classes || [];

  select.innerHTML =
    classes.map(c=>`

      <option value="${c}">
        ${c}
      </option>

    `).join("");

  select.addEventListener(
    "change",
    loadStudents
  );

}

async function loadStudents(){

  const className =
    document.getElementById(
      "classSelect"
    ).value;

  const snap = await getDocs(
    collection(db,"users")
  );

  studentsCache = [];

  snap.forEach(d=>{

    const data = d.data();

    if(
      data.role === "student" &&
      data.class === className
    ){

      studentsCache.push({
        ...data,
        docId:d.id
      });

    }

  });

  studentsCache.sort((a,b)=>
    (a.name || "")
    .localeCompare(b.name || "")
  );

  attendanceMap = {};

  studentsCache.forEach(s=>{

    attendanceMap[s.userId] =
      "Present";

  });

  updateStats();

  renderStudents();

}

function updateStats(){

  const values =
    Object.values(attendanceMap);

  document.getElementById(
    "totalStudents"
  ).innerText =
    studentsCache.length;

  document.getElementById(
    "presentCount"
  ).innerText =
    values.filter(v=>
      v === "Present"
    ).length;

  document.getElementById(
    "absentCount"
  ).innerText =
    values.filter(v=>
      v === "Absent"
    ).length;

  document.getElementById(
    "lateCount"
  ).innerText =
    values.filter(v=>
      v === "Late"
    ).length;

}

function renderStudents(){

  const list =
    document.getElementById(
      "studentList"
    );

  if(studentsCache.length === 0){

    list.innerHTML = `

      <div class="empty">
        No students found in this class.
      </div>

    `;

    return;

  }

  list.innerHTML =
    studentsCache.map(s=>`

      <div class="student-card">

        <div class="student-left">

          <img
            src="${
              s.photoURL ||
              'https://via.placeholder.com/60'
            }"
          >

          <div>

            <div class="student-name">
              ${s.name}
            </div>

            <div class="student-id">
              ${s.userId}
            </div>

          </div>

        </div>

        <div class="actions">

          <button
            class="
              present
              ${
                attendanceMap[s.userId]
                === "Present"
                ? "selected"
                : ""
              }
            "
            onclick="
              setAttendance(
                '${s.userId}',
                'Present'
              )
            "
          >
            Present
          </button>

          <button
            class="
              absent
              ${
                attendanceMap[s.userId]
                === "Absent"
                ? "selected"
                : ""
              }
            "
            onclick="
              setAttendance(
                '${s.userId}',
                'Absent'
              )
            "
          >
            Absent
          </button>

          <button
            class="
              late
              ${
                attendanceMap[s.userId]
                === "Late"
                ? "selected"
                : ""
              }
            "
            onclick="
              setAttendance(
                '${s.userId}',
                'Late'
              )
            "
          >
            Late
          </button>

        </div>

      </div>

    `).join("");

}

window.setAttendance =
function(userId,status){

  attendanceMap[userId] =
    status;

  updateStats();

  renderStudents();

};

window.markAll =
function(status){

  studentsCache.forEach(s=>{

    attendanceMap[s.userId] =
      status;

  });

  updateStats();

  renderStudents();

};

window.saveAttendance =
async function(){

  try{

    const date =
      document.getElementById(
        "attendanceDate"
      ).value;

    const className =
      document.getElementById(
        "classSelect"
      ).value;

    if(!date){

      showMessage(
        "Select attendance date",
        "error"
      );

      return;

    }

    for(const student of studentsCache){

      const status =
        attendanceMap[
          student.userId
        ];

      await setDoc(

        doc(
          db,
          "studentAttendance",
          `${student.userId}_${date}`
        ),

        {
          userId:student.userId,
          studentName:student.name,
          class:student.class,

          teacherId:user.userId,
          teacherName:user.name,

          status,
          date,

          createdAt:Date.now()
        }

      );

    }

    showMessage(
      `Attendance saved successfully for ${className}`
    );

  }catch(err){

    console.error(err);

    showMessage(
      "Failed to save attendance",
      "error"
    );

  }

};

loadClassOptions();
loadStudents();

</script>

</body>
</html>
