<!DOCTYPE html>
<html>
<head>
  <title>Login - TEF System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h2>Login</h2>

<input id="id" placeholder="User ID">
<input id="pin" type="password" placeholder="PIN">

<button onclick="login()">Login</button>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getMessaging,
  getToken,
  isSupported
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const app = initializeApp({
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
});

const db = getFirestore(app);

let messaging = null;

// safer init (prevents crashes on unsupported devices like some iOS cases)
(async () => {
  const supported = await isSupported();
  if (supported) {
    messaging = getMessaging(app);
  }
})();

function localNotify(title, body){

  if("Notification" in window){

    if(Notification.permission === "granted"){
      new Notification(title, { body });
    }

  }

}

// 🔥 push registration (safe across devices)
async function registerPush(userDocId){

  try{

    if(!messaging) return null;

    const permission = await Notification.requestPermission();

    if(permission !== "granted") return null;

    const token = await getToken(messaging, {
      vapidKey: "BH3wQ-GoLtUvWYWd_KeHcg9DQeU24hkNRAAdmzyknuPQekDgIj4JnCQfFtpydFpQmVo-5NODlf1Eyc0t7MNIrOc"
    });

    if(!token) return null;

    await updateDoc(doc(db, "users", userDocId), {
      fcmToken: token,
      notificationEnabled: true,
      lastLogin: Date.now()
    });

    return token;

  }catch(err){
    console.log("Push register failed:", err);
    return null;
  }

}

window.login = async function(){

  const idInput = document.getElementById("id").value.trim().toUpperCase();
  const pinInput = document.getElementById("pin").value.trim();

  if(!idInput || !pinInput){
    alert("Enter ID and PIN");
    return;
  }

  const snap = await getDocs(collection(db, "users"));

  let found = null;
  let docId = null;

  snap.forEach(d => {
    const u = d.data();

    if(u.userId === idInput && u.pin === pinInput){

      found = {
        id: u.userId,
        userId: u.userId,
        name: u.name || "",
        role: (u.role || "").toLowerCase(),
        class: u.class || "",
        classes: u.classes || [],
        status: u.status || ""
      };

      docId = d.id;
    }

  });

  if(!found){
    alert("Invalid ID or PIN");
    return;
  }

  // access rule
  if(found.role !== "student" && found.status !== "active"){
    alert("Account restricted. Contact admin.");
    return;
  }

  localStorage.setItem("user", JSON.stringify(found));

  console.log("Login success:", found.role);

  // 🔥 REGISTER PUSH SAFELY
  await registerPush(docId);

  // 🔔 LOCAL NOTIFICATION (works everywhere)
  localNotify(
    "Welcome back",
    `${found.name || found.userId} logged in successfully`
  );

  // ROUTING (UNCHANGED)
  switch(found.role){

    case "admin":
      location.href = "admin-dashboard.html";
      break;

    case "teacher":
      location.href = "teacher-dashboard.html";
      break;

    case "student":
      location.href = "student-dashboard.html";
      break;

    case "janitor":
      location.href = "janitor-dashboard.html";
      break;

    case "security":
      location.href = "security-dashboard.html";
      break;

    case "coordinator":
      location.href = "coordinator-dashboard.html";
      break;

    default:
      location.href = "index.html";
  }

};

</script>

</body>
</html>
