<!DOCTYPE html>
<html>
<head>
  <title>Login - TEF System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h2>Login</h2>

<input id="id" placeholder="User ID">
<input id="pin" type="password" placeholder="PIN">

<button onclick="login()">Login</button>


  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getMessaging,
  getToken,
  isSupported
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const app = initializeApp({
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh",
  messagingSenderId: "161024255934", // Matches Service Worker
  appId: "1:161024255934:web:2bca05f1d6af871cc57bef" // Matches Service Worker
});


const db = getFirestore(app);

let messaging = null;

// safe messaging init
(async () => {
  if (await isSupported()) {
    messaging = getMessaging(app);
  }
})();


// 🔥 SAFE NOTIFICATION SYSTEM (FIXED FOR MOBILE)
async function safeNotify(title, body){

  try{

    // Desktop (safe path)
    if("Notification" in window && Notification.permission === "granted"){

      // Mobile fix: avoid constructor error
      if(typeof ServiceWorkerRegistration !== "undefined"){

        const reg = await navigator.serviceWorker.getRegistration();

        if(reg && reg.showNotification){

          reg.showNotification(title, {
            body,
            icon: "/icon.png"
          });

          return;

        }

      }

      // fallback desktop
      new Notification(title, { body });

    }

  }catch(err){

    console.log("Notification fallback used:", err);

  }

}


// 🔥 PUSH REGISTRATION
async function registerPush(userDocId){

  try{

    if(!messaging) return;

    const permission = await Notification.requestPermission();

    if(permission !== "granted") return;

    const token = await getToken(messaging, {
      vapidKey: "BH3wQ-GoLtUvWYWd_KeHcg9DQeU24hkNRAAdmzyknuPQekDgIj4JnCQfFtpydFpQmVo-5NODlf1Eyc0t7MNIrOc"
    });

    if(!token) return;

    await updateDoc(doc(db, "users", userDocId), {
      fcmToken: token,
      notificationEnabled: true,
      lastLogin: Date.now()
    });

  }catch(err){
    console.log("Push error:", err);
  }

}


window.login = async function(){

  const idInput = document.getElementById("id").value.trim().toUpperCase();
  const pinInput = document.getElementById("pin").value.trim();

  if(!idInput || !pinInput){
    alert("Enter ID and PIN");
    return;
  }

  const snap = await getDocs(collection(db, "users"));

  let found = null;
  let docId = null;

  snap.forEach(d => {
    const u = d.data();

    if(u.userId === idInput && u.pin === pinInput){

      found = {
        id: u.userId,
        userId: u.userId,
        name: u.name || "",
        role: (u.role || "").toLowerCase(),
        class: u.class || "",
        classes: u.classes || [],
        status: u.status || ""
      };

      docId = d.id;
    }

  });

  if(!found){
    alert("Invalid ID or PIN");
    return;
  }

  if(found.role !== "student" && found.status !== "active"){
    alert("Account restricted. Contact admin.");
    return;
  }

  localStorage.setItem("user", JSON.stringify(found));

  console.log("Logged in:", found.role);

  // 🔥 PUSH REGISTRATION
  await registerPush(docId);

  // 🔥 SAFE NOTIFICATION (NO MOBILE ERROR)
  await safeNotify(
    "Login Successful",
    `Welcome ${found.name || found.userId}`
  );

  // ROUTING (UNCHANGED)
  switch(found.role){

    case "admin":
      location.href = "admin-dashboard.html";
      break;

    case "teacher":
      location.href = "teacher-dashboard.html";
      break;

    case "student":
      location.href = "student-dashboard.html";
      break;

    case "janitor":
      location.href = "janitor-dashboard.html";
      break;

    case "security":
      location.href = "security-dashboard.html";
      break;

    case "coordinator":
      location.href = "coordinator-dashboard.html";
      break;

    default:
      location.href = "index.html";
  }

};

  </script>

</body>
</html>
