<!DOCTYPE html>
<html>
<head>
  <title>Login - TEF System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2>Login</h2>

<input id="id" placeholder="User ID">
<input id="pin" type="password" placeholder="PIN">

<button onclick="login()">Login</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 NEW: messaging (safe optional add) */
import { getMessaging, getToken } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const app = initializeApp({
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
});

const db = getFirestore(app);

/* 🔥 NEW */
let messaging;
try {
  messaging = getMessaging(app);
} catch (e) {
  console.log("Messaging not supported yet");
}

window.login = async function(){

  const idInput = document.getElementById("id").value.trim().toUpperCase();
  const pinInput = document.getElementById("pin").value.trim();

  if(!idInput || !pinInput){
    alert("Enter ID and PIN");
    return;
  }

  const snap = await getDocs(collection(db, "users"));

  let found = null;

  snap.forEach(d => {
    const u = d.data();

    if(u.userId === idInput && u.pin === pinInput){
      found = {
        docId: d.id,   // 🔥 IMPORTANT for updates later
        id: u.userId,
        userId: u.userId,
        name: u.name || "",
        role: (u.role || "").toLowerCase(),
        class: u.class || "",
        classes: u.classes || [],
        status: u.status || ""
      };
    }
  });

  if(!found){
    alert("Invalid ID or PIN");
    return;
  }

  if(found.role !== "student" && found.status !== "active"){
    alert("Account restricted. Please contact administration.");
    return;
  }

  localStorage.setItem("user", JSON.stringify(found));

  console.log("✅ Logged in successfully as:", found.role);

  /* 🔥 NEW: notifications setup (non-blocking) */
  setupNotifications(found).catch(err => {
    console.log("Notification setup skipped:", err);
  });

  switch(found.role){
    case "admin":
      location.href = "admin-dashboard.html";
      break;

    case "teacher":
      location.href = "teacher-dashboard.html";
      break;

    case "student":
      location.href = "student-dashboard.html";
      break;

    case "janitor":
      location.href = "janitor-dashboard.html";
      break;

    case "security":
      location.href = "security-dashboard.html";
      break;

    case "coordinator":
      location.href = "coordinator-dashboard.html";
      break;

    default:
      alert("Role not recognized. Redirecting to home.");
      location.href = "index.html";
  }
};

/* 🔥 NEW: push permission + token save */
async function setupNotifications(user){

  if(!messaging) return;

  const permission = await Notification.requestPermission();

  if(permission !== "granted"){
    console.log("Notifications denied");
    return;
  }

  const token = await getToken(messaging, {
    vapidKey: "BH3wQ-GoLtUvWYWd_KeHcg9DQeU24hkNRAAdmzyknuPQekDgIj4JnCQfFtpydFpQmVo-5NODlf1Eyc0t7MNIrOc"
  });

  if(!token){
    console.log("No FCM token");
    return;
  }

  await updateDoc(doc(db, "users", user.docId), {
    fcmToken: token,
    notificationsEnabled: true
  });

  console.log("📲 Notifications enabled");
}

</script>

</body>
</html>
