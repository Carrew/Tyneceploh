<!DOCTYPE html>
<html>
<head>
  <title>Login - TEF System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2>Login</h2>
<input id="id" placeholder="User ID">
<input id="pin" type="password" placeholder="PIN">
<button onclick="login()">Login</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh",
  messagingSenderId: "161024255934",
  appId: "1:161024255934:web:2bca05f1d6af871cc57bef"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let messaging = null;

// 🔥 Fix 1: Register Service Worker using relative path for GitHub Pages
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('firebase-messaging-sw.js')
      .then(async (registration) => {
        console.log('Service Worker registered with scope:', registration.scope);
        if (await isSupported()) {
          messaging = getMessaging(app);
        }
      })
      .catch((err) => console.error('Service Worker registration failed:', err));
  });
}

// 🔥 Fix 2: Safe Notification (Fixes "Illegal Constructor" error on Mobile)
async function safeNotify(title, body) {
  try {
    const permission = await Notification.requestPermission();
    if (permission !== "granted") return;

    // Wait for the Service Worker to be active
    const reg = await navigator.serviceWorker.ready;
    
    if (reg && reg.showNotification) {
      // Correct way to show notifications on modern mobile browsers
      await reg.showNotification(title, {
        body: body,
        icon: "icon.png", // Relative path
        badge: "icon.png"
      });
    } else if ("Notification" in window) {
      // Desktop fallback
      new Notification(title, { body });
    }
  } catch (err) {
    console.warn("Notification system error:", err);
  }
}

// Push Registration Logic
async function registerPush(userDocId) {
  try {
    if (!messaging) return;
    const permission = await Notification.requestPermission();
    if (permission !== "granted") return;

    const token = await getToken(messaging, {
      vapidKey: "BH3wQ-GoLtUvWYWd_KeHcg9DQeU24hkNRAAdmzyknuPQekDgIj4JnCQfFtpydFpQmVo-5NODlf1Eyc0t7MNIrOc"
    });

    if (token) {
      await updateDoc(doc(db, "users", userDocId), {
        fcmToken: token,
        notificationEnabled: true,
        lastLogin: Date.now()
      });
      console.log("Push token updated");
    }
  } catch (err) {
    console.error("FCM Token error:", err);
  }
}

window.login = async function() {
  const idInput = document.getElementById("id").value.trim().toUpperCase();
  const pinInput = document.getElementById("pin").value.trim();

  if (!idInput || !pinInput) {
    alert("Enter ID and PIN");
    return;
  }

  try {
    const snap = await getDocs(collection(db, "users"));
    let found = null;
    let docId = null;

    snap.forEach(d => {
      const u = d.data();
      if (u.userId === idInput && u.pin === pinInput) {
        found = {
  id: u.userId,
  userId: u.userId,
  name: u.name || "",
  role: (u.role || "").toLowerCase(),
  status: u.status || "",
  classes: u.classes || []
};
        
        docId = d.id;
      }
    });

    if (!found) {
      alert("Invalid ID or PIN");
      return;
    }

    if (found.role !== "student" && found.status !== "active") {
      alert("Account restricted. Contact admin.");
      return;
    }

    localStorage.setItem("user", JSON.stringify(found));
    
    // Attempt to register push token and send notification
    await registerPush(docId);
    await safeNotify("Login Successful", `Welcome ${found.name || found.userId}`);

    // Routing Logic
    const routes = {
      admin: "admin-dashboard.html",
      teacher: "teacher-dashboard.html",
      student: "student-dashboard.html",
      janitor: "janitor-dashboard.html",
      security: "security-dashboard.html",
      coordinator: "coordinator-dashboard.html"
    };

    setTimeout(() => {
      location.href = routes[found.role] || "index.html";
    }, 1000); // Small delay to allow notification to trigger

  } catch (error) {
    console.error("Login Error:", error);
    alert("Login failed. Check connection.");
  }
};
</script>
</body>
</html>
