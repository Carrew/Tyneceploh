<!DOCTYPE html>
<html>
<head>
  <title>Login - TEF System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2>Login</h2>

<input id="id" placeholder="User ID">
<input id="pin" type="password" placeholder="PIN">

<button onclick="login()">Login</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getFirestore, collection, getDocs, doc, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { getMessaging, getToken } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const app = initializeApp({
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh",
  messagingSenderId: "YOUR_SENDER_ID"
});

const db = getFirestore(app);
const messaging = getMessaging(app);

//
// 🔔 ENABLE NOTIFICATIONS (SAFE ADD-ON)
//
async function enableNotifications(user){

  try{

    const permission = await Notification.requestPermission();

    if(permission !== "granted"){
      console.log("Notifications denied");
      return null;
    }

    const token = await getToken(messaging, {
      vapidKey: "BH3wQ-GoLtUvWYWd_KeHcg9DQeU24hkNRAAdmzyknuPQekDgIj4JnCQfFtpydFpQmVo-5NODlf1Eyc0t7MNIrOc"
    });

    if(!token){
      console.log("No token generated");
      return null;
    }

    // Save token directly into user document (safe fallback)
    const snap = await getDocs(collection(db, "users"));

    snap.forEach(async (d) => {
      const u = d.data();
      if(u.userId === user.userId){
        await updateDoc(doc(db,"users",d.id),{
          fcmToken: token,
          notificationEnabled: true
        });
      }
    });

    return token;

  }catch(err){
    console.log("Notification error:", err);
    return null;
  }
}

//
// 🔥 LOGIN FUNCTION (UNCHANGED LOGIC + ADDITIONS ONLY)
//
window.login = async function(){

  const idInput = document.getElementById("id").value.trim().toUpperCase();
  const pinInput = document.getElementById("pin").value.trim();

  if(!idInput || !pinInput){
    alert("Enter ID and PIN");
    return;
  }

  const snap = await getDocs(collection(db, "users"));

  let found = null;

  snap.forEach(d => {
    const u = d.data();

    if(u.userId === idInput && u.pin === pinInput){
      found = {
        id: u.userId,
        userId: u.userId,
        name: u.name || "",
        role: (u.role || "").toLowerCase(),
        class: u.class || "",
        classes: u.classes || [],
        status: u.status || ""
      };
    }
  });

  if(!found){
    alert("Invalid ID or PIN");
    return;
  }

  if(found.role !== "student" && found.status !== "active"){
    alert("Account restricted. Please contact administration.");
    return;
  }

  localStorage.setItem("user", JSON.stringify(found));

  console.log("Logged in:", found.role);

  //
  // 🔔 NEW: REQUEST NOTIFICATIONS AFTER LOGIN
  //
  const token = await enableNotifications(found);

  //
  // 🔔 NEW: SELF LOGIN NOTIFICATION
  //
  if(token && Notification.permission === "granted"){

    new Notification("Login Successful", {
      body: `Welcome back ${found.name}`,
    });

  }

  // ROUTING (UNCHANGED)
  switch(found.role){
    case "admin":
      location.href = "admin-dashboard.html";
      break;

    case "teacher":
      location.href = "teacher-dashboard.html";
      break;

    case "student":
      location.href = "student-dashboard.html";
      break;

    case "janitor":
      location.href = "janitor-dashboard.html";
      break;

    case "security":
      location.href = "security-dashboard.html";
      break;

    case "coordinator":
      location.href = "coordinator-dashboard.html";
      break;

    default:
      alert("Role not recognized. Redirecting to home.");
      location.href = "index.html";
  }

};

</script>

</script>

</body>
</html>
