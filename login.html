<!DOCTYPE html>
<html>
<head>
  <title>Login - TEF System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2>Login</h2>

<input id="id" placeholder="User ID">
<input id="pin" type="password" placeholder="PIN">

<button onclick="login()">Login</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain: "tyneceploh.firebaseapp.com",
  projectId: "tyneceploh",
  messagingSenderId: "161024255934",
  appId: "1:161024255934:web:2bca05f1d6af871cc57bef"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let messaging = null;

// safe init messaging
(async () => {
  if (await isSupported()) {
    messaging = getMessaging(app);
  }
})();

// 🔥 SAFE PUSH TOKEN REGISTER
async function registerPush(docId) {
  try {
    if (!messaging) return;

    const permission = await Notification.requestPermission();
    if (permission !== "granted") return;

    const token = await getToken(messaging, {
      vapidKey: "BH3wQ-GoLtUvWYWd_KeHcg9DQeU24hkNRAAdmzyknuPQekDgIj4JnCQfFtpydFpQmVo-5NODlf1Eyc0t7MNIrOc"
    });

    if (token) {
      await updateDoc(doc(db, "users", docId), {
        fcmToken: token,
        notificationEnabled: true,
        lastLogin: Date.now()
      });
    }
  } catch (e) {
    console.log("Push error:", e);
  }
}

// 🔥 MOBILE SAFE NOTIFICATION (NO new Notification EVER)
async function notifySafe(title, body) {
  try {
    if (!("serviceWorker" in navigator)) return;

    const reg = await navigator.serviceWorker.ready;

    if (reg && reg.showNotification) {
      await reg.showNotification(title, {
        body,
        icon: "/icon.png",
        badge: "/icon.png"
      });
    }
  } catch (e) {
    console.log("Notify error:", e);
  }
}

window.login = async function() {

  const idInput = document.getElementById("id").value.trim().toUpperCase();
  const pinInput = document.getElementById("pin").value.trim();

  if (!idInput || !pinInput) {
    alert("Enter ID and PIN");
    return;
  }

  const snap = await getDocs(collection(db, "users"));

  let found = null;
  let docId = null;

  snap.forEach(d => {
    const u = d.data();
    if (u.userId === idInput && u.pin === pinInput) {
      found = {
        id: u.userId,
        userId: u.userId,
        name: u.name || "",
        role: (u.role || "").toLowerCase(),
        class: u.class || "",
        classes: u.classes || [],
        status: u.status || ""
      };
      docId = d.id;
    }
  });

  if (!found) {
    alert("Invalid ID or PIN");
    return;
  }

  if (found.role !== "student" && found.status !== "active") {
    alert("Account restricted. Contact admin.");
    return;
  }

  localStorage.setItem("user", JSON.stringify(found));

  // 🔥 PUSH + LOGIN NOTIFICATION
  await registerPush(docId);
  await notifySafe("Login Successful", `Welcome back ${found.name || found.userId}`);

  // routing
  const routes = {
    admin: "admin-dashboard.html",
    teacher: "teacher-dashboard.html",
    student: "student-dashboard.html",
    janitor: "janitor-dashboard.html",
    security: "security-dashboard.html",
    coordinator: "coordinator-dashboard.html"
  };

  location.href = routes[found.role] || "index.html";
};

</script>

</body>
</html>
