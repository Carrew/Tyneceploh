<!DOCTYPE html>
<html>
<head>
  <title>My Attendance - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:15px;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
      text-align:center;
    }

    .big{
      font-size:22px;
      font-weight:bold;
      margin-top:8px;
    }

    table{
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
      background:white;
      border-radius:10px;
      overflow:hidden;
    }

    th,td{
      padding:10px;
      border:1px solid #eee;
      text-align:center;
      font-size:13px;
    }

    th{
      background:#2c3e50;
      color:white;
    }

    .late{ color:#e67e22; font-weight:bold; }
    .early{ color:#3498db; font-weight:bold; }
    .bad{ color:#c0392b; font-weight:bold; }
    .good{ color:#27ae60; font-weight:bold; }

  </style>
</head>

<body>

<h2>My Attendance Report</h2>

<div class="grid">

  <div class="card">
    Total Days
    <div class="big" id="total">0</div>
  </div>

  <div class="card">
    Present
    <div class="big good" id="present">0</div>
  </div>

  <div class="card">
    Late Days
    <div class="big late" id="late">0</div>
  </div>

  <div class="card">
    Early Exit
    <div class="big early" id="early">0</div>
  </div>

  <div class="card">
    Flags
    <div class="big bad" id="flags">0</div>
  </div>

  <div class="card">
    Avg Hours/Day
    <div class="big" id="avg">0</div>
  </div>

</div>

<table>

  <thead>
    <tr>
      <th>Date</th>
      <th>Clock In</th>
      <th>Clock Out</th>
      <th>Status</th>
      <th>Hours</th>
      <th>Flags</th>
    </tr>
  </thead>

  <tbody id="body"></tbody>

</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  location.href = "login.html";
}

function hours(a,b){
  if(!a || !b) return 0;
  return ((b-a)/(1000*60*60));
}

async function load(){

  const snap = await getDocs(collection(db,"attendanceDaily"));

  let total=0, present=0, late=0, early=0, flags=0;
  let sumHours=0;

  let rows="";

  snap.forEach(d=>{

    const a = d.data();

    if(a.userId !== user.userId) return;

    total++;

    let status = "ABSENT";
    let hrs = 0;
    let flagList = [];

    if(a.clockIn){

      present++;
      status = a.clockIn.status || "ON_TIME";

      if(status === "LATE") late++;
      if(status === "EARLY") early++;

      if(a.clockOut){

        hrs = hours(a.clockIn.time,a.clockOut.time);
        sumHours += hrs;

      }

      if(a.clockIn.flag) flagList.push(a.clockIn.flag);
      if(a.clockOut?.flag) flagList.push(a.clockOut.flag);

    }

    rows += `
      <tr>
        <td>${a.date}</td>
        <td>${a.clockIn ? new Date(a.clockIn.time).toLocaleTimeString() : "-"}</td>
        <td>${a.clockOut ? new Date(a.clockOut.time).toLocaleTimeString() : "-"}</td>
        <td class="${status==='LATE'?'late':status==='EARLY'?'early':'good'}">${status}</td>
        <td>${hrs.toFixed(2)}</td>
        <td class="bad">${flagList.join(", ") || "OK"}</td>
      </tr>
    `;

  });

  document.getElementById("body").innerHTML = rows;

  document.getElementById("total").innerText = total;
  document.getElementById("present").innerText = present;
  document.getElementById("late").innerText = late;
  document.getElementById("early").innerText = early;
  document.getElementById("flags").innerText = flags;

  document.getElementById("avg").innerText =
    total ? (sumHours/total).toFixed(2) : 0;

}

load();

</script>

</body>
</html>
