<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Attendance - TEF</title>

<style>

:root{
  --maroon:#800000;
  --pink:#ffc0cb;
  --bg:#0b0b0f;
  --card:rgba(255,255,255,0.07);
  --text:#ffffff;
  --muted:#bbbbbb;
  --green:#28c76f;
  --red:#ff5b6e;
  --yellow:#ffb020;
  --blue:#00bfff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:system-ui,sans-serif;
  background:
    radial-gradient(circle at top,#250012 0%, #12020b 45%, #09090d 100%);
  color:var(--text);
  min-height:100vh;
  padding:18px;
}

.topbar{
  background:linear-gradient(135deg,var(--maroon),#ff4d88);
  border-radius:24px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.topbar h1{
  font-size:28px;
  margin-bottom:8px;
}

.topbar p{
  opacity:.9;
  line-height:1.6;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:var(--card);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:18px;
  text-align:center;
  backdrop-filter:blur(12px);
}

.stat h2{
  font-size:26px;
  margin-bottom:6px;
  color:var(--pink);
}

.stat span{
  font-size:13px;
  color:var(--muted);
}

.section-title{
  margin:25px 0 15px;
  color:var(--pink);
  font-size:22px;
}

.card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  backdrop-filter:blur(10px);
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:4px;
}

.value{
  font-weight:700;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
  margin-top:8px;
}

.ON_TIME{
  background:rgba(40,199,111,.18);
  color:#8ef0b4;
}

.LATE{
  background:rgba(255,91,110,.18);
  color:#ff9aa7;
}

.EARLY{
  background:rgba(255,176,32,.18);
  color:#ffd27c;
}

.OVERTIME{
  background:rgba(0,191,255,.18);
  color:#8ddfff;
}

.EARLY_EXIT{
  background:rgba(255,91,110,.18);
  color:#ff9aa7;
}

.loader{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}

.empty{
  background:var(--card);
  padding:30px;
  border-radius:18px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:850px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:550px){

  body{
    padding:12px;
  }

  .topbar h1{
    font-size:22px;
  }

  .stats{
    grid-template-columns:1fr;
  }

}

</style>
</head>
<body>

<div class="topbar">

  <h1>
    📅 My Attendance
  </h1>

  <p>
    Track your attendance activity, clock in history,
    punctuality and work consistency inside the
    Tyneceploh Educational Foundation attendance system.
  </p>

</div>

<div class="stats">

  <div class="stat">
    <h2 id="presentCount">0</h2>
    <span>Days Present</span>
  </div>

  <div class="stat">
    <h2 id="lateCount">0</h2>
    <span>Late Arrivals</span>
  </div>

  <div class="stat">
    <h2 id="overtimeCount">0</h2>
    <span>Overtime</span>
  </div>

  <div class="stat">
    <h2 id="attendanceRate">0%</h2>
    <span>Attendance Rate</span>
  </div>

</div>

<h2 class="section-title">
  Attendance Timeline
</h2>

<div id="attendanceList">

  <div class="loader">
    Loading attendance records...
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(
  localStorage.getItem("user")
);

if(!user){

  location.href = "login.html";

}

if(user.role === "student"){

  location.href = "login.html";

}

const attendanceList =
  document.getElementById("attendanceList");

function formatTime(timestamp){

  if(!timestamp) return "-";

  return new Date(timestamp)
    .toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });

}

function formatDate(date){

  const d = new Date(date);

  return d.toLocaleDateString([],{
    weekday:"long",
    month:"long",
    day:"numeric",
    year:"numeric"
  });

}

async function loadAttendance(){

  try{

    const snap = await getDocs(
      collection(db,"attendanceDaily")
    );

    let records = [];

    snap.forEach(d=>{

      const data = d.data();

      if(data.userId === user.userId){

        records.push(data);

      }

    });

    records.sort((a,b)=>
      (b.createdAt || 0) -
      (a.createdAt || 0)
    );

    renderStats(records);

    renderAttendance(records);

  }catch(err){

    console.error(err);

    attendanceList.innerHTML = `

      <div class="empty">
        Failed to load attendance records.
      </div>

    `;

  }

}

function renderStats(records){

  const present =
    records.length;

  const late =
    records.filter(r=>
      r.clockIn?.status === "LATE"
    ).length;

  const overtime =
    records.filter(r=>
      r.clockOut?.status === "OVERTIME"
    ).length;

  const rate =
    present > 0
    ? Math.min(
        100,
        Math.round(
          ((present - late) / present) * 100
        )
      )
    : 0;

  document.getElementById(
    "presentCount"
  ).innerText = present;

  document.getElementById(
    "lateCount"
  ).innerText = late;

  document.getElementById(
    "overtimeCount"
  ).innerText = overtime;

  document.getElementById(
    "attendanceRate"
  ).innerText = rate + "%";

}

function renderAttendance(records){

  if(records.length === 0){

    attendanceList.innerHTML = `

      <div class="empty">
        No attendance records yet.
      </div>

    `;

    return;

  }

  attendanceList.innerHTML =
    records.map(r=>`

      <div class="card">

        <div class="row">

          <div>
            <div class="label">
              Date
            </div>

            <div class="value">
              ${formatDate(r.date)}
            </div>
          </div>

          <div>
            <div class="label">
              Role
            </div>

            <div class="value">
              ${capitalize(r.role)}
            </div>
          </div>

        </div>

        <hr style="
          border:none;
          border-top:1px solid rgba(255,255,255,.08);
          margin:18px 0;
        ">

        <div class="row">

          <div>

            <div class="label">
              Clock In
            </div>

            <div class="value">
              ${formatTime(r.clockIn?.time)}
            </div>

            <div class="
              badge
              ${r.clockIn?.status || ""}
            ">
              ${r.clockIn?.status || "-"}
            </div>

          </div>

          <div>

            <div class="label">
              Clock Out
            </div>

            <div class="value">
              ${
                r.clockOut
                ? formatTime(r.clockOut?.time)
                : "Still Active"
              }
            </div>

            ${
              r.clockOut
              ? `
                <div class="
                  badge
                  ${r.clockOut?.status || ""}
                ">
                  ${r.clockOut?.status || "-"}
                </div>
              `
              : ""
            }

          </div>

        </div>

      </div>

    `).join("");

}

function capitalize(text){

  if(!text) return "";

  return text.charAt(0)
    .toUpperCase() +
    text.slice(1);

}

loadAttendance();

</script>

</body>
</html>
