<!DOCTYPE html>
<html>
<head>
  <title>My Attendance - TEF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    :root{
      --bg:#f4f4f4;
      --card:#ffffff;
      --text:#222;
      --muted:#666;
      --green:#27ae60;
      --red:#c0392b;
      --orange:#e67e22;
      --blue:#3498db;
      --shadow:0 10px 25px rgba(0,0,0,0.08);
      --radius:14px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:sans-serif;
      background:var(--bg);
      padding:20px;
      color:var(--text);
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    .header{
      background:linear-gradient(135deg,#800000,#ff4d6d);
      color:white;
      padding:22px;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      margin-bottom:20px;
      text-align:center;
    }

    .header h2{
      margin:0;
      font-size:24px;
    }

    .header p{
      margin-top:6px;
      font-size:13px;
      opacity:0.9;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      gap:12px;
      margin-bottom:20px;
    }

    .card{
      background:var(--card);
      padding:14px;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      text-align:center;
      transition:0.2s;
    }

    .card:hover{
      transform:translateY(-3px);
    }

    .label{
      font-size:13px;
      color:var(--muted);
    }

    .big{
      font-size:22px;
      font-weight:bold;
      margin-top:6px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:var(--card);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    th,td{
      padding:10px;
      text-align:center;
      border-bottom:1px solid #eee;
      font-size:13px;
    }

    th{
      background:#2c3e50;
      color:white;
    }

    tr:hover{
      background:#fafafa;
    }

    .late{ color:var(--orange); font-weight:bold; }
    .early{ color:var(--blue); font-weight:bold; }
    .good{ color:var(--green); font-weight:bold; }
    .bad{ color:var(--red); font-weight:bold; }

    .empty{
      text-align:center;
      padding:20px;
      color:var(--muted);
    }

  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>My Attendance Report</h2>
    <p>Your daily rhythm, tracked clearly and honestly</p>
  </div>

  <div class="grid">

    <div class="card">
      <div class="label">Total Days</div>
      <div class="big" id="total">0</div>
    </div>

    <div class="card">
      <div class="label">Present</div>
      <div class="big good" id="present">0</div>
    </div>

    <div class="card">
      <div class="label">Late Days</div>
      <div class="big late" id="late">0</div>
    </div>

    <div class="card">
      <div class="label">Early Exit</div>
      <div class="big early" id="early">0</div>
    </div>

    <div class="card">
      <div class="label">Flags</div>
      <div class="big bad" id="flags">0</div>
    </div>

    <div class="card">
      <div class="label">Avg Hours/Day</div>
      <div class="big" id="avg">0</div>
    </div>

  </div>

  <table>

    <thead>
      <tr>
        <th>Date</th>
        <th>Clock In</th>
        <th>Clock Out</th>
        <th>Status</th>
        <th>Hours</th>
        <th>Flags</th>
      </tr>
    </thead>

    <tbody id="body"></tbody>

  </table>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  location.href = "login.html";
}

function hours(a,b){
  if(!a || !b) return 0;
  return ((b-a)/(1000*60*60));
}

async function load(){

  const snap = await getDocs(collection(db,"attendanceDaily"));

  let total=0, present=0, late=0, early=0, flags=0;
  let sumHours=0;

  let rows="";

  snap.forEach(d=>{

    const a = d.data();

    if(a.userId !== user.userId) return;

    total++;

    let status = "ABSENT";
    let hrs = 0;
    let flagList = [];

    if(a.clockIn){

      present++;
      status = a.clockIn.status || "ON_TIME";

      if(status === "LATE") late++;
      if(status === "EARLY") early++;

      if(a.clockOut){
        hrs = hours(a.clockIn.time,a.clockOut.time);
        sumHours += hrs;
      }

      if(a.clockIn.flag) flagList.push(a.clockIn.flag);
      if(a.clockOut?.flag) flagList.push(a.clockOut.flag);

    }

    rows += `
      <tr>
        <td>${a.date}</td>
        <td>${a.clockIn ? new Date(a.clockIn.time).toLocaleTimeString() : "-"}</td>
        <td>${a.clockOut ? new Date(a.clockOut.time).toLocaleTimeString() : "-"}</td>
        <td class="${status==='LATE'?'late':status==='EARLY'?'early':'good'}">${status}</td>
        <td>${hrs.toFixed(2)}</td>
        <td class="bad">${flagList.length ? flagList.join(", ") : "OK"}</td>
      </tr>
    `;

  });

  document.getElementById("body").innerHTML =
    rows || `<tr><td colspan="6" class="empty">No attendance yet</td></tr>`;

  document.getElementById("total").innerText = total;
  document.getElementById("present").innerText = present;
  document.getElementById("late").innerText = late;
  document.getElementById("early").innerText = early;
  document.getElementById("flags").innerText = flags;

  document.getElementById("avg").innerText =
    total ? (sumHours/total).toFixed(2) : 0;

}

load();

</script>

</body>
</html>
