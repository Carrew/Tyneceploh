<!DOCTYPE html>
<html>
<head>
  <title>Janitor Management - TEF</title>

  <style>
    :root {
      --maroon: #800000;
      --pink: #ffc0cb;
      --bg: #0b0b0f;
      --card: rgba(255,255,255,0.06);
      --text: #fff;
    }

    body {
      font-family: system-ui;
      background: radial-gradient(circle at top, #1a0010, var(--bg));
      color: white;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: var(--pink);
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--maroon), var(--pink));
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .notify {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.7);
      border-left: 4px solid var(--pink);
      padding: 10px 14px;
      border-radius: 8px;
      transform: translateX(120%);
      transition: 0.3s;
    }

    .notify.show {
      transform: translateX(0);
    }

    .card {
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      margin-top: 15px;
      border-left: 4px solid var(--pink);
    }

    .small {
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<h2>🧹 Create Janitor</h2>

<div id="notify" class="notify"></div>

<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone">
<input id="gender" placeholder="Gender">
<input id="address" placeholder="Address">
<input id="dob" placeholder="Date of Birth">
<input id="emergency" placeholder="Emergency Contact">

<input id="pin" placeholder="PIN (auto or manual)">
<input type="file" id="photo">

<button onclick="create()" id="btn">Create Janitor</button>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

function notify(msg){
  const n = document.getElementById("notify");
  n.innerText = msg;
  n.classList.add("show");
  setTimeout(()=>n.classList.remove("show"), 2500);
}

function genID(num){
  return "JAN" + Date.now().toString().slice(-4) + num;
}

function genPIN(){
  return Math.floor(1000 + Math.random()*9000).toString();
}

// CLOUDINARY UPLOAD
async function uploadImage(file){
  if(!file) return "";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", "Tyneceploh");

  const res = await fetch("https://api.cloudinary.com/v1_1/dfyzyf9eo/image/upload", {
    method:"POST",
    body: formData
  });

  const data = await res.json();
  return data.secure_url || "";
}

window.create = async function(){

  const btn = document.getElementById("btn");
  btn.disabled = true;
  btn.innerText = "Creating...";

  try {
    const snap = await getDocs(collection(db,"users"));

    let count = 0;
    snap.forEach(d=>{
      if(d.data().role === "janitor") count++;
    });

    const file = document.getElementById("photo").files[0];
    const photoURL = await uploadImage(file);

    const id = genID(count+1);
    const pin = document.getElementById("pin").value || genPIN();

    const data = {
      userId: id,
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      gender: document.getElementById("gender").value,
      address: document.getElementById("address").value,
      dob: document.getElementById("dob").value,
      emergency: document.getElementById("emergency").value,
      pin,
      role: "janitor",
      status: "active",
      createdAt: Date.now()
    };

    if(photoURL) data.photoURL = photoURL;

    await addDoc(collection(db,"users"), data);

    notify("Janitor created: " + id);

    document.querySelectorAll("input").forEach(i => i.value = "");

  } catch(err){
    notify("Error creating janitor");
  }

  btn.disabled = false;
  btn.innerText = "Create Janitor";
};

</script>

</body>
</html>
