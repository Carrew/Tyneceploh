<!DOCTYPE html>
<html>
<head>
  <title>TEF Academic Calendar Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      margin:0;
      padding:20px;
      background: radial-gradient(circle at top, #1a0010, #0b0b0f);
      font-family:sans-serif;
      color:white;
    }

    .container{
      max-width:1100px;
      margin:auto;
    }

    .box{
      background: rgba(255,255,255,0.05);
      padding:20px;
      border-radius:14px;
      margin-bottom:20px;
      backdrop-filter: blur(10px);
    }

    h2{
      margin-top:0;
      color:#ffc0cb;
    }

    input,select,textarea,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      box-sizing:border-box;
      background: rgba(255,255,255,0.08);
      color:white;
      outline:none;
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    button{
      background: linear-gradient(135deg, #800000, #ffc0cb);
      cursor:pointer;
      font-weight:bold;
    }

    .session-card,
    .event-card{
      background: rgba(255,255,255,0.04);
      padding:15px;
      border-radius:12px;
      margin-top:15px;
      border-left:4px solid #ffc0cb;
    }

    .active{
      border-left-color:#2ecc71;
    }

    .badge{
      display:inline-block;
      padding:5px 12px;
      border-radius:20px;
      font-size:12px;
      font-weight:bold;
      margin-top:10px;
    }

    .active-badge{
      background:#2ecc71;
    }

    .inactive-badge{
      background:#7f8c8d;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .actions{
      margin-top:15px;
      display:flex;
      gap:10px;
    }

    .danger{ background:#c0392b; }
    .blue{ background:#2980b9; }

    .msg{
      margin-top:15px;
      padding:12px;
      border-radius:10px;
    }

    .ok{ background:rgba(46,204,113,0.2); }
    .bad{ background:rgba(231,76,60,0.2); }

    @media(max-width:700px){
      .row{ grid-template-columns:1fr; }
    }

  </style>
</head>

<body>

<div class="container">

  <div class="box">

    <h2>Academic Session Manager</h2>

    <input type="hidden" id="sessionEditId">

    <input id="sessionName" placeholder="2026 / 2027">

    <div class="row">
      <input type="date" id="sessionStart">
      <input type="date" id="sessionEnd">
    </div>

    <button onclick="saveSession()">Save Academic Session</button>

    <div id="sessionMsg"></div>

  </div>

  <div class="box">

    <h2>Calendar Event Builder</h2>

    <input type="hidden" id="eventEditId">

    <select id="eventSession"></select>

    <input id="eventTitle" placeholder="Event title">

    <textarea id="eventDescription" placeholder="Description"></textarea>

    <select id="eventCategory">
      <option>Holiday</option>
      <option>Exam</option>
      <option>Sports</option>
      <option>Meeting</option>
      <option>Academic</option>
      <option>Deadline</option>
      <option>Celebration</option>
      <option>Emergency</option>
      <option>Other</option>
    </select>

    <div class="row">
      <input type="date" id="eventStart">
      <input type="date" id="eventEnd">
    </div>

    <button onclick="saveEvent()">Save Calendar Event</button>

    <div id="eventMsg"></div>

  </div>

  <div class="box">
    <h2>Academic Sessions</h2>
    <div id="sessions">Loading...</div>
  </div>

  <div class="box">
    <h2>Calendar Events</h2>
    <div id="events">Loading...</div>
  </div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDjswYVR2ijJLil3hnHlzBq9NLMW5VHVg4",
  authDomain:"tyneceploh.firebaseapp.com",
  projectId:"tyneceploh"
});

const db = getFirestore(app);

const user = JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "admin"){
  location.href = "login.html";
}

// ⚡ lightweight cache
let sessionsCache = [];
let eventsCache = [];

// -------------------- LOAD --------------------
async function loadAll(){
  await loadSessions();
  await loadEvents();
}
loadAll();

// -------------------- SESSIONS --------------------
async function loadSessions(){

  const snap = await getDocs(
    query(collection(db,"academicSessions"), orderBy("createdAt","desc"))
  );

  sessionsCache = [];

  snap.forEach(d=>{
    sessionsCache.push({ docId:d.id, ...d.data() });
  });

  renderSessions();
  renderDropdown();
}

function renderDropdown(){
  eventSession.innerHTML = sessionsCache.length
    ? sessionsCache.map(s=>`<option value="${s.name}">${s.name}</option>`).join("")
    : `<option>No Sessions</option>`;
}

function renderSessions(){

  sessions.innerHTML = sessionsCache.length
    ? sessionsCache.map(s=>`
      <div class="session-card ${s.active ? "active":""}">
        <h3>${s.name}</h3>

        <div class="badge ${s.active ? "active-badge":"inactive-badge"}">
          ${s.active ? "ACTIVE":"INACTIVE"}
        </div>

        <p>
          <b>Start:</b> ${s.startDate}<br><br>
          <b>End:</b> ${s.endDate}
        </p>

        <div class="actions">
          <button class="blue" onclick="activateSession('${s.docId}')">Activate</button>
          <button class="danger" onclick="deleteSession('${s.docId}')">Delete</button>
        </div>
      </div>
    `).join("")
    : "<p>No sessions yet</p>";
}

// -------------------- SAVE SESSION --------------------
window.saveSession = async function(){

  if(!sessionName.value || !sessionStart.value || !sessionEnd.value){
    return showSessionMsg("Fill all fields","bad");
  }

  await addDoc(collection(db,"academicSessions"),{
    name: sessionName.value,
    startDate: sessionStart.value,
    endDate: sessionEnd.value,
    active:false,
    createdAt: Date.now(),
    createdBy: user.userId
  });

  sessionName.value = "";
  sessionStart.value = "";
  sessionEnd.value = "";

  showSessionMsg("Session saved","ok");
  loadSessions();
};

// -------------------- ACTIVATE SESSION --------------------
window.activateSession = async function(id){

  // only update if needed (performance fix)
  const updates = sessionsCache.map(s=>{
    return updateDoc(doc(db,"academicSessions",s.docId),{
      active: s.docId === id
    });
  });

  await Promise.all(updates);
  loadSessions();
};

// -------------------- DELETE SESSION --------------------
window.deleteSession = async function(id){
  if(!confirm("Delete session?")) return;
  await deleteDoc(doc(db,"academicSessions",id));
  loadSessions();
};

// -------------------- EVENTS --------------------
async function loadEvents(){

  const snap = await getDocs(
    query(collection(db,"schoolCalendar"), orderBy("startDate","asc"))
  );

  eventsCache = [];

  snap.forEach(d=>{
    eventsCache.push({ docId:d.id, ...d.data() });
  });

  renderEvents();
}

function renderEvents(){

  events.innerHTML = eventsCache.length
    ? eventsCache.map(e=>`
      <div class="event-card">
        <h3>${e.title}</h3>

        <div class="badge">${e.category}</div>

        <p>
          <b>Session:</b> ${e.session}<br><br>
          ${e.description || "No description"}
        </p>

        <b>Start:</b> ${e.startDate}<br><br>
        <b>End:</b> ${e.endDate}
      </div>
    `).join("")
    : "<p>No events found</p>";
}

// -------------------- SAVE EVENT --------------------
window.saveEvent = async function(){

  if(!eventSession.value || !eventTitle.value || !eventStart.value || !eventEnd.value){
    return showEventMsg("Fill required fields","bad");
  }

  await addDoc(collection(db,"schoolCalendar"),{
    session:eventSession.value,
    title:eventTitle.value,
    description:eventDescription.value,
    category:eventCategory.value,
    startDate:eventStart.value,
    endDate:eventEnd.value,
    createdBy:user.userId,
    createdAt:Date.now(),
    status:"active"
  });

  eventTitle.value = "";
  eventDescription.value = "";
  eventStart.value = "";
  eventEnd.value = "";

  showEventMsg("Event created","ok");
  loadEvents();
};

// -------------------- MESSAGES --------------------
function showSessionMsg(t,type){
  sessionMsg.className = "msg " + type;
  sessionMsg.textContent = t;
}

function showEventMsg(t,type){
  eventMsg.className = "msg " + type;
  eventMsg.textContent = t;
}

</script>

</body>
</html>
